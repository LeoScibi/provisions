<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Lists</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=41">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
<header class="topbar no-print" id="topbar"></header>
<main>
  <div class="no-print">
    <h2>Cutting &amp; packing lists</h2>
  </div>
  <div id="signedOutNotice" class="note no-print" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>
  <div id="listsCard" style="display:none;">
    <div class="toolbar no-print" style="margin-bottom:16px;">
      <div class="week-nav">
        <button type="button" class="btn ghost sm" id="prevWeekBtn" aria-label="Previous week">&larr;</button>
        <span id="weekLabel" class="week-label"></span>
        <button type="button" class="btn ghost sm" id="nextWeekBtn" aria-label="Next week">&rarr;</button>
        <button type="button" class="btn ghost sm" id="thisWeekBtn">This week</button>
      </div>
      <button type="button" class="btn ghost sm" id="reloadBtn">Reload</button>
      <button type="button" class="btn ghost sm" id="printCutBtn">Print cutting list</button>
      <button type="button" class="btn ghost sm" id="printPackBtn">Print packing slips</button>
      <button type="button" class="btn ghost sm" id="printNotesBtn">Print delivery notes</button>
      <button type="button" class="btn ghost sm" id="printLabelsBtn">Print box labels</button>
      <label style="display:inline-flex; align-items:center; gap:6px; margin:0; text-transform:none; font-family:Archivo,sans-serif; font-size:13px; color:var(--steel); font-weight:400; letter-spacing:normal;">
        <input type="checkbox" id="showAllToggle" style="width:auto;"> Show dispatched orders too
      </label>
    </div>
    <div id="listsOut"></div>
    <div id="printOut"></div>
    <div id="status" class="mono no-print" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
  </div>
</main>
<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=7"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script>
  let token = null;
  let weekOffset = 0;
  // Everything loadLists() read, kept so reordering drops re-renders
  // without another round trip to the sheet.
  let data = null;
  let saveTimer = null;

  function setStatus(msg, kind) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }
  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('listsCard').style.display = ok ? 'block' : 'none';
    return ok;
  }

  function toObjects(rows) {
    if (!rows.length) return [];
    const [head, ...rest] = rows;
    return rest.map(r => {
      const o = {};
      head.forEach((h, i) => { o[h] = r[i] ?? ''; });
      return o;
    });
  }

  // ---- week helpers — weeks run Monday–Sunday; offset 0 = the week
  // containing today. Orders are picked by their DELIVERY DATE. ----

  function mondayOf(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function weekRange(offset) {
    const start = mondayOf(new Date());
    start.setDate(start.getDate() + offset * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return { start, end };
  }

  // Local-date ISO string (not toISOString, which converts to UTC and can
  // shift the date near midnight in a +ve timezone like BST).
  function isoDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function fmtWeekRange(start, end) {
    const sameMonth = start.getMonth() === end.getMonth();
    const s = start.toLocaleDateString('en-GB', sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' });
    const e = end.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    return `${s}–${e}`;
  }

  function fmtDateShort(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function renderWeekLabel() {
    const { start, end } = weekRange(weekOffset);
    const prefix = weekOffset === 0 ? 'This week' : weekOffset === 1 ? 'Next week' : weekOffset === -1 ? 'Last week' : 'Week of';
    document.getElementById('weekLabel').textContent = `${prefix} · ${fmtWeekRange(start, end)}`;
    document.getElementById('thisWeekBtn').style.display = weekOffset === 0 ? 'none' : '';
  }

  async function loadLists() {
    if (!requireAuth()) return;
    // Don't drop a truck-order change still waiting to save.
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await saveDrops(); }
    const cfg = getStoredConfig();
    renderWeekLabel();
    setStatus('Loading...');
    try {
      const groupsP = loadProductGroups(cfg.spreadsheetId); // in parallel with the reads below
      const [orderRows, lineRows, allocRows, productRows, deliveryRows, customerRows, poRows, polRows] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Orders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'OrderLines!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Products!A:AZ', token),
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Customers!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:Z', token)
      ]);

      const productByCode = {};
      const products = toObjects(productRows);
      products.forEach(p => { productByCode[p['Product code']] = p; });
      registerProducts(products);
      registerProductGroups(await groupsP);

      const deliveryByKey = {};
      toObjects(deliveryRows).forEach(d => {
        deliveryByKey[`${d['PRODUCT CODE']} ${d['BATCH/LOT NUMBER']}`] = d;
      });

      const customerByName = {};
      toObjects(customerRows).forEach(c => { customerByName[c['Customer name (as in Xero)']] = c; });

      // DROP ORDER and BOXES were appended to Orders after launch — until
      // Setup has been re-run those columns don't exist and can't be saved.
      const dropIdx = (orderRows[0] || []).indexOf('DROP ORDER');
      const boxesIdx = (orderRows[0] || []).indexOf('BOXES');

      data = {
        orders: toObjects(orderRows).map((o, i) => ({ ...o, rowNumber: i + 2 })),
        lines: toObjects(lineRows),
        allocs: toObjects(allocRows),
        productByCode, deliveryByKey, customerByName,
        // PO line → its PO, for lines held by a reservation on stock still arriving.
        poOfLine: (() => {
          const pos = Object.fromEntries(toObjects(poRows).map(po => [po.ID, po]));
          return Object.fromEntries(toObjects(polRows).map(l => [l.ID, pos[l['PO ID']] || { ID: l['PO ID'] }]));
        })(),
        dropCol: dropIdx >= 0 ? colLetter(dropIdx + 1) : null,
        boxesCol: boxesIdx >= 0 ? colLetter(boxesIdx + 1) : null
      };
      renderLists();
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  // ---- building the lists ----

  // "Comté Petite 10/14M — 1/4 wheel 9kg" → cheese "Comté Petite 10/14M",
  // portion "1/4 wheel 9kg". Product names use an em dash for the cut.
  function splitPortionName(name) {
    const i = name.indexOf(' — ');
    return i < 0 ? { cheese: name, portion: '' } : { cheese: name.slice(0, i), portion: name.slice(i + 3) };
  }

  function zoneOf(order) {
    const c = data.customerByName[order.CUSTOMER];
    return (c && c['Delivery zone']) || '';
  }

  function weekOrders() {
    const { start, end } = weekRange(weekOffset);
    const startIso = isoDate(start), endIso = isoDate(end);
    const showAll = document.getElementById('showAllToggle').checked;
    const open = data.orders.filter(o => showAll || o.STATUS !== 'Dispatched');
    return {
      inWeek: open.filter(o => o['DELIVERY DATE'] >= startIso && o['DELIVERY DATE'] <= endIso),
      undated: open.filter(o => !o['DELIVERY DATE'])
    };
  }

  // London drops in truck order: saved DROP ORDER first (1 = first drop),
  // then anything not placed yet, alphabetically, at the end.
  function sortByDrop(orders) {
    return orders.slice().sort((a, b) => {
      const da = parseInt(a['DROP ORDER'], 10), db = parseInt(b['DROP ORDER'], 10);
      const ha = !isNaN(da), hb = !isNaN(db);
      if (ha && hb && da !== db) return da - db;
      if (ha !== hb) return ha ? -1 : 1;
      return a.CUSTOMER.localeCompare(b.CUSTOMER);
    });
  }

  // Cheese-centric: every portion cut from the same wheel sits under one
  // heading, so the cutter opens each wheel once and labels each piece
  // with its customer. Only cut-to-order lines (products with a
  // "Cut from (code)") need cutting — whole items are just picked.
  function buildCutGroups(orders) {
    const groups = {};
    orders.forEach(order => {
      data.lines.filter(l => l['ORDER ID'] === order.ID).forEach(l => {
        const prod = data.productByCode[l['PRODUCT CODE']];
        if (!prod || !prod['Cut from (code)']) return;
        const parentCode = prod['Cut from (code)'];
        const parent = data.productByCode[parentCode];
        const { cheese, portion } = splitPortionName(prod['Product name']);
        if (!groups[parentCode]) {
          groups[parentCode] = {
            code: parentCode,
            name: parent ? splitPortionName(parent['Product name']).cheese : cheese,
            rows: []
          };
        }
        const qty = parseFloat(l['QTY ORDERED']) || 0;
        const nominal = parseFloat(prod['Nominal weight (kg)']) || 0;
        groups[parentCode].rows.push({
          product: prod,
          portion: portion || prod['Product name'],
          code: prod['Product code'],
          qty, unit: l.UNIT,
          kg: l.UNIT === 'kg' ? qty : qty * nominal,
          customer: order.CUSTOMER,
          zone: zoneOf(order),
          orderId: order.ID,
          cutLife: prod['Cut shelf life (days)'],
          // The wheel lot(s) this piece was allocated from, when it has been.
          lots: data.allocs.filter(a => a['ORDER LINE ID'] === l.ID).map(a => a['PO LINE ID']
            ? `awaiting ${(data.poOfLine[a['PO LINE ID']] || {}).ID || 'PO'}`
            : a['BATCH/LOT NUMBER'])
        });
      });
    });
    const zoneRank = z => z === 'Out of London' ? 0 : z === 'London' ? 1 : 2;
    return Object.values(groups)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(g => {
        g.rows.sort((a, b) => zoneRank(a.zone) - zoneRank(b.zone) || a.customer.localeCompare(b.customer));
        return g;
      });
  }

  function packLines(order) {
    return data.lines.filter(l => l['ORDER ID'] === order.ID).map(l => {
      const prod = data.productByCode[l['PRODUCT CODE']];
      const ordered = parseFloat(l['QTY ORDERED']) || 0;
      const isCut = !!(prod && prod['Cut from (code)']);
      const lots = data.allocs.filter(a => a['ORDER LINE ID'] === l.ID).map(a => {
        if (a['PO LINE ID']) {
          const po = data.poOfLine[a['PO LINE ID']] || {};
          return { awaiting: po.ID || 'PO', due: po['EXPECTED END DATE'] || po['EXPECTED START DATE'] || '', qty: parseFloat(a['QTY ALLOCATED']) || 0 };
        }
        const del = data.deliveryByKey[`${a['PRODUCT CODE']} ${a['BATCH/LOT NUMBER']}`];
        return { lot: a['BATCH/LOT NUMBER'], qty: parseFloat(a['QTY ALLOCATED']) || 0, bbe: del ? del['BEST BEFORE DATE'] : '' };
      });
      const allocated = lots.reduce((s, x) => s + x.qty, 0);
      return {
        product: prod,
        code: l['PRODUCT CODE'],
        name: prod ? prod['Product name'] : l['PRODUCT CODE'],
        qty: ordered, unit: l.UNIT,
        isCut, lots,
        short: !isCut && allocated + 0.0001 < ordered,
        // Set when the line was swapped for another product (orders.html → Replace).
        replaces: l.REPLACES ? (data.productByCode[l.REPLACES]?.['Product name'] || l.REPLACES) : ''
      };
    });
  }

  function renderLists() {
    const out = document.getElementById('listsOut');
    const { inWeek, undated } = weekOrders();
    const orderLink = (id) => `<a href="orders.html?open=${encodeURIComponent(id)}">${escapeHtml(id)}</a>`;

    const undatedNote = undated.length ? `
      <div class="note no-print">
        <strong>${undated.length} open order(s) have no delivery date</strong> and won't show on any week: ${undated.map(o => `${orderLink(o.ID)} (${escapeHtml(o.CUSTOMER)})`).join(', ')}.
      </div>` : '';

    if (!inWeek.length) {
      out.innerHTML = undatedNote + `<div class="empty" style="padding:24px;">No orders for delivery this week. Use the arrows to look at another week, or create one on the <a href="orders.html">Orders</a> page.</div>`;
      setStatus('');
      return;
    }

    const { outside, london, noZone } = packingGroups(inWeek);

    const cutGroups = buildCutGroups(inWeek);
    const shortCount = inWeek.reduce((n, o) => n + packLines(o).filter(l => l.short).length, 0);

    out.innerHTML = `
      ${undatedNote}
      ${shortCount ? `
        <div class="note no-print">
          <strong>${shortCount} line(s) still need stock allocated</strong> — they're flagged on the packing slips below. Allocate them on the <a href="orders.html" style="color:inherit; text-decoration:underline;">Orders</a> page.
        </div>` : ''}

      <section id="cutSection" class="list-section">
        <h3 class="list-h">Cutting list <span class="print-only muted" style="font-weight:400;">· ${escapeHtml(document.getElementById('weekLabel').textContent)}</span></h3>
        ${cutGroups.length ? cutGroups.map(g => {
          const kg = g.rows.reduce((s, r) => s + r.kg, 0);
          const pieces = g.rows.reduce((s, r) => s + (r.unit === 'kg' ? 1 : r.qty), 0);
          return `
          <div class="panel cut-group">
            <div class="panel-h">
              <h3>${escapeHtml(g.name)}</h3>
              <span class="code">${escapeHtml(g.code)}</span>
              <span class="muted" style="margin-left:auto; font-size:13px;">${pieces} piece(s) to cut · ≈ ${kg.toFixed(1)} kg</span>
            </div>
            <div class="scroll" style="overflow-x:auto;">
              <table><thead><tr><th class="tick-col"></th><th>Portion</th><th class="num">Qty</th><th>Label for</th><th>Zone</th><th>Wheel lot</th><th>Life after cut</th><th class="no-print">Order</th></tr></thead>
              <tbody>${g.rows.map(r => `
                <tr>
                  <td class="tick-col"><span class="tick-box"></span></td>
                  <td>${productCell(r.product, `<strong>${escapeHtml(r.portion)}</strong><br><span class="code">${escapeHtml(r.code)}</span>`)}</td>
                  <td class="num">${escapeHtml(qtyUnit(r.qty, r.unit))}</td>
                  <td>${escapeHtml(r.customer)}</td>
                  <td>${zoneTag(r.zone)}</td>
                  <td class="code">${r.lots.length ? r.lots.map(escapeHtml).join('<br>') : '<span class="tag t-warn">Not allocated</span>'}</td>
                  <td>${r.cutLife ? r.cutLife + ' day(s)' : '—'}</td>
                  <td class="no-print">${orderLink(r.orderId)}</td>
                </tr>`).join('')}
              </tbody></table>
            </div>
          </div>`;
        }).join('') : `<p class="muted" style="font-size:13px; margin-bottom:24px;">Nothing to cut this week — no cut-to-order portions on these orders.</p>`}
      </section>

      <section id="packSection" class="list-section">
        <h3 class="list-h">Packing slips</h3>
        ${outside.length ? `
          <h4 class="zone-h">Out of London <span class="muted">· courier collection, prepare first · ${outside.length} order(s)</span></h4>
          ${outside.map(o => slipHtml(o, null)).join('')}` : ''}
        ${london.length ? `
          <h4 class="zone-h">London <span class="muted">· in truck order · ${london.length} drop(s)</span></h4>
          ${data.dropCol ? `<p class="muted no-print" style="font-size:12.5px; margin:-4px 0 12px;">Drag the slips (or use the arrows) into the order they go on the truck — it saves automatically.</p>`
            : `<div class="note no-print">Re-run <a href="setup.html" style="color:inherit; text-decoration:underline;">Setup</a> to add the DROP ORDER column — until then you can reorder drops for printing, but the order won't be saved.</div>`}
          <div id="londonDrops">${london.map((o, i) => slipHtml(o, i + 1)).join('')}</div>` : ''}
        ${noZone.length ? `
          <h4 class="zone-h">No delivery zone <span class="muted">· set the customer's zone on the Customers page · ${noZone.length} order(s)</span></h4>
          ${noZone.map(o => slipHtml(o, null)).join('')}` : ''}
      </section>
    `;
    wireDrops();
    setStatus(`${inWeek.length} order(s) for delivery ${fmtWeekRange(weekRange(weekOffset).start, weekRange(weekOffset).end)}.`, 'ok');
  }

  // The order slips are packed in: Out of London first (courier), then
  // London in truck order, then anything with no zone. Delivery notes and
  // box labels print in the same order.
  function packingGroups(orders) {
    return {
      outside: orders.filter(o => zoneOf(o) === 'Out of London').sort((a, b) => a.CUSTOMER.localeCompare(b.CUSTOMER)),
      london: sortByDrop(orders.filter(o => zoneOf(o) === 'London')),
      noZone: orders.filter(o => !['London', 'Out of London'].includes(zoneOf(o))).sort((a, b) => a.CUSTOMER.localeCompare(b.CUSTOMER))
    };
  }

  function zoneTag(zone) {
    if (zone === 'London') return '<span class="tag t-chill">London</span>';
    if (zone === 'Out of London') return '<span class="tag t-ldo">Out of London</span>';
    return '<span class="tag t-warn">No zone</span>';
  }

  // One compact block per order: a single header line (drop, customer,
  // order, date, address) and one line per item, so a week's slips fit on
  // a screen and a London run can be reordered without much scrolling.
  function slipHtml(order, drop) {
    const cust = data.customerByName[order.CUSTOMER] || {};
    const lines = packLines(order);
    const lotsHtml = l => l.lots.map(x => x.awaiting
      ? `<span class="tag t-warn" title="Reserved on a purchase order not received yet">Awaiting ${escapeHtml(x.awaiting)}${x.due ? ' · ' + escapeHtml(fmtDateShort(x.due)) : ''}</span>`
      : `<span class="code">${escapeHtml(x.lot)}</span>${x.bbe ? ` <span class="muted">BB ${escapeHtml(fmtDateShort(x.bbe))}</span>` : ''}`).join('<br>');
    const fromHtml = l => l.isCut ? `<span class="tag t-chill">Cut piece · fridge</span>${l.lots.length ? '<br>' + lotsHtml(l) : ''}`
      : l.lots.length ? lotsHtml(l) : '<span class="tag t-warn">Not allocated</span>';
    return `
      <div class="panel slip" data-order-id="${escapeHtml(order.ID)}"${drop ? ' draggable="true"' : ''}>
        <div class="slip-h">
          ${drop ? `<span class="drag-handle no-print" title="Drag to reorder" aria-hidden="true">⋮⋮</span><span class="drop-no">Drop ${drop}</span>` : ''}
          <h3>${escapeHtml(order.CUSTOMER)}</h3>
          <span class="code"><a href="orders.html?open=${encodeURIComponent(order.ID)}">${escapeHtml(order.ID)}</a></span>
          <span class="muted" style="font-size:12px;">${escapeHtml(fmtDateShort(order['DELIVERY DATE']))}</span>
          ${order.STATUS === 'Dispatched' ? '<span class="tag t-ok">Dispatched</span>' : ''}
          <span class="slip-addr" title="${escapeHtml(cust['Delivery address'] || '')}">${escapeHtml(cust['Delivery address'] || 'No delivery address on file')}</span>
          <label class="slip-boxes no-print" title="Number of boxes — sets how many box labels print">Boxes
            <input type="number" min="0" step="1" inputmode="numeric" data-boxes="${escapeHtml(order.ID)}" value="${escapeHtml(order.BOXES || '')}" placeholder="–">
          </label>
          ${order.BOXES ? `<span class="print-only muted">${escapeHtml(order.BOXES)} box(es)</span>` : ''}
          ${drop ? `<span class="no-print" style="display:inline-flex; gap:4px;">
            <button type="button" class="btn ghost sm" data-move="-1" aria-label="Move up"${drop === 1 ? ' disabled' : ''}>&uarr;</button>
            <button type="button" class="btn ghost sm" data-move="1" aria-label="Move down">&darr;</button>
          </span>` : ''}
        </div>
        ${order.NOTES ? `<div class="slip-notes">Note: ${escapeHtml(order.NOTES)}</div>` : ''}
        ${lines.length ? lines.map(l => `
          <div class="slip-line${l.short ? ' short' : ''}">
            <span class="tick-box"></span>
            ${productThumb(l.product, 'xs')}
            <span class="sl-name" title="${escapeHtml(l.name)}${l.replaces ? ' — replaces ' + escapeHtml(l.replaces) : ''}">${escapeHtml(l.name)}<span class="code">${escapeHtml(l.code)}</span>${l.replaces ? `<span class="sl-replaces">replaces ${escapeHtml(l.replaces)}</span>` : ''}</span>
            <span class="sl-qty">${escapeHtml(qtyUnit(l.qty, l.unit))}</span>
            <span class="sl-from">${fromHtml(l)}</span>
          </div>`).join('') : '<div class="slip-line"><span></span><span></span><span class="muted">No lines on this order.</span></div>'}
      </div>`;
  }

  // ---- truck order: drag (mouse) or arrows (touch/keyboard) ----

  function wireDrops() {
    const box = document.getElementById('londonDrops');
    if (!box) return;
    let dragging = null;
    box.querySelectorAll('.slip').forEach(slip => {
      slip.addEventListener('dragstart', e => {
        dragging = slip;
        slip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      slip.addEventListener('dragend', () => {
        slip.classList.remove('dragging');
        dragging = null;
        applyDomOrder();
      });
    });
    box.addEventListener('dragover', e => {
      if (!dragging) return;
      e.preventDefault();
      const after = [...box.querySelectorAll('.slip:not(.dragging)')].find(s => {
        const r = s.getBoundingClientRect();
        return e.clientY < r.top + r.height / 2;
      });
      if (after) box.insertBefore(dragging, after); else box.appendChild(dragging);
    });
    box.addEventListener('click', e => {
      const btn = e.target.closest('[data-move]');
      if (!btn) return;
      const slip = btn.closest('.slip');
      if (btn.dataset.move === '-1' && slip.previousElementSibling) box.insertBefore(slip, slip.previousElementSibling);
      if (btn.dataset.move === '1' && slip.nextElementSibling) box.insertBefore(slip.nextElementSibling, slip);
      applyDomOrder(slip.dataset.orderId);
    });
  }

  // Renumbers the London orders from the slips' on-screen order, re-renders
  // and queues the save. `focusId` keeps keyboard focus on the moved slip.
  function applyDomOrder(focusId) {
    const ids = [...document.querySelectorAll('#londonDrops .slip')].map(s => s.dataset.orderId);
    let changed = false;
    ids.forEach((id, i) => {
      const o = data.orders.find(x => x.ID === id);
      if (String(o['DROP ORDER']) !== String(i + 1)) { o['DROP ORDER'] = String(i + 1); o._dirty = true; changed = true; }
    });
    if (!changed) return;
    renderLists();
    if (focusId) {
      const slip = document.querySelector(`#londonDrops .slip[data-order-id="${CSS.escape(focusId)}"]`);
      slip?.scrollIntoView({ block: 'nearest' });
    }
    if (!data.dropCol) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDrops, 700);
  }

  async function saveDrops() {
    saveTimer = null;
    const dirty = data.orders.filter(o => o._dirty);
    if (!dirty.length) return;
    const cfg = getStoredConfig();
    dirty.forEach(o => { o._dirty = false; });
    try {
      await sheetsBatchUpdateValues(cfg.spreadsheetId, dirty.map(o => ({
        range: `Orders!${data.dropCol}${o.rowNumber}`,
        values: [[parseInt(o['DROP ORDER'], 10)]]
      })), token);
      showToast('Truck order saved');
    } catch (err) {
      dirty.forEach(o => { o._dirty = true; });
      showToast('Couldn’t save the truck order: ' + err.message, 'error');
    }
  }

  // ---- box count: typed by the packer once an order is packed ----

  async function saveBoxes(input) {
    const order = data.orders.find(o => o.ID === input.dataset.boxes);
    if (!order) return;
    const n = input.value === '' ? '' : Math.max(0, Math.round(parseFloat(input.value) || 0));
    input.value = n;
    if (String(order.BOXES || '') === String(n)) return;
    if (!data.boxesCol) {
      showToast('Re-run Setup to add the BOXES column before box counts can be saved.', 'error');
      return;
    }
    const prev = order.BOXES;
    order.BOXES = String(n);
    try {
      await sheetsUpdateRange(getStoredConfig().spreadsheetId, `Orders!${data.boxesCol}${order.rowNumber}`, [[n]], token);
      showToast(`${order.CUSTOMER}: ${n === '' ? 'box count cleared' : n + ' box(es)'}`);
    } catch (err) {
      order.BOXES = prev;
      input.value = prev || '';
      showToast('Couldn’t save the box count: ' + err.message, 'error');
    }
  }
  document.getElementById('listsOut').addEventListener('change', e => {
    if (e.target.matches('[data-boxes]')) saveBoxes(e.target);
  });
  // Typing in the box field shouldn't start dragging its slip.
  document.getElementById('listsOut').addEventListener('mousedown', e => {
    const slip = e.target.closest('.slip[draggable]');
    if (slip && e.target.matches('input')) { slip.draggable = false; e.target.addEventListener('blur', () => { slip.draggable = true; }, { once: true }); }
  });

  // ---- delivery notes and box labels ----

  function weekPackingOrder() {
    const { outside, london, noZone } = packingGroups(weekOrders().inWeek);
    return [...outside, ...london.map((o, i) => ({ ...o, _drop: i + 1 })), ...noZone];
  }

  // One A4 page per order: who it's for, what's in it (no prices), lots and
  // best-befores for traceability, and a line for the customer to sign.
  function deliveryNotesHtml(orders) {
    return orders.map(o => {
      const cust = data.customerByName[o.CUSTOMER] || {};
      const lines = packLines(o);
      return `
        <div class="dn">
          <div class="dn-top">
            <img src="img/logo.png" alt="" class="dn-logo">
            <div class="dn-title">Delivery note</div>
          </div>
          <div class="dn-meta">
            <div><div class="dn-k">Deliver to</div><div class="dn-v"><strong>${escapeHtml(o.CUSTOMER)}</strong><br>${escapeHtml(cust['Delivery address'] || '')}</div></div>
            <div><div class="dn-k">Order</div><div class="dn-v">${escapeHtml(o.ID)}</div>
              <div class="dn-k">Delivery date</div><div class="dn-v">${escapeHtml(fmtDateShort(o['DELIVERY DATE']))}</div>
              ${o.BOXES ? `<div class="dn-k">Boxes</div><div class="dn-v">${escapeHtml(o.BOXES)}</div>` : ''}
              ${o._drop ? `<div class="dn-k">Drop</div><div class="dn-v">${o._drop}</div>` : ''}</div>
          </div>
          <table class="dn-table"><thead><tr><th>Product</th><th>Code</th><th class="num">Qty</th><th>Lot / best before</th></tr></thead>
          <tbody>${lines.map(l => `
            <tr>
              <td>${escapeHtml(l.name)}${l.replaces ? `<div class="dn-replaces">Replaces ${escapeHtml(l.replaces)}</div>` : ''}</td>
              <td>${escapeHtml(l.code)}</td>
              <td class="num">${escapeHtml(qtyUnit(l.qty, l.unit))}</td>
              <td>${l.isCut ? 'Cut to order' + (l.lots.length ? '<br>' : '') : ''}${l.lots.map(x => x.awaiting ? 'Awaiting delivery' : `${escapeHtml(x.lot)}${x.bbe ? ' · BB ' + escapeHtml(fmtDateShort(x.bbe)) : ''}`).join('<br>')}</td>
            </tr>`).join('')}</tbody></table>
          ${o.NOTES ? `<div class="dn-notes"><span class="dn-k">Notes</span> ${escapeHtml(o.NOTES)}</div>` : ''}
          <div class="dn-sign">
            <div>Received by</div><div>Signature</div><div>Date</div>
          </div>
        </div>`;
    }).join('');
  }

  // Four labels to an A4 sheet, one per box: "Box 2 of 3", the customer and
  // address large enough to read across a van. An order with no box count
  // gets a single label.
  function boxLabelsHtml(orders) {
    const labels = [];
    orders.forEach(o => {
      const cust = data.customerByName[o.CUSTOMER] || {};
      const n = Math.max(1, parseInt(o.BOXES, 10) || 1);
      for (let i = 1; i <= n; i++) {
        labels.push(`
          <div class="bl">
            <div class="bl-box">Box ${i} of ${n}</div>
            <div class="bl-cust">${escapeHtml(o.CUSTOMER)}</div>
            <div class="bl-addr">${escapeHtml(cust['Delivery address'] || '')}</div>
            <div class="bl-foot"><span>${escapeHtml(o.ID)} · ${escapeHtml(fmtDateShort(o['DELIVERY DATE']))}</span><span>${o._drop ? 'Drop ' + o._drop : escapeHtml(zoneOf(o) || '')}</span></div>
          </div>`);
      }
    });
    return `<div class="bl-sheet">${labels.join('')}</div>`;
  }

  // ---- printing one list at a time ----

  function printOnly(which) {
    if (which === 'notes' || which === 'labels') {
      const orders = weekPackingOrder();
      if (!orders.length) { showToast('No orders this week to print.', 'error'); return; }
      if (which === 'labels') {
        const missing = orders.filter(o => !(parseInt(o.BOXES, 10) > 0)).length;
        if (missing) showToast(`${missing} order(s) have no box count — printing one label for each.`);
      }
      document.getElementById('printOut').innerHTML = which === 'notes' ? deliveryNotesHtml(orders) : boxLabelsHtml(orders);
    }
    document.body.dataset.print = which;
    window.print();
  }
  window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

  function shiftWeek(delta) {
    weekOffset = delta === 0 ? 0 : weekOffset + delta;
    renderWeekLabel();
    if (data) renderLists();
  }

  document.getElementById('prevWeekBtn').addEventListener('click', () => shiftWeek(-1));
  document.getElementById('nextWeekBtn').addEventListener('click', () => shiftWeek(1));
  document.getElementById('thisWeekBtn').addEventListener('click', () => shiftWeek(0));
  document.getElementById('reloadBtn').addEventListener('click', loadLists);
  document.getElementById('showAllToggle').addEventListener('change', () => { if (data) renderLists(); });
  document.getElementById('printCutBtn').addEventListener('click', () => printOnly('cut'));
  document.getElementById('printPackBtn').addEventListener('click', () => printOnly('pack'));
  document.getElementById('printNotesBtn').addEventListener('click', () => printOnly('notes'));
  document.getElementById('printLabelsBtn').addEventListener('click', () => printOnly('labels'));
  window.addEventListener('load', loadLists);
  // An order opened in place (js/shell.js) may have changed lines or
  // allocations — re-read so the lists match.
  window.onRecordDialogClosed = loadLists;
</script>
</body>
</html>
