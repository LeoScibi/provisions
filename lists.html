<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Packing</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=48">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="theme-color" content="#2C3A57">
</head>
<body>
<header class="topbar no-print" id="topbar"></header>
<main>
  <div class="no-print">
    <h2>Packing</h2>
  </div>
  <div id="signedOutNotice" class="note no-print" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>
  <div id="listsCard" style="display:none;">
    <div class="toolbar no-print" style="margin-bottom:16px;">
      <div class="week-nav">
        <button type="button" class="btn ghost sm" id="prevWeekBtn" aria-label="Previous week">&larr;</button>
        <span id="weekLabel" class="week-label"></span>
        <button type="button" class="btn ghost sm" id="nextWeekBtn" aria-label="Next week">&rarr;</button>
        <button type="button" class="btn ghost sm" id="thisWeekBtn">This week</button>
      </div>
      <button type="button" class="btn ghost sm" id="reloadBtn">Reload</button>
      <button type="button" class="btn ghost sm" id="printPackBtn">Print packing slips</button>
      <button type="button" class="btn ghost sm" id="printNotesBtn">Print delivery notes</button>
      <button type="button" class="btn ghost sm" id="printLabelsBtn">Print box labels</button>
      <button type="button" class="btn ghost sm" id="xeroBtn">Export to Xero</button>
      <label class="toggle-label">
        <input type="checkbox" id="showAllToggle" style="width:auto;"> Show dispatched orders too
      </label>
    </div>
    <div id="dayChips" class="day-chips no-print"></div>
    <div id="listsOut"></div>
    <div id="printOut"></div>
    <div id="status" class="mono no-print" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
  </div>
</main>
<dialog id="xeroDialog">
  <form id="xeroForm" method="dialog"></form>
</dialog>
<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=12"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/cuts.js?v=1"></script>
<script src="js/xero-export.js?v=5"></script>
<script src="js/lists-data.js?v=2"></script>
<script>
  // Packing: one slip per order in the order they're packed (Out of London,
  // then each day's London run in truck order), box counts, delivery notes,
  // box labels and the Xero export. Data and the week picker: js/lists-data.js.
  let token = null;
  let saveTimer = null;

  function setStatus(msg, kind) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }
  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('listsCard').style.display = ok ? 'block' : 'none';
    return ok;
  }

  async function loadLists() {
    if (!requireAuth()) return;
    // Don't drop a truck-order change still waiting to save.
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await saveDrops(); }
    const cfg = getStoredConfig();
    renderWeekLabel();
    setStatus('Loading...');
    try {
      data = await loadListsData(cfg.spreadsheetId, token);
      renderLists();
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  function renderLists() {
    const out = document.getElementById('listsOut');
    const { inWeek, undated } = weekOrders();

    if (!inWeek.length) {
      out.innerHTML = listNotesHtml(inWeek, undated) + `<div class="empty" style="padding:24px;">No orders for delivery this week. Use the arrows to look at another week, or create one on the <a href="orders.html">Orders</a> page.</div>`;
      setStatus('');
      return;
    }

    const { outside, london, noZone } = packingGroups(inWeek);
    // One truck run per delivery date, each in its own drop order.
    const runs = {};
    london.forEach(o => { (runs[o['DELIVERY DATE']] = runs[o['DELIVERY DATE']] || []).push(o); });
    const runDates = Object.keys(runs).sort();

    out.innerHTML = `
      ${listNotesHtml(inWeek, undated)}
      <section id="packSection" class="list-section">
        <h3 class="list-h">Packing slips <span class="print-only muted" style="font-weight:400;">· ${escapeHtml(periodLabel())}</span></h3>
        ${outside.length ? `
          <h4 class="zone-h">Out of London <span class="muted">· courier collection, prepare first · ${outside.length} order(s)</span></h4>
          ${outside.map(o => slipHtml(o, null)).join('')}` : ''}
        ${london.length && !data.dropCol ? `<div class="note no-print">Re-run <a href="setup.html" style="color:inherit; text-decoration:underline;">Setup</a> to add the DROP ORDER column — until then you can reorder drops for printing, but the order won't be saved.</div>` : ''}
        ${runDates.map((day, r) => `
          <h4 class="zone-h">London${runDates.length > 1 || dayFilter ? ' · ' + escapeHtml(fmtDateShort(day)) : ''} <span class="muted">· in truck order · ${runs[day].length} drop(s)</span></h4>
          ${r === 0 && data.dropCol ? `<p class="muted no-print" style="font-size:12.5px; margin:-4px 0 12px;">Drag the slips (or use the arrows) into the order they go on the truck — it saves automatically.</p>` : ''}
          <div class="london-drops" data-run="${escapeHtml(day)}">${runs[day].map((o, i) => slipHtml(o, i + 1)).join('')}</div>`).join('')}
        ${noZone.length ? `
          <h4 class="zone-h">No delivery zone <span class="muted">· set the customer's zone on the Customers page · ${noZone.length} order(s)</span></h4>
          ${noZone.map(o => slipHtml(o, null)).join('')}` : ''}
      </section>
    `;
    wireDrops();
    setStatus(`${inWeek.length} order(s) for delivery ${dayFilter ? fmtDateShort(dayFilter) : fmtWeekRange(weekRange(weekOffset).start, weekRange(weekOffset).end)}.`, 'ok');
  }

  // One compact block per order: a single header line (drop, customer,
  // order, date, address) and one line per item, so a week's slips fit on
  // a screen and a London run can be reordered without much scrolling.
  function slipHtml(order, drop) {
    const cust = data.customerByName[order.CUSTOMER] || {};
    const lines = packLines(order);
    const lotsHtml = l => l.lots.map(x => x.awaiting
      ? `<span class="tag t-warn" title="Reserved on a purchase order not received yet">Awaiting ${escapeHtml(x.awaiting)}${x.due ? ' · ' + escapeHtml(fmtDateShort(x.due)) : ''}</span>`
      : `<span class="code">${escapeHtml(x.lot)}</span>${x.bbe ? ` <span class="muted">BB ${escapeHtml(fmtDateShort(x.bbe))}</span>` : ''}`).join('<br>');
    const fromHtml = l => l.isCut ? `<span class="tag t-chill">Cut piece · fridge</span>${l.lots.length ? '<br>' + lotsHtml(l) : ''}`
      : l.lots.length ? lotsHtml(l) : '<span class="tag t-warn">Not allocated</span>';
    return `
      <div class="panel slip" data-order-id="${escapeHtml(order.ID)}"${drop ? ' draggable="true"' : ''}>
        <div class="slip-h">
          ${drop ? `<span class="drag-handle no-print" title="Drag to reorder" aria-hidden="true">⋮⋮</span><span class="drop-no">Drop ${drop}</span>` : ''}
          <h3>${escapeHtml(order.CUSTOMER)}</h3>
          <span class="code"><a href="orders.html?open=${encodeURIComponent(order.ID)}">${escapeHtml(order.ID)}</a></span>
          <span class="muted" style="font-size:12px;">${escapeHtml(fmtDateShort(order['DELIVERY DATE']))}</span>
          ${order.STATUS === 'Dispatched' ? '<span class="tag t-ok">Dispatched</span>' : ''}
          <span class="slip-addr" title="${escapeHtml(cust['Delivery address'] || '')}">${escapeHtml(cust['Delivery address'] || 'No delivery address on file')}</span>
          <label class="slip-boxes no-print" title="Number of boxes — sets how many box labels print">Boxes
            <input type="number" min="0" step="1" inputmode="numeric" data-boxes="${escapeHtml(order.ID)}" value="${escapeHtml(order.BOXES || '')}" placeholder="–">
          </label>
          ${order.BOXES ? `<span class="print-only muted">${escapeHtml(order.BOXES)} box(es)</span>` : ''}
          ${drop ? `<span class="no-print" style="display:inline-flex; gap:4px;">
            <button type="button" class="btn ghost sm" data-move="-1" aria-label="Move up"${drop === 1 ? ' disabled' : ''}>&uarr;</button>
            <button type="button" class="btn ghost sm" data-move="1" aria-label="Move down">&darr;</button>
          </span>` : ''}
        </div>
        ${order.NOTES ? `<div class="slip-notes">Note: ${escapeHtml(order.NOTES)}</div>` : ''}
        ${lines.length ? lines.map(l => `
          <div class="slip-line${l.short ? ' short' : ''}">
            <span class="tick-box"></span>
            ${productThumb(l.product, 'xs')}
            <span class="sl-name" title="${escapeHtml(l.name)}${l.replaces ? ' — replaces ' + escapeHtml(l.replaces) : ''}">${escapeHtml(l.name)}<span class="code">${escapeHtml(l.code)}</span>${l.replaces ? `<span class="sl-replaces">replaces ${escapeHtml(l.replaces)}</span>` : ''}</span>
            <span class="sl-qty">${escapeHtml(qtyUnit(l.qty, l.unit))}${l.weighed ? ` · <strong>${l.weighed.toFixed(2)} kg</strong>` : ''}</span>
            <span class="sl-from">${fromHtml(l)}</span>
          </div>`).join('') : '<div class="slip-line"><span></span><span></span><span class="muted">No lines on this order.</span></div>'}
      </div>`;
  }

  // ---- truck order: drag (mouse) or arrows (touch/keyboard) ----

  function wireDrops() {
    document.querySelectorAll('.london-drops').forEach(wireRun);
  }

  function wireRun(box) {
    let dragging = null;
    box.querySelectorAll('.slip').forEach(slip => {
      slip.addEventListener('dragstart', e => {
        dragging = slip;
        slip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      slip.addEventListener('dragend', () => {
        slip.classList.remove('dragging');
        dragging = null;
        applyDomOrder(box);
      });
    });
    box.addEventListener('dragover', e => {
      if (!dragging) return;
      e.preventDefault();
      const after = [...box.querySelectorAll('.slip:not(.dragging)')].find(s => {
        const r = s.getBoundingClientRect();
        return e.clientY < r.top + r.height / 2;
      });
      if (after) box.insertBefore(dragging, after); else box.appendChild(dragging);
    });
    box.addEventListener('click', e => {
      const btn = e.target.closest('[data-move]');
      if (!btn) return;
      const slip = btn.closest('.slip');
      if (btn.dataset.move === '-1' && slip.previousElementSibling) box.insertBefore(slip, slip.previousElementSibling);
      if (btn.dataset.move === '1' && slip.nextElementSibling) box.insertBefore(slip.nextElementSibling, slip);
      applyDomOrder(box, slip.dataset.orderId);
    });
  }

  // Renumbers one day's London run from its slips' on-screen order,
  // re-renders and queues the save. `focusId` keeps the moved slip in view.
  function applyDomOrder(box, focusId) {
    const ids = [...box.querySelectorAll('.slip')].map(s => s.dataset.orderId);
    let changed = false;
    ids.forEach((id, i) => {
      const o = data.orders.find(x => x.ID === id);
      if (String(o['DROP ORDER']) !== String(i + 1)) { o['DROP ORDER'] = String(i + 1); o._dirty = true; changed = true; }
    });
    if (!changed) return;
    renderLists();
    if (focusId) {
      const slip = document.querySelector(`.london-drops .slip[data-order-id="${CSS.escape(focusId)}"]`);
      slip?.scrollIntoView({ block: 'nearest' });
    }
    if (!data.dropCol) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDrops, 700);
  }

  async function saveDrops() {
    saveTimer = null;
    const dirty = data.orders.filter(o => o._dirty);
    if (!dirty.length) return;
    const cfg = getStoredConfig();
    dirty.forEach(o => { o._dirty = false; });
    try {
      await sheetsBatchUpdateValues(cfg.spreadsheetId, dirty.map(o => ({
        range: `Orders!${data.dropCol}${o.rowNumber}`,
        values: [[parseInt(o['DROP ORDER'], 10)]]
      })), token);
      showToast('Truck order saved');
    } catch (err) {
      dirty.forEach(o => { o._dirty = true; });
      showToast('Couldn’t save the truck order: ' + err.message, 'error');
    }
  }

  // ---- box count: typed by the packer once an order is packed ----

  async function saveBoxes(input) {
    const order = data.orders.find(o => o.ID === input.dataset.boxes);
    if (!order) return;
    const n = input.value === '' ? '' : Math.max(0, Math.round(parseFloat(input.value) || 0));
    input.value = n;
    if (String(order.BOXES || '') === String(n)) return;
    if (!data.boxesCol) {
      showToast('Re-run Setup to add the BOXES column before box counts can be saved.', 'error');
      return;
    }
    const prev = order.BOXES;
    order.BOXES = String(n);
    try {
      await sheetsUpdateRange(getStoredConfig().spreadsheetId, `Orders!${data.boxesCol}${order.rowNumber}`, [[n]], token);
      showToast(`${order.CUSTOMER}: ${n === '' ? 'box count cleared' : n + ' box(es)'}`);
    } catch (err) {
      order.BOXES = prev;
      input.value = prev || '';
      showToast('Couldn’t save the box count: ' + err.message, 'error');
    }
  }
  document.getElementById('listsOut').addEventListener('change', e => {
    if (e.target.matches('[data-boxes]')) saveBoxes(e.target);
  });
  // Typing in the box field shouldn't start dragging its slip.
  document.getElementById('listsOut').addEventListener('mousedown', e => {
    const slip = e.target.closest('.slip[draggable]');
    if (slip && e.target.matches('input')) { slip.draggable = false; e.target.addEventListener('blur', () => { slip.draggable = true; }, { once: true }); }
  });

  // ---- delivery notes and box labels ----

  // One A4 page per order: who it's for, what's in it (no prices), lots and
  // best-befores for traceability, and a line for the customer to sign.
  function deliveryNotesHtml(orders) {
    return orders.map(o => {
      const cust = data.customerByName[o.CUSTOMER] || {};
      const lines = packLines(o);
      return `
        <div class="dn">
          <div class="dn-top">
            <img src="img/logo.png" alt="" class="dn-logo">
            <div class="dn-title">Delivery note</div>
          </div>
          <div class="dn-meta">
            <div><div class="dn-k">Deliver to</div><div class="dn-v"><strong>${escapeHtml(o.CUSTOMER)}</strong><br>${escapeHtml(cust['Delivery address'] || '')}</div></div>
            <div><div class="dn-k">Order</div><div class="dn-v">${escapeHtml(o.ID)}</div>
              ${o['CUSTOMER REF'] ? `<div class="dn-k">Your ref</div><div class="dn-v">${escapeHtml(o['CUSTOMER REF'])}</div>` : ''}
              <div class="dn-k">Delivery date</div><div class="dn-v">${escapeHtml(fmtDateShort(o['DELIVERY DATE']))}</div>
              ${o.BOXES ? `<div class="dn-k">Boxes</div><div class="dn-v">${escapeHtml(o.BOXES)}</div>` : ''}
              ${o._drop ? `<div class="dn-k">Drop</div><div class="dn-v">${o._drop}</div>` : ''}</div>
          </div>
          <table class="dn-table"><thead><tr><th>Product</th><th>Code</th><th class="num">Qty</th><th>Lot / best before</th></tr></thead>
          <tbody>${lines.map(l => `
            <tr>
              <td>${escapeHtml(l.name)}${l.replaces ? `<div class="dn-replaces">Replaces ${escapeHtml(l.replaces)}</div>` : ''}</td>
              <td>${escapeHtml(l.code)}</td>
              <td class="num">${escapeHtml(qtyUnit(l.qty, l.unit))}${l.weighed ? `<br>${l.weighed.toFixed(2)} kg` : ''}</td>
              <td>${l.isCut ? 'Cut to order' + (l.lots.length ? '<br>' : '') : ''}${l.lots.map(x => x.awaiting ? 'Awaiting delivery' : `${escapeHtml(x.lot)}${x.bbe ? ' · BB ' + escapeHtml(fmtDateShort(x.bbe)) : ''}`).join('<br>')}</td>
            </tr>`).join('')}</tbody></table>
          ${o.NOTES ? `<div class="dn-notes"><span class="dn-k">Notes</span> ${escapeHtml(o.NOTES)}</div>` : ''}
          <div class="dn-sign">
            <div>Received by</div><div>Signature</div><div>Date</div>
          </div>
        </div>`;
    }).join('');
  }

  // Four labels to an A4 sheet, one per box: "Box 2 of 3", the customer and
  // address large enough to read across a van. An order with no box count
  // gets a single label.
  function boxLabelsHtml(orders) {
    const labels = [];
    orders.forEach(o => {
      const cust = data.customerByName[o.CUSTOMER] || {};
      const n = Math.max(1, parseInt(o.BOXES, 10) || 1);
      for (let i = 1; i <= n; i++) {
        labels.push(`
          <div class="bl">
            <div class="bl-box">Box ${i} of ${n}</div>
            <div class="bl-cust">${escapeHtml(o.CUSTOMER)}</div>
            <div class="bl-addr">${escapeHtml(cust['Delivery address'] || '')}</div>
            <div class="bl-foot"><span>${escapeHtml(o.ID)} · ${escapeHtml(fmtDateShort(o['DELIVERY DATE']))}</span><span>${o._drop ? 'Drop ' + o._drop : escapeHtml(zoneOf(o) || '')}</span></div>
          </div>`);
      }
    });
    return `<div class="bl-sheet">${labels.join('')}</div>`;
  }

  // ---- printing one list at a time ----

  function printOnly(which) {
    if (which === 'notes' || which === 'labels') {
      const orders = packingOrder(weekOrders().inWeek);
      if (!orders.length) { showToast('No orders this week to print.', 'error'); return; }
      if (which === 'labels') {
        const missing = orders.filter(o => !(parseInt(o.BOXES, 10) > 0)).length;
        if (missing) showToast(`${missing} order(s) have no box count — printing one label for each.`);
      }
      document.getElementById('printOut').innerHTML = which === 'notes' ? deliveryNotesHtml(orders) : boxLabelsHtml(orders);
    }
    document.body.dataset.print = which;
    window.print();
  }
  window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

  // ---- Xero export: this week's orders as draft sales invoices ----
  //
  // Every order delivering this week, dispatched or not (dispatched ones are
  // the ones most likely to need invoicing). TEST-tagged orders from
  // test-data.html are left out so they can't reach the real books.
  const isTestOrder = o => /\bTEST\b/.test(o.NOTES || '');
  let xeroInvoices = [];

  function openXeroExport() {
    if (!data) return;
    const { start, end } = weekRange(weekOffset);
    const startIso = isoDate(start), endIso = isoDate(end);
    const week = data.orders.filter(o => o['DELIVERY DATE'] >= startIso && o['DELIVERY DATE'] <= endIso);
    const tests = week.filter(isTestOrder).length;
    xeroInvoices = week.filter(o => !isTestOrder(o))
      .map(o => xeroInvoiceFor(o, { lines: data.lines, productByCode: data.productByCode, customerByName: data.customerByName, cutsOfLine: data.cutsOfLine, allocations: data.allocs, deliveryByKey: data.deliveryByKey }))
      .sort((a, b) => b.ready - a.ready || a.order['DELIVERY DATE'].localeCompare(b.order['DELIVERY DATE']) || a.order.CUSTOMER.localeCompare(b.order.CUSTOMER));
    const ready = xeroInvoices.filter(i => i.ready);
    const money = n => `£${n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const row = (inv, i) => `
      <tr${inv.ready ? '' : ' class="none"'}>
        <td style="width:28px;"><input type="checkbox" data-inv="${i}" style="width:auto;"${inv.ready ? ' checked' : ' disabled'}></td>
        <td><strong>${escapeHtml(inv.order.CUSTOMER)}</strong><br><span class="code">${escapeHtml(inv.order.ID)} · ${escapeHtml(fmtDateShort(inv.order['DELIVERY DATE']))}</span>
          ${inv.blockers.map(b => `<div style="color:var(--crit); font-size:12.5px;">${escapeHtml(b)}</div>`).join('')}
          ${inv.ready ? inv.warnings.map(w => `<div class="muted" style="font-size:12.5px;">${escapeHtml(w)}</div>`).join('') : ''}</td>
        <td>${inv.ready ? '<span class="tag t-ok">Ready</span>' : '<span class="tag t-crit">Not ready</span>'}</td>
        <td class="num">${inv.ready ? money(inv.total) : ''}</td>
      </tr>`;
    document.getElementById('xeroForm').innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">Export to Xero</div>
          <div class="subtitle">${escapeHtml(document.getElementById('weekLabel').textContent)} · ${ready.length} of ${xeroInvoices.length} order(s) ready to invoice</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-b">
        ${xeroInvoices.length ? `
          <table>
            <thead><tr><th></th><th>Order</th><th>Status</th><th class="num">Ex VAT</th></tr></thead>
            <tbody>${xeroInvoices.map(row).join('')}</tbody>
          </table>` : '<div class="empty" style="padding:16px;">No orders for delivery this week.</div>'}
        ${tests ? `<p class="muted" style="font-size:12.5px;">${tests} TEST order(s) left out.</p>` : ''}
        <div class="note info" style="margin:16px 0 0;">
          An order is ready once every cheese on it has been cut and weighed — weighed lines are billed on the actual kilos.
          In Xero: <strong>Sales → Invoices → Import</strong>, choose this file and <strong>Tax exclusive</strong>. Invoices arrive as drafts,
          numbered by order ID, so an order already imported is skipped if you export the week again.
        </div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="button" class="btn" id="xeroDownloadBtn"${ready.length ? '' : ' disabled'}>Download CSV</button>
      </div>`;
    const dlg = document.getElementById('xeroDialog');
    dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dlg.close()));
    const btn = document.getElementById('xeroDownloadBtn');
    const checked = () => [...dlg.querySelectorAll('input[data-inv]:checked')].map(c => xeroInvoices[+c.dataset.inv]);
    dlg.querySelectorAll('input[data-inv]').forEach(c => c.addEventListener('change', () => { btn.disabled = !checked().length; }));
    btn.addEventListener('click', () => {
      const chosen = checked();
      if (!chosen.length) return;
      downloadXeroCsv(chosen, `xero-invoices-${startIso}.csv`);
      showToast(`${chosen.length} invoice(s) exported for Xero.`);
      dlg.close();
    });
    dlg.showModal();
  }

  document.getElementById('reloadBtn').addEventListener('click', loadLists);
  initWeekPicker(renderLists);
  document.getElementById('printPackBtn').addEventListener('click', () => printOnly('pack'));
  document.getElementById('printNotesBtn').addEventListener('click', () => printOnly('notes'));
  document.getElementById('printLabelsBtn').addEventListener('click', () => printOnly('labels'));
  document.getElementById('xeroBtn').addEventListener('click', openXeroExport);
  window.addEventListener('load', loadLists);
  // An order opened in place (js/shell.js) may have changed lines or
  // allocations — re-read so the lists match.
  window.onRecordDialogClosed = loadLists;
</script>
</body>
</html>
