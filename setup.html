<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Setup</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=21">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Sheet Setup</h2>
  <p class="sub">Creates any missing tabs and header rows in your spreadsheet — run this once, or any time you add a new tool. Safe to re-run: it never overwrites a tab that already has a header row.</p>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div class="panel" id="setupCard" style="display:none;">
    <div class="panel-b">
      <button type="button" class="btn" id="runBtn">Check &amp; create tabs</button>
      <div id="status" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
    </div>
  </div>

  <div id="tabsList"></div>
</main>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=1"></script>
<script>
  // Data model:
  //   Products   — the item master, keyed by the business's own product
  //                code (not a generated ID). Reflects the real Xero-linked
  //                schema: ordering/pricing basis, cost vs. landed cost,
  //                cut-to-order fields (Cut from / Cut shelf life / Part-cut
  //                shelf life / Target pack weight), and Xero item/account
  //                codes + VAT rate for accounting sync. No per-tier selling
  //                price lives here — Customers.Price list is a free-standing
  //                tag (Standard / P2P / Selfridges), not yet linked to a
  //                specific price on the product. Photo URL is written by the
  //                Products page's bulk photo upload tool (js/drive.js) —
  //                it's a plain URL column so it also accepts a manually
  //                pasted image link.
  //   Suppliers  — keyed by supplier name (no generated ID). Import/dispatch
  //                rates and delivery-day fields support future landed-cost
  //                and ordering-schedule automation.
  //   Customers  — keyed by customer name as it appears in Xero (no
  //                generated ID). Price list is one of Standard/P2P/
  //                Selfridges; delivery zone/route/day are placeholders for
  //                the later route-suggestion feature.
  //   PurchaseOrders / PurchaseOrderLines — an order placed with a supplier
  //                (see purchase-orders.html). A PO is created against one
  //                supplier, with lines drawn only from that supplier's
  //                products, and an expected delivery date range. Status is
  //                Ordered → Delivered/Cancelled — delivery is one-time, not
  //                partial: "Mark as delivered" walks through every line
  //                (qty/lot number/best-before editable, lines addable or
  //                removable at that point) and, for this build, that single
  //                pass both fills in each PurchaseOrderLines row's QTY
  //                RECEIVED/LOT NUMBER/BEST BEFORE DATE/STATUS *and* appends
  //                the resulting rows to Deliveries — this is the only
  //                normal path onto the Deliveries tab.
  //   Deliveries — append-only goods-in log; the stock-IN event. Each row is
  //                one batch/lot arriving: BATCH/LOT NUMBER + BEST BEFORE
  //                DATE are what let stock be tracked and allocated down to
  //                a specific lot later, and QTY RECEIVED is the quantity.
  //                PO ID traces a row back to the purchase order it was
  //                received against, when there is one.
  //   Orders / OrderLines — a customer order and its line items, both
  //                created together via the "+ Add order" wizard on
  //                orders.html (pick customer + delivery date, search
  //                products by name or code, confirm — also records PLACED
  //                BY). Clicking an order afterwards opens the same page's
  //                view dialog, which is also where STATUS is progressed
  //                and where stock gets allocated per line (see next).
  //   Allocations — links an order line to a specific delivered batch/lot
  //                and quantity. This is the stock-OUT event, done from
  //                orders.html's order-view dialog: each line shows its
  //                FEFO-sorted available lots (computed from Deliveries
  //                minus existing Allocations for that product) to pick
  //                from. Real-time availability = SUM(Deliveries.qty) -
  //                SUM(Allocations.qty) per product/batch — computed, not
  //                stored, so concurrent edits from the warehouse team
  //                can't corrupt a running total. Picking/cutting/packing
  //                lists (lists.html) are generated from Orders +
  //                OrderLines + Allocations + Products, flattened by
  //                product/lot rather than grouped by order.
  //   StockTakes / StockTakeLines — a physical count session (see
  //                stock-take.html). Starting one snapshots every Active
  //                product into StockTakeLines with its computed on-hand
  //                qty (SYSTEM QTY) and a blank COUNTED QTY; UNIT is fixed
  //                per line at that point (kg for Products.Pricing basis =
  //                "Per kg", pc otherwise) so it can't drift if the product
  //                record changes mid-count. COUNTED QTY blank vs filled is
  //                what "next uncounted item" walks through — a genuine
  //                zero count is a filled "0", not blank. Only one
  //                StockTakes row should be STATUS=In Progress at a time.
  //
  // IMPORTANT when adding a column to an existing tab: append it to the END
  // of that tab's headers array, never insert it in the middle. The setup
  // below only ever rewrites row 1 (the header labels) when it detects the
  // stored header is shorter than required — it never touches or shifts
  // existing data rows. Appending is safe (old columns keep their old
  // position); inserting a column in the middle silently relabels an
  // existing column, misaligning every row's data under the new header.
  const REQUIRED_TABS = [
    {
      title: 'Products',
      headers: ['Product code','Product name','Category','Default supplier','Producer','Storage','Ordering unit','Units per case','Pricing basis','Nominal weight (kg)','Cost price £','Landed cost £','GP at list','Tolerance band (%)','Cut from (code)','Cut shelf life (days)','Part-cut shelf life (days)','Target pack weight (kg)','Xero item code','Xero account code','VAT rate','Active','Sellable','Notes','Photo URL','Reorder threshold','Tech sheet URL','Training notes']
    },
    {
      title: 'Suppliers',
      headers: ['Supplier name','Country','Currency','Lead time (weeks)','Import rate (%)','Dispatch rate (%)','Delivers from','Delivers to','Ordering schedule','Contact email','Notes']
    },
    {
      title: 'Customers',
      headers: ['Customer name (as in Xero)','Your account ref','Delivery address','Delivery day','Delivery zone','Delivery route','Payment terms (days)','Direct Debit status','Min shelf life on receipt (days)','Price list','Discount (%)','Contact email','Active']
    },
    {
      title: 'Deliveries',
      headers: ['ID','DATE RECEIVED','SUPPLIER','PRODUCT CODE','BATCH/LOT NUMBER','BEST BEFORE DATE','QTY RECEIVED','UNIT','NOTES','PO ID']
    },
    {
      title: 'PurchaseOrders',
      headers: ['ID','SUPPLIER','ORDER DATE','EXPECTED START DATE','EXPECTED END DATE','STATUS','NOTES']
    },
    {
      title: 'PurchaseOrderLines',
      headers: ['ID','PO ID','PRODUCT CODE','QTY ORDERED','UNIT','QTY RECEIVED','LOT NUMBER','BEST BEFORE DATE','STATUS']
    },
    {
      title: 'Orders',
      headers: ['ID','DATE','CUSTOMER','DELIVERY DATE','STATUS','NOTES','PLACED BY']
    },
    {
      title: 'OrderLines',
      headers: ['ID','ORDER ID','PRODUCT CODE','QTY ORDERED','UNIT','STATUS','NOTES']
    },
    {
      title: 'Allocations',
      headers: ['ID','ORDER LINE ID','PRODUCT CODE','BATCH/LOT NUMBER','QTY ALLOCATED','ALLOCATED DATE','NOTES']
    },
    {
      title: 'StockTakes',
      headers: ['ID','DATE STARTED','STATUS','NOTES']
    },
    {
      title: 'StockTakeLines',
      headers: ['ID','STOCK TAKE ID','PRODUCT CODE','SYSTEM QTY','COUNTED QTY','UNIT','COUNTED AT']
    },
    {
      // Which suppliers sell which products — lets one product come from
      // several suppliers. A product's Default supplier counts as a supplier
      // even without a row here (see js/supplier-products.js).
      title: 'SupplierProducts',
      headers: ['ID','SUPPLIER','PRODUCT CODE','SUPPLIER PRODUCT CODE','COST PRICE £','NOTES','UPDATED']
    }
  ];

  const status = document.getElementById('status');
  let token = null;

  function setStatus(msg, kind) {
    status.textContent = msg;
    status.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }

  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    if (!token || !cfg.spreadsheetId) {
      document.getElementById('signedOutNotice').style.display = 'block';
      document.getElementById('setupCard').style.display = 'none';
      return false;
    }
    document.getElementById('signedOutNotice').style.display = 'none';
    document.getElementById('setupCard').style.display = 'block';
    return true;
  }

  function badge(text, kind) {
    // kind: 'ok' | 'pending' | 'error'
    const cls = kind === 'ok' ? 't-ok' : kind === 'error' ? 't-crit' : 't-amb';
    return `<span class="tag ${cls}">${text}</span>`;
  }

  function renderTabsList(rows) {
    const container = document.getElementById('tabsList');
    container.innerHTML = `
      <div class="panel-h" style="border:none; background:none; padding:0 0 8px;"><h3 style="text-transform:none; letter-spacing:normal; font-size:15px; color:var(--ink); font-weight:600;">Required tabs</h3></div>
      <div class="panel">
        <div class="scroll">
        <table>
          <thead><tr><th>Tab</th><th>Status</th><th>Columns</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><strong>${r.title}</strong></td>
                <td>${r.statusBadge}</td>
                <td class="code" style="font-size:11.5px;">${r.headers.join(' · ')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  function renderPending() {
    renderTabsList(REQUIRED_TABS.map(t => ({ ...t, statusBadge: badge('Not checked yet', 'pending') })));
  }

  function colLetterLocal(n) {
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  async function runSetup() {
    if (!requireAuth()) return;
    const cfg = getStoredConfig();
    setStatus('Checking existing tabs...');

    let existingTabs;
    try {
      existingTabs = await sheetsGetTabs(cfg.spreadsheetId, token);
    } catch (err) {
      setStatus('Error reading spreadsheet: ' + err.message, 'error');
      return;
    }

    const existingTitles = new Set(existingTabs.map(t => t.title));
    const missing = REQUIRED_TABS.filter(t => !existingTitles.has(t.title));

    if (missing.length) {
      setStatus(`Creating ${missing.length} missing tab(s): ${missing.map(t => t.title).join(', ')}...`);
      try {
        const requests = missing.map(t => ({ addSheet: { properties: { title: t.title } } }));
        const result = await sheetsBatchUpdate(cfg.spreadsheetId, requests, token);
        result.replies.forEach((reply, i) => {
          existingTabs.push({ sheetId: reply.addSheet.properties.sheetId, title: missing[i].title });
        });
      } catch (err) {
        setStatus('Error creating tabs: ' + err.message, 'error');
        return;
      }
    }

    const results = [];
    for (const tab of REQUIRED_TABS) {
      const wasMissing = missing.some(m => m.title === tab.title);
      const meta = existingTabs.find(t => t.title === tab.title);
      let statusBadge;
      try {
        const endCol = colLetterLocal(tab.headers.length);
        const firstRow = await sheetsGet(cfg.spreadsheetId, `${tab.title}!A1:${endCol}1`, token);
        const existingLen = firstRow.length ? firstRow[0].filter(c => (c || '').trim() !== '').length : 0;
        const hasHeader = existingLen > 0;

        // Write the header when the tab is empty, OR extend it when an older,
        // shorter header is present. Writing the canonical header row is
        // safe and idempotent.
        if (!hasHeader || existingLen < tab.headers.length) {
          await sheetsUpdateRange(cfg.spreadsheetId, `${tab.title}!A1:${endCol}1`, [tab.headers], token);
          await sheetsBatchUpdate(cfg.spreadsheetId, [{
            repeatCell: {
              range: { sheetId: meta.sheetId, startRowIndex: 0, endRowIndex: 1 },
              cell: { userEnteredFormat: { textFormat: { bold: true } } },
              fields: 'userEnteredFormat.textFormat.bold'
            }
          }], token);
          const label = !hasHeader
            ? (wasMissing ? 'Created + headers added' : 'Headers added')
            : 'Headers updated';
          statusBadge = badge(label, 'ok');
        } else {
          statusBadge = badge(wasMissing ? 'Created' : 'Already set up', 'ok');
        }
      } catch (err) {
        statusBadge = badge('Error: ' + err.message, 'error');
      }
      results.push({ ...tab, statusBadge });
      renderTabsList(results.concat(REQUIRED_TABS.slice(results.length).map(t => ({ ...t, statusBadge: badge('Pending...', 'pending') }))));
    }

    setStatus('Setup complete.', 'ok');
  }

  document.getElementById('runBtn').addEventListener('click', runSetup);

  window.addEventListener('load', () => {
    renderPending();
    requireAuth();
  });
</script>
</body>
</html>
