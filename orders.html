<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Orders</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=42">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Orders</h2>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="ordersCard" style="display:none;">
    <div class="panel-h" style="border:none; background:none; padding:0 0 8px;">
      <h3 style="text-transform:none; letter-spacing:normal; font-size:15px; color:var(--ink); font-weight:600;">Orders</h3>
      <button type="button" class="btn add-btn sm" id="newOrderBtn" style="margin:0;">+ Add order</button>
      <button type="button" class="btn ghost sm" id="reloadBtn" style="margin:0;">Reload</button>
    </div>
    <div class="cat-tabs" id="statusTabs" role="tablist" aria-label="Filter by status" style="margin-bottom:12px; width:fit-content; max-width:100%;"></div>
    <div class="panel"><div class="scroll" style="overflow-x:auto;">
      <table id="ordersTable">
        <thead><tr><th>ID</th><th>Customer</th><th>Delivery date</th><th>Status</th><th>Placed by</th><th class="num">Items</th></tr></thead>
        <tbody></tbody>
      </table>
    </div></div>
    <div id="status" class="mono" style="margin-top:8px; font-size:12.5px; color:var(--steel);"></div>
  </div>
</main>

<!-- Allocate / Replace pop-ups, opened on top of the order dialog. -->
<dialog id="allocDialog" class="sub-dialog"><form method="dialog" id="allocForm"></form></dialog>
<dialog id="replaceDialog" class="sub-dialog"><form method="dialog" id="replaceForm"></form></dialog>
<dialog id="lotPickDialog" class="sub-dialog"><form id="lotPickForm"></form></dialog>

<dialog id="orderDialog">
  <form id="orderForm"></form>
</dialog>

<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=7"></script>
<script src="js/util.js?v=3"></script>
<script src="js/stock-calc.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/searchable-select.js?v=2"></script>
<script>
  const ORDER_STATUSES = ['New', 'Allocated', 'Picked', 'Cut', 'Packed', 'Dispatched'];

  let token = null;
  let customers = [];       // Customers
  let products = [];        // Products (all — the New Order wizard filters to Active itself)
  let ordersData = [];      // [{ rowNumber, obj }] from Orders
  let orderLinesData = [];  // [{ rowNumber, obj }] from OrderLines
  let allocationsData = []; // [{ rowNumber, obj }] from Allocations
  let deliveriesData = [];  // [{ rowNumber, obj }] from Deliveries — source of what's in stock, per lot
  let purchaseOrders = [];  // PurchaseOrders — for what's arriving, shown in the product picker
  let poLines = [];         // PurchaseOrderLines
  let stockPos = {};        // computeStockPosition() result, refreshed each time the picker renders
  let productGroups = [];   // ProductGroups — a cut product's display name
  let sheetIds = {};         // tab name -> sheetId, lazily populated (needed to delete an allocation row)
  let draftLines = [];       // working line items being staged — New Order wizard, or "add product" in the View dialog
  let activeSummaryId = 'ord_orderSummary'; // which dialog's summary element renderOrderSummary() writes to, set by renderProductPicker()
  let lineHeaders = [];      // OrderLines' header row — where REPLACES lives
  let dirtyCheck = null;     // set per dialog mode; attachDiscardGuard calls it via a stable wrapper

  const statusEl = document.getElementById('status');
  const dialogEl = document.getElementById('orderDialog');
  const form = document.getElementById('orderForm');
  const guard = attachDiscardGuard(dialogEl, { scope: form, isDirtyOverride: () => dirtyCheck ? dirtyCheck() : false });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }

  function setDlgStatus(msg, kind) {
    const el = form.querySelector('#orderDlgStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }

  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('ordersCard').style.display = ok ? 'block' : 'none';
    return ok;
  }

  async function ensureAuth(statusFn) {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    if (!token || !cfg.spreadsheetId) { (statusFn || setStatus)('Sign in on the Dashboard first.', 'error'); return null; }
    return cfg;
  }

  async function ensureSheetId(cfg, tabName) {
    if (sheetIds[tabName] !== undefined) return sheetIds[tabName];
    const tabs = await sheetsGetTabs(cfg.spreadsheetId, token);
    tabs.forEach(t => { sheetIds[t.title] = t.sheetId; });
    return sheetIds[tabName] ?? null;
  }

  // Builds deleteDimension requests for a set of rows in one sheet, highest
  // row first — deleting bottom-up within the same sheetId so an earlier
  // deletion never shifts a later one's row index out from under it. Safe
  // to combine the result for several different sheets into one
  // sheetsBatchUpdate call (requests targeting different sheetIds don't
  // affect each other's indices).
  function buildDeleteRowRequests(sheetId, rowNumbers) {
    return [...rowNumbers].sort((a, b) => b - a).map(rn => ({
      deleteDimension: { range: { sheetId, dimension: 'ROWS', startIndex: rn - 1, endIndex: rn } }
    }));
  }

  function toRowObjects(rows) {
    if (!rows.length) return [];
    const [head, ...rest] = rows;
    return rest.map((r, i) => {
      const o = {};
      head.forEach((h, idx) => { o[h] = r[idx] ?? ''; });
      return { rowNumber: i + 2, obj: o };
    });
  }

  function todayIso() { return new Date().toISOString().slice(0, 10); }

  function fmtDateShort(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusTag(status) {
    const s = status || 'New';
    const cls = s === 'Dispatched' ? 't-ok' : s === 'New' ? 't-amb' : 't-chill';
    return `<span class="tag ${cls}">${escapeHtml(s)}</span>`;
  }

  function productOf(code) {
    return products.find(p => p['Product code'] === code);
  }

  function productName(code) {
    const p = productOf(code);
    return p ? p['Product name'] : code;
  }

  // ---- load + list ----

  async function loadAll() {
    if (!requireAuth()) return;
    const cfg = getStoredConfig();
    setStatus('Loading...');
    try {
      const groupsP = loadProductGroups(cfg.spreadsheetId); // in parallel with the reads below
      const [customerRows, productRows, orderRows, lineRows, allocRows, deliveryRows, poRows, polRows] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Customers!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Products!A:AZ', token),
        sheetsGet(cfg.spreadsheetId, 'Orders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'OrderLines!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:Z', token)
      ]);
      purchaseOrders = toRowObjects(poRows).map(r => r.obj);
      poLines = toRowObjects(polRows).map(r => r.obj);
      customers = toRowObjects(customerRows).map(r => r.obj);
      products = toRowObjects(productRows).map(r => r.obj);
      registerProducts(products);
      productGroups = await groupsP;
      registerProductGroups(productGroups);
      ordersData = toRowObjects(orderRows);
      orderLinesData = toRowObjects(lineRows);
      lineHeaders = lineRows[0] || [];
      allocationsData = toRowObjects(allocRows);
      deliveriesData = toRowObjects(deliveryRows);
      renderTable();
      setStatus(`Loaded ${ordersData.length} order(s).`, 'ok');
      checkDeepLink();
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  // Newest first: latest delivery date, then latest order date, then the
  // highest ID. Orders with no delivery date sit at the top — they need one.
  function sortOrders(list) {
    return [...list].sort((a, b) =>
      (b.obj['DELIVERY DATE'] || '9999').localeCompare(a.obj['DELIVERY DATE'] || '9999')
      || (b.obj.DATE || '').localeCompare(a.obj.DATE || '')
      || b.obj.ID.localeCompare(a.obj.ID, undefined, { numeric: true }));
  }

  // Status filter above the table: All, Open (anything not dispatched yet),
  // then each status. Remembered per browser.
  const STATUS_FILTER_KEY = 'provisions_ordersStatusFilter';
  let statusFilter = (() => { try { return localStorage.getItem(STATUS_FILTER_KEY) || 'All'; } catch (e) { return 'All'; } })();
  const statusOf = o => o.STATUS || 'New';
  const matchesFilter = (o, f) => f === 'All' || (f === 'Open' ? statusOf(o) !== 'Dispatched' : statusOf(o) === f);

  function renderStatusTabs() {
    const filters = ['All', 'Open', ...ORDER_STATUSES];
    if (!filters.includes(statusFilter)) statusFilter = 'All';
    document.getElementById('statusTabs').innerHTML = filters.map(f => `
      <button type="button" class="cat-tab${statusFilter === f ? ' active' : ''}" data-status-filter="${f}" role="tab" aria-selected="${statusFilter === f}">
        ${f}<span class="n">${ordersData.filter(r => matchesFilter(r.obj, f)).length}</span>
      </button>`).join('');
  }

  document.getElementById('statusTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status-filter]');
    if (!b) return;
    statusFilter = b.dataset.statusFilter;
    try { localStorage.setItem(STATUS_FILTER_KEY, statusFilter); } catch (err) {}
    renderTable();
  });

  function renderTable() {
    const tbody = document.querySelector('#ordersTable tbody');
    renderStatusTabs();
    if (!ordersData.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty" style="padding:18px;">No orders yet.</td></tr>`;
      return;
    }
    const shown = ordersData.filter(r => matchesFilter(r.obj, statusFilter));
    if (!shown.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty" style="padding:18px;">No ${escapeHtml(statusFilter.toLowerCase())} orders.</td></tr>`;
      return;
    }
    const lineCount = {};
    orderLinesData.forEach(l => { lineCount[l.obj['ORDER ID']] = (lineCount[l.obj['ORDER ID']] || 0) + 1; });
    tbody.innerHTML = sortOrders(shown).map(r => {
      const o = r.obj;
      const itemCount = lineCount[o.ID] || 0;
      return `<tr data-id="${escapeHtml(o.ID)}" style="cursor:pointer;">
        <td class="code">${escapeHtml(o.ID)}</td>
        <td>${escapeHtml(o.CUSTOMER)}</td>
        <td>${escapeHtml(fmtDateShort(o['DELIVERY DATE'])) || '—'}</td>
        <td>${statusTag(o.STATUS)}</td>
        <td>${escapeHtml(o['PLACED BY'])}</td>
        <td class="num">${itemCount}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('ordersTable').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openViewDialog(tr.dataset.id);
  });

  attachOrderHoverCard(document.getElementById('ordersTable'), 'tr[data-id]', tr => {
    const order = ordersData.find(r => r.obj.ID === tr.dataset.id);
    if (!order) return null;
    const o = order.obj;
    return {
      title: o.CUSTOMER, id: o.ID, status: o.STATUS || 'New',
      meta: [
        o['DELIVERY DATE'] ? `Delivery ${fmtDateShort(o['DELIVERY DATE'])}` : 'No delivery date set',
        o['PLACED BY'] ? `Placed by ${o['PLACED BY']}` : '',
        o.NOTES ? `Note: ${o.NOTES}` : ''
      ],
      lines: orderLinesData.filter(l => l.obj['ORDER ID'] === o.ID).map(l => ({
        product: productOf(l.obj['PRODUCT CODE']),
        name: productName(l.obj['PRODUCT CODE']),
        qty: qtyUnit(l.obj['QTY ORDERED'], l.obj.UNIT)
      }))
    };
  });

  // Deep link from the Dashboard/Lists pages (?open=ORD001) — opens straight
  // into that order's view. Safe to call after every loadAll(): the query
  // param is stripped from the URL the first time, so later reloads (e.g.
  // after allocating stock) just find nothing to do.
  function checkDeepLink() {
    const id = new URLSearchParams(location.search).get('open');
    if (!id) return;
    history.replaceState(null, '', location.pathname);
    if (ordersData.some(r => r.obj.ID === id)) openViewDialog(id);
    else window.embedNothingToShow?.();
  }

  // ---- create order (New Order wizard) ----

  function renderNewOrderForm() {
    draftLines = [];
    const info = getStoredUserInfo();
    form.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">New Order</div>
        </div>
        <button type="button" class="dlg-close" data-cancel aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-b">
        <div class="no-grid">
          <div class="no-order">
            <div class="no-head">
              <div class="field">
                <label>Customer *</label>
                <select id="ord_customer"><option value="">Select a customer…</option>${customers.map(c => `<option value="${escapeHtml(c['Customer name (as in Xero)'])}">${escapeHtml(c['Customer name (as in Xero)'])}</option>`).join('')}</select>
              </div>
              <div class="field">
                <label>Order date</label>
                <input type="date" id="ord_orderDate" value="${todayIso()}">
              </div>
              <div class="field">
                <label>Placed by *</label>
                <input type="text" id="ord_placedBy" value="${escapeHtml(info.name || info.email || '')}" placeholder="Your name">
              </div>
            </div>
            <div class="field">
              <label>Delivery week *</label>
              <input type="hidden" id="ord_deliveryDate">
              <div class="wk-chips" id="ord_weekChips" role="radiogroup" aria-label="Delivery week"></div>
              <div class="day-chips" id="ord_dayChips" role="radiogroup" aria-label="Delivery day"></div>
            </div>
            <div class="no-list-h"><label>Order</label><span id="ord_orderSummary" class="mono"></span></div>
            <div id="ord_draftList" class="no-list"></div>
            <div class="field" style="margin-top:12px;">
              <label>Notes</label>
              <textarea id="ord_notes" placeholder="Optional"></textarea>
            </div>
          </div>
          <div class="no-search">
            <label for="ord_productSearch">Add products</label>
            <input type="search" id="ord_productSearch" placeholder="Search by name or code…">
            <div id="ord_productPicker" class="no-picker"></div>
          </div>
        </div>
        <div id="orderDlgStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <div class="order-total" aria-live="polite"><span class="ot-l" id="ord_totalLabel">Order total</span><span class="ot-v" id="ord_total">£0.00</span></div>
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn" id="orderSubmitBtn">Place order</button>
      </div>
    `;
    dialogEl.classList.add('dlg-wide');
    renderProductPicker(undefined, undefined, [], undefined, true);

    const customerSel = form.querySelector('#ord_customer');
    const searchInput = form.querySelector('#ord_productSearch');
    enhanceSelect(customerSel);

    dirtyCheck = () => !!customerSel.value || draftLines.length > 0
      || !!form.querySelector('#ord_notes').value.trim();

    // Delivery: pick a week; the customer's usual day in it is the date,
    // unless a specific day is chosen (which also goes into the notes).
    deliveryPick = { week: defaultDeliveryWeek(), day: null };
    renderDeliveryPicker();
    customerSel.addEventListener('change', renderDeliveryPicker);
    customerSel.addEventListener('change', renderOrderTotal);

    searchInput.addEventListener('input', () => renderProductPicker(undefined, undefined, [], undefined, true));

    form.onclick = (e) => {
      if (e.target.closest('[data-cancel]')) { guard.guardedClose(); return; }
      const wk = e.target.closest('[data-week]');
      if (wk) { deliveryPick = { week: parseInt(wk.dataset.week, 10), day: null }; renderDeliveryPicker(); return; }
      const dy = e.target.closest('[data-day]');
      if (dy && !dy.disabled) { const d = parseInt(dy.dataset.day, 10); deliveryPick.day = d === usualDeliveryDay() ? null : d; renderDeliveryPicker(); return; }
      const rmDraft = e.target.closest('[data-remove-draft]');
      if (rmDraft) { draftLines = draftLines.filter(l => l.code !== rmDraft.dataset.removeDraft); renderOrderSummary(); return; }
      const pick = e.target.closest('[data-pick-open]');
      if (pick) openLotPicker(pick.dataset.pickOpen);
    };

    form.onsubmit = handleCreateOrderSubmit;
  }

  // Every Active product, grouped by category — no supplier scoping (unlike
  // the PO picker), since a customer order can include anything sellable.
  // Shared by the New Order wizard and the View dialog's "add product"
  // picker: `mountId`/`searchId`/`summaryId` point at whichever dialog is
  // open, and `excludeCodes` keeps products already on the order out of the
  // View dialog's picker (irrelevant — always empty — for a brand-new order).
  // ---- delivery week picker (New Order) ----
  //
  // Orders go out weekly, so the picker offers weeks; the date saved is the
  // customer's usual delivery day in the chosen week (Customers' "Delivery
  // day", else Wednesday out of London / Thursday in London). Picking another
  // day sets that date instead and adds "Requested delivery: Tue 3 Nov" to
  // the notes, so it's seen on the slips. Defaults to this week, or next week
  // once this week's cut-off (Tuesday midday) has passed.
  const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const PICKER_WEEKS = 8;
  const REQUESTED_PREFIX = 'Requested delivery: ';
  let deliveryPick = { week: 0, day: null };

  const mondayFrom = offset => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + (d.getDay() === 0 ? -6 : 1 - d.getDay()) + 7 * offset); return d; };
  const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function defaultDeliveryWeek() {
    const now = new Date(), day = now.getDay();
    const pastCutoff = day === 0 || day >= 3 || (day === 2 && now.getHours() >= 12);
    return pastCutoff ? 1 : 0;
  }
  function usualDeliveryDay() {
    const c = customers.find(x => x['Customer name (as in Xero)'] === form.querySelector('#ord_customer')?.value);
    const named = WEEKDAYS.indexOf(c?.['Delivery day']);
    if (named >= 0) return named;
    return c?.['Delivery zone'] === 'Out of London' ? 2 : 3;
  }

  function renderDeliveryPicker() {
    const usual = usualDeliveryDay();
    const monday = mondayFrom(deliveryPick.week);
    const todayStr = todayIso();
    const dayDate = i => { const d = new Date(monday); d.setDate(d.getDate() + i); return d; };
    // A usual day already gone this week falls back to the next day still open.
    let dayIdx = deliveryPick.day ?? usual;
    while (isoLocal(dayDate(dayIdx)) < todayStr && dayIdx < 4) dayIdx++;
    const range = d => { const e = new Date(d); e.setDate(e.getDate() + 6); return `${d.getDate()} ${d.toLocaleDateString('en-GB', { month: 'short' })}–${e.getDate()} ${e.toLocaleDateString('en-GB', { month: 'short' })}`; };
    form.querySelector('#ord_weekChips').innerHTML = Array.from({ length: PICKER_WEEKS }, (_, w) => {
      const m = mondayFrom(w);
      const label = w === 0 ? 'This week' : w === 1 ? 'Next week' : `w/c ${m.getDate()} ${m.toLocaleDateString('en-GB', { month: 'short' })}`;
      return `<button type="button" class="wk-chip${w === deliveryPick.week ? ' on' : ''}" data-week="${w}" role="radio" aria-checked="${w === deliveryPick.week}">
        <span class="wk-l">${escapeHtml(label)}</span><span class="wk-r">${escapeHtml(range(m))}</span></button>`;
    }).join('');
    form.querySelector('#ord_dayChips').innerHTML = WEEKDAYS.map((name, i) => {
      const d = dayDate(i), past = isoLocal(d) < todayStr;
      return `<button type="button" class="day-chip${i === dayIdx ? ' on' : ''}${i === usual ? ' usual' : ''}" data-day="${i}" role="radio" aria-checked="${i === dayIdx}"${past ? ' disabled' : ''} title="${i === usual ? 'Usual delivery day for this customer' : 'Ask for this specific day'}">
        ${name.slice(0, 3)} ${d.getDate()}${i === usual ? '<span class="usual-tag">usual</span>' : ''}</button>`;
    }).join('');
    const date = dayDate(dayIdx);
    const dateInput = form.querySelector('#ord_deliveryDate');
    const previousDate = dateInput.value;
    dateInput.value = isoLocal(date);
    if (previousDate && previousDate !== dateInput.value) repickForDate(dateInput.value);
    // Keep one "Requested delivery:" line in the notes while a specific day is picked.
    const notesEl = form.querySelector('#ord_notes');
    const rest = notesEl.value.split('\n').filter(l => !l.startsWith(REQUESTED_PREFIX));
    const specific = deliveryPick.day !== null && dayIdx !== usual;
    notesEl.value = (specific ? [REQUESTED_PREFIX + date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })] : []).concat(rest).join('\n').trim();
  }

  // `compact`: the New Order dialog's narrow search column — small cards
  // with a + button; quantities are then set in the order list beside it.
  function renderProductPicker(mountId = 'ord_productPicker', searchId = 'ord_productSearch', excludeCodes = [], summaryId = 'ord_orderSummary', compact = false) {
    activeSummaryId = summaryId;
    stockPos = computeStockPosition({
      deliveries: deliveriesData.map(r => r.obj), allocations: allocationsData.map(r => r.obj),
      orders: ordersData.map(r => r.obj), orderLines: orderLinesData.map(r => r.obj),
      purchaseOrders, poLines
    });
    const mount = form.querySelector(`#${mountId}`);
    const active = products.filter(p => (p.Active || 'Yes') !== 'No');
    // A whole and the portions cut from it are one row (a "cut family");
    // everything else is a row per SKU, as before.
    const families = cutFamilies(active).filter(f => !f.portions.some(x => excludeCodes.includes(x.code)));
    const inFamily = new Set(cutFamilies(active).flatMap(f => f.portions.map(x => x.code)));
    let items = active
      .filter(p => !excludeCodes.includes(p['Product code']) && !inFamily.has(p['Product code']))
      .map(p => ({ kind: 'sku', p, name: p['Product name'], cat: p['Category'] || 'Uncategorised', codes: [p['Product code']] }))
      .concat(families.map(f => ({ kind: 'family', f, name: f.name, cat: f.category || 'Uncategorised', codes: f.portions.flatMap(x => [x.code, x.p['Product name']]) })));
    if (!items.length) {
      mount.innerHTML = `<div class="empty" style="padding:12px 0;">${excludeCodes.length ? 'Every active product is already on this order.' : 'No products set up yet.'}</div>`;
      renderOrderSummary();
      return;
    }
    const term = searchNorm((form.querySelector(`#${searchId}`).value || '').trim());
    if (term) items = items.filter(it => searchMatch(it.name, term) || it.codes.some(c => searchMatch(c, term)));
    if (!items.length) {
      mount.innerHTML = `<div class="empty" style="padding:12px 0;">No products match "${escapeHtml(term)}".</div>`;
      renderOrderSummary();
      return;
    }
    const byCategory = new Map();
    items.sort((a, b) => a.name.localeCompare(b.name)).forEach(it => {
      if (!byCategory.has(it.cat)) byCategory.set(it.cat, []);
      byCategory.get(it.cat).push(it);
    });
    mount.innerHTML = [...byCategory.keys()].sort().map(cat => `
      <div class="cat-group">
        <div class="cat-group-head"><span class="g-name">${escapeHtml(cat)}</span><span class="g-count">${byCategory.get(cat).length}</span></div>
        ${byCategory.get(cat).map(it => compact ? pickCardHtml(it) : it.kind === 'family' ? familyPickerRowHtml(it.f) : productPickerRowHtml(it.p)).join('')}
      </div>
    `).join('');
    renderOrderSummary();
  }

  // ---- cut families: a whole and the portions cut from it, ordered as one
  // row in multiples of the smallest piece ----
  //
  // Each portion's size comes from its name ("1/16 wheel", "half",
  // "quarter", "whole"), falling back to its nominal weight against the
  // whole's. `units` = how many smallest pieces it is (Comté: whole 16, ¼ 4,
  // ⅛ 2, 1/16 1). An order for N pieces is saved as real cuts, largest
  // first — 3 × 1/16 becomes one ⅛ and one 1/16, 16 × 1/16 the whole wheel —
  // each its own SKU line counted in pieces, so the cutting list shows what
  // actually gets cut.

  const FAMILY_PREFIX = 'fam:';

  function portionFraction(p, wholeKg) {
    const label = (p['Product name'] || '').split(' — ')[1] || '';
    const frac = label.match(/(\d+)\s*\/\s*(\d+)/);
    if (frac) return parseInt(frac[1], 10) / parseInt(frac[2], 10);
    if (/\bwhole\b/i.test(label) || !p['Cut from (code)']) return 1;
    if (/\bhalf\b/i.test(label)) return 1 / 2;
    if (/\bquarter\b/i.test(label)) return 1 / 4;
    const kg = parseFloat(p['Nominal weight (kg)']);
    return kg && wholeKg ? kg / wholeKg : 1;
  }

  // "Comté Petite 10/14M — 1/16 wheel 2.3kg" → "1/16 wheel"
  const portionLabel = p => ((p['Product name'] || '').split(' — ')[1] || p['Product name'] || '').replace(/\s+\d+(?:[.,]\d+)?\s*kg$/i, '').trim();

  function cutFamilies(list) {
    const byCode = Object.fromEntries(list.map(p => [p['Product code'], p]));
    const fams = new Map();
    list.filter(p => p['Cut from (code)']).forEach(p => {
      const rootCode = p['Cut from (code)'];
      if (!fams.has(rootCode)) fams.set(rootCode, { rootCode, root: byCode[rootCode] || productOf(rootCode) || null, members: [] });
      fams.get(rootCode).members.push(p);
    });
    return [...fams.values()].map(f => {
      const sellableRoot = f.root && byCode[f.rootCode] ? [f.root] : [];
      const all = sellableRoot.concat(f.members);
      const wholeKg = parseFloat(f.root?.['Nominal weight (kg)']) || 0;
      const fracs = all.map(p => ({ p, code: p['Product code'], frac: portionFraction(p, wholeKg) }));
      const smallest = Math.min(...fracs.map(x => x.frac));
      const portions = fracs.map(x => ({ ...x, units: Math.max(1, Math.round(x.frac / smallest)), kg: parseFloat(x.p['Nominal weight (kg)']) || 0, label: portionLabel(x.p) }))
        .sort((a, b) => b.units - a.units);
      const small = portions[portions.length - 1];
      const anyP = f.root || f.members[0];
      const group = productGroups.find(g => g.ID && g.ID === anyP['Group ID']);
      return {
        code: FAMILY_PREFIX + f.rootCode, rootCode: f.rootCode, root: f.root, portions, small,
        name: group?.['Product name'] || (anyP['Product name'] || '').split(' — ')[0],
        category: anyP['Category'] || ''
      };
    });
  }

  function familyByCode(code) {
    return cutFamilies(products.filter(p => (p.Active || 'Yes') !== 'No')).find(f => f.code === code);
  }

  // N smallest pieces as real cuts, largest first: [{ portion, count }].
  function decompose(fam, units) {
    let left = units;
    const out = [];
    fam.portions.forEach(x => {
      const count = Math.floor(left / x.units);
      if (count > 0) { out.push({ portion: x, count }); left -= count * x.units; }
    });
    return out;
  }

  function familyHint(fam, units) {
    if (!units) return '';
    const parts = decompose(fam, units);
    const kg = parts.reduce((s, x) => s + x.count * x.portion.kg, 0);
    // "wheel" dropped from fractions to keep it to one line: "Cut: 2 × 1/4 + 1/16 · ≈ 20.3kg".
    const short = l => /\d\s*\/\s*\d/.test(l) ? l.replace(/\s*wheel$/i, '') : l;
    return `Cut: ${parts.map(x => `${x.count > 1 ? x.count + ' × ' : ''}${short(x.portion.label)}`).join(' + ')}${kg ? ` · ≈ ${roundQty(kg)}kg` : ''}`;
  }

  function familyPickerRowHtml(fam) {
    const line = draftLines.find(l => l.code === fam.code);
    const units = line ? line.units : 0;
    const photoUrl = productPhoto(fam.root || fam.small.p);
    const photoHtml = photoUrl ? `<img class="cr-photo" src="${escapeHtml(photoUrl)}" alt="" loading="lazy">` : `<span class="cr-photo"></span>`;
    const subText = [(fam.root || fam.small.p)['Producer'], `Cut to order · in ${fam.small.label} pieces${fam.small.kg ? ` (${fam.small.kg}kg)` : ''}`].filter(Boolean).join(' · ');
    const stockHtml = fam.root
      ? stockPositionHtml(stockPos[fam.rootCode], productOrderMeta(fam.root).unit, 'Whole')
      : '';
    return `
      <div class="cat-row picker-row" data-code="${escapeHtml(fam.code)}">
        ${photoHtml}
        <div class="cr-info">
          <div class="cr-name-line"><span class="cr-name">${escapeHtml(fam.name)}</span></div>
          <div class="cr-sub">${escapeHtml(subText)}</div>
          ${stockHtml}
          <div class="cr-cut" title="${escapeHtml(familyHint(fam, units))}">${escapeHtml(familyHint(fam, units))}</div>
        </div>
        <div class="cr-stepper">
          <button type="button" class="stepper-btn" data-step="-1" data-code="${escapeHtml(fam.code)}" ${units <= 0 ? 'disabled' : ''} aria-label="Remove one piece">−</button>
          <div class="stepper-qty">
            <input type="number" class="stepper-qty-input" data-code="${escapeHtml(fam.code)}" value="${units || ''}" placeholder="0" min="0" step="1">
            <span class="stepper-unit-suffix">× ${escapeHtml(fam.small.label)}</span>
          </div>
          <button type="button" class="stepper-btn" data-step="1" data-code="${escapeHtml(fam.code)}" aria-label="Add one piece">+</button>
        </div>
      </div>`;
  }

  function setFamilyUnits(fam, units, opts = {}) {
    units = Math.max(0, Math.round(units));
    const line = draftLines.find(l => l.code === fam.code);
    if (!units) draftLines = draftLines.filter(l => l.code !== fam.code);
    else if (line) line.units = units;
    else draftLines.push({ code: fam.code, name: fam.name, units, family: true });
    const row = form.querySelector(`.picker-row[data-code="${CSS.escape(fam.code)}"]`);
    if (row) {
      if (!opts.skipInputValue) row.querySelector('.stepper-qty-input').value = units || '';
      const cut = row.querySelector('.cr-cut');
      cut.textContent = cut.title = familyHint(fam, units);
      row.querySelector('[data-step="-1"]').disabled = units <= 0;
    }
    renderOrderSummary();
  }

  // What actually gets saved: cut families turned into their real cuts.
  // Each call gets its own copy of the picked lots (a family's cuts share one
  // copy), since autoAllocate uses them up as it goes.
  function expandDraftLines(list = draftLines) {
    return list.flatMap(l => {
      const picks = (l.picks || []).map(x => ({ ...x }));
      if (!l.family) return [{ ...l, picks }];
      const fam = familyByCode(l.code);
      return fam ? decompose(fam, l.units).map(x => ({ code: x.portion.code, name: x.portion.p['Product name'], qty: x.count, unit: 'pc', picks })) : [];
    });
  }

  function renderOrderSummary() {
    const n = draftLines.length;
    // View dialog: the count lives on its footer button, shown once
    // something has been picked.
    const addBtn = form.querySelector('#ord_view_addLinesBtn');
    if (addBtn) {
      addBtn.hidden = !n;
      addBtn.textContent = `Add ${n} item${n === 1 ? '' : 's'} to order`;
    }
    renderDraftList();
    renderOrderTotal();
    form.querySelectorAll('.pick-card').forEach(card => {
      const line = draftLines.find(l => l.code === card.dataset.pickCode);
      card.classList.toggle('in', !!line);
      card.querySelector('.pick-badge').textContent = line ? draftBadge(line) : '';
    });
    const el = form.querySelector(`#${activeSummaryId}`);
    if (!el) return;
    el.textContent = n ? `${n} item${n === 1 ? '' : 's'}` : '';
  }

  // ---- New Order: running total, in the button row ----
  //
  // List price = landed cost ÷ (1 − GP at list), per kg or per piece by the
  // product's pricing basis — the same figure Reports uses — less the
  // customer's Discount (%). Shop and Selfridges prices live in Xero, so for
  // those this is an estimate until Xero is connected.
  function listPrice(p) {
    const landed = parseFloat(p['Landed cost £']) || parseFloat(p['Cost price £']) || 0;
    const gp = parseFloat(p['GP at list']);
    return landed ? landed / (1 - (isNaN(gp) ? 30 : gp) / 100) : 0;
  }
  function lineValue(l) {
    const p = productOf(l.code);
    if (!p) return 0;
    const billable = p['Pricing basis'] === 'Per kg' && l.unit !== 'kg' ? l.qty * (parseFloat(p['Nominal weight (kg)']) || 0) : l.qty;
    return billable * listPrice(p);
  }
  function renderOrderTotal() {
    const totalEl = form.querySelector('#ord_total');
    if (!totalEl) return;
    const lines = expandDraftLines();
    const values = lines.map(lineValue);
    const c = customers.find(x => x['Customer name (as in Xero)'] === form.querySelector('#ord_customer')?.value);
    const discount = parseFloat(c?.['Discount (%)']) || 0;
    const total = values.reduce((s, v) => s + v, 0) * (1 - discount / 100);
    const unpriced = values.filter(v => !v).length;
    totalEl.textContent = `£${total.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    form.querySelector('#ord_totalLabel').textContent = ['Order total ex VAT', discount ? `after ${discount}% discount` : '', unpriced ? `${unpriced} item(s) with no price` : ''].filter(Boolean).join(' · ');
  }

  // ---- New Order: compact search cards (right) and the order list (left) ----

  const shortDay = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
  const draftBadge = l => l.family ? `${l.units} ×` : qtyUnit(roundQty(l.qty), l.unit);

  function compactStockHtml(pos, unit) {
    pos = pos || { free: 0, incoming: [] };
    const next = pos.incoming[0];
    return `<span class="${pos.free > 0 ? '' : 'neg'}">${pos.free > 0 ? escapeHtml(qtyUnit(roundQty(pos.free), unit)) + ' free' : 'none free'}</span>`
      + (next ? ` · +${escapeHtml(qtyUnit(roundQty(next.qty), next.unit || unit))} ${escapeHtml(shortDay(next.start))}` : '');
  }

  function pickCardHtml(it) {
    const fam = it.kind === 'family' ? it.f : null;
    const p = fam ? (fam.root || fam.small.p) : it.p;
    const code = fam ? fam.code : p['Product code'];
    const meta = productOrderMeta(p);
    const line = draftLines.find(l => l.code === code);
    const pack = fam ? `Cut · ${fam.small.label}${fam.small.kg ? ` ${fam.small.kg}kg` : ''}`
      : meta.isCase ? `${meta.perCase} per case` : meta.unit === 'kg' ? 'per kg' : 'each';
    const stock = fam ? (fam.root ? compactStockHtml(stockPos[fam.rootCode], productOrderMeta(fam.root).unit) : '') : compactStockHtml(stockPos[code], meta.unit);
    return `
      <div class="pick-card${line ? ' in' : ''}" data-pick-code="${escapeHtml(code)}" data-pick-open="${escapeHtml(code)}">
        ${productThumb(p, 'xs')}
        <div class="pk-t">
          <div class="pk-name" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</div>
          <div class="pk-sub">${escapeHtml(pack)}${stock ? ' · ' + stock : ''}</div>
        </div>
        <span class="pick-badge">${line ? escapeHtml(draftBadge(line)) : ''}</span>
        <button type="button" class="stepper-btn" aria-label="Choose quantity and lots for ${escapeHtml(it.name)}">+</button>
      </div>`;
  }

  function renderDraftList() {
    const mount = form.querySelector('#ord_draftList');
    if (!mount) return;
    mount.innerHTML = draftLines.length ? draftLines.map(draftRowHtml).join('')
      : `<div class="no-empty">Search on the right and click a product to choose its quantity and lots. It then appears here.</div>`;
  }

  function draftRowHtml(l) {
    const fam = l.family ? familyByCode(l.code) : null;
    const p = fam ? (fam.root || fam.small.p) : productOf(l.code);
    if (!p) return '';
    const meta = productOrderMeta(p);
    const qty = fam ? `${l.units} × ${fam.small.label}`
      : meta.isCase ? `${roundQty(l.qty / meta.step)} case${roundQty(l.qty / meta.step) === 1 ? '' : 's'} · ${qtyUnit(l.qty, l.unit)}` : qtyUnit(l.qty, l.unit);
    const unit = fam ? 'kg' : l.unit;
    const parts = (l.picks || []).map(x => {
      if (x.poLineId) { const i = poLineInfo(x.poLineId); return `${fmtQty(x.qty, unit)} on ${i.poId}${i.due ? ' due ' + shortDay(i.due) : ''}`; }
      const d = daysUntil(deliveryBbeFor(x.code, x.batch));
      return `${fmtQty(x.qty, unit)} lot ${x.batch}${d !== null ? ` (${d}d left)` : ''}`;
    });
    const short = draftShort(l);
    const hint = fam ? `<span class="dr-sub">${escapeHtml(familyHint(fam, l.units))}</span>` : '';
    return `<div class="draft-item">
      <button type="button" class="draft-row" data-pick-open="${escapeHtml(l.code)}" title="Change quantity or lots">
        ${productThumb(p, 'xs')}
        <span class="dr-t">
          <span class="dr-name">${escapeHtml(l.name)}</span>
          ${hint}
          <span class="dr-sub">${escapeHtml(parts.join(' · '))}${short > 0.0001 ? `${parts.length ? ' · ' : ''}<span class="neg">${escapeHtml(fmtQty(short, unit))} short</span>` : ''}</span>
        </span>
        <span class="dr-qty">${escapeHtml(qty)}</span>
      </button>
      <button type="button" class="draft-remove" data-remove-draft="${escapeHtml(l.code)}" title="Remove from order" aria-label="Remove ${escapeHtml(l.name)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>`;
  }

  // ---- New Order: the lot pop-up ----
  //
  // Clicking a product asks how many and which stock before it joins the
  // order: lots on the shelf and POs on their way, earliest first, prefilled
  // the way autoAllocate would and editable. The choice is held on the draft
  // line (`picks`) and written to Allocations when the order is placed. A
  // reservation has no lot or best-before until goods-in, so POs show days
  // until they arrive instead.
  const lotPickDialog = document.getElementById('lotPickDialog');
  const lotPickForm = document.getElementById('lotPickForm');
  const pickKey = (code, x) => x.poLineId ? `po|${x.poLineId}` : `${code}|${x.batch}`;

  // What the rest of this draft order has already claimed, by lot / PO line.
  function draftTaken(exceptCode) {
    const taken = {};
    draftLines.filter(l => l.code !== exceptCode).forEach(l => (l.picks || []).forEach(x => {
      const k = pickKey(x.code, x);
      taken[k] = roundQty((taken[k] || 0) + x.qty);
    }));
    return taken;
  }
  const draftNeed = l => roundQty(expandDraftLines([l]).reduce((s, x) => s + x.qty * stockSource(x.code, x.unit).perUnit, 0));
  const draftShort = l => roundQty(draftNeed(l) - (l.picks || []).reduce((s, x) => s + x.qty, 0));

  // The chosen `picks` first, then FEFO for anything they leave uncovered.
  function planPicks(line, deliveryDate, picks = []) {
    const lines = expandDraftLines([{ ...line, picks }]).map(l => ({ ...l, lineId: 'draft' }));
    return autoAllocate(lines, deliveryDate, draftTaken(line.code)).rows
      .map(r => ({ code: r.code, batch: r.batch, poLineId: r.poLineId, qty: r.qty }));
  }

  // A new delivery date can put a lot past its best-before, or a PO too late.
  function repickForDate(date) {
    const stale = draftLines.filter(l => (l.picks || []).some(x => {
      if (x.poLineId) { const due = poLineInfo(x.poLineId).due; return !due || due >= date; }
      const bbe = deliveryBbeFor(x.code, x.batch);
      return bbe && bbe < date;
    }));
    stale.forEach(l => { l.picks = planPicks(l, date); });
    if (stale.length) setDlgStatus(`Lots re-picked for the new delivery date: ${stale.map(l => l.name).join(', ')}.`);
    renderOrderSummary();
  }

  const daysUntil = d => d ? Math.round((new Date(d + 'T00:00:00') - new Date(todayIso() + 'T00:00:00')) / 864e5) : null;
  function daysLeftHtml(bbe, deliveryDate) {
    const d = daysUntil(bbe);
    if (d === null) return '<span class="muted">—</span>';
    const label = d < 0 ? 'past' : `${d} day${d === 1 ? '' : 's'}`;
    const main = d < 14 ? `<span class="tag ${d < 7 ? 't-crit' : 't-warn'}">${label}</span>` : label;
    if (!deliveryDate) return main;
    const atDelivery = d - daysUntil(deliveryDate);
    return `${main}<div class="${atDelivery < 0 ? 'neg' : 'lot-sub'}">${atDelivery < 0 ? 'past by delivery' : `${atDelivery}d at delivery`}</div>`;
  }
  const arrivesLabel = due => { const d = daysUntil(due); return d === null ? '—' : d < 0 ? `${-d}d overdue` : d === 0 ? 'today' : `in ${d} day${d === 1 ? '' : 's'}`; };

  function openLotPicker(code) {
    const fam = code.startsWith(FAMILY_PREFIX) ? familyByCode(code) : null;
    const p = fam ? (fam.root || fam.small.p) : productOf(code);
    if (!p) return;
    const meta = productOrderMeta(p);
    const existing = draftLines.find(l => l.code === code);
    const date = form.querySelector('#ord_deliveryDate').value;
    const srcCode = fam ? fam.rootCode : stockSource(code).code;
    const unit = fam ? 'kg' : meta.unit;
    const taken = draftTaken(code);
    const lots = computeAvailableBatches(srcCode)
      .map(b => ({ ...b, remaining: roundQty(b.remaining - (taken[pickKey(srcCode, b)] || 0)) })).filter(b => b.remaining > 0.0001);
    const arrivals = incomingPool(srcCode)
      .map(x => ({ ...x, remaining: roundQty(x.remaining - (taken[pickKey(srcCode, x)] || 0)) })).filter(x => x.remaining > 0.0001);
    const lineFor = entered => fam
      ? { code, name: fam.name, units: Math.max(0, Math.round(entered)), family: true }
      : { code, name: p['Product name'], qty: roundQty(meta.isCase ? entered * meta.step : entered), unit: meta.unit };
    const shown = existing ? (fam ? existing.units : meta.isCase ? roundQty(existing.qty / meta.step) : existing.qty) : 1;
    const suffix = fam ? `× ${fam.small.label}` : meta.isCase ? 'cases' : unitLabel(meta.unit);
    const days = date ? new Date(date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
    lotPickForm.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl" style="font-size:22px;">${escapeHtml(fam ? fam.name : p['Product name'])}</div>
          <div class="subtitle">${fam ? `Cut from ${escapeHtml(srcCode)} · ` : ''}Delivery ${escapeHtml(days)}</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dlg-b">
        <div class="lot-qty">
          <label for="lot_qty">Quantity</label>
          <input type="number" id="lot_qty" min="0" step="${fam || meta.isCase || meta.unit !== 'kg' ? '1' : '0.01'}" value="${shown}">
          <span>${escapeHtml(suffix)}</span>
          <span class="lot-sub" id="lot_hint"></span>
        </div>
        <div class="sub-h">On the shelf · earliest best-before first</div>
        ${lots.length ? `
          <table class="form"><thead><tr><th>Lot</th><th>Best before</th><th>Days left</th><th class="num">Free</th><th class="num">Take</th></tr></thead>
          <tbody>${lots.map(b => `<tr>
            <td class="code">${escapeHtml(b.batch)}</td>
            <td>${escapeHtml(fmtDateShort(b.bbe)) || '—'}</td>
            <td>${daysLeftHtml(b.bbe, date)}</td>
            <td class="num">${escapeHtml(fmtQty(b.remaining, b.unit))}</td>
            <td class="num"><input type="number" step="any" min="0" max="${b.remaining}" data-take="${escapeHtml(b.batch)}" placeholder="0" class="take-input"></td>
          </tr>`).join('')}</tbody></table>`
          : `<div class="note">Nothing free on the shelf.</div>`}
        <div class="sub-h" style="margin-top:16px;">Arriving · lot and best-before known at goods-in</div>
        ${arrivals.length ? `
          <table class="form"><thead><tr><th>Purchase order</th><th>Due</th><th>Arrives</th><th class="num">Unreserved</th><th class="num">Reserve</th></tr></thead>
          <tbody>${arrivals.map(x => { const inTime = !date || x.due < date; return `<tr${inTime ? '' : ' class="none"'}>
            <td class="code">${escapeHtml(x.poId)}</td>
            <td>${escapeHtml(fmtDateShort(x.due))}</td>
            <td>${escapeHtml(arrivesLabel(x.due))}${inTime ? '' : '<div class="lot-sub">too late for this delivery</div>'}</td>
            <td class="num">${escapeHtml(fmtQty(x.remaining, unit))}</td>
            <td class="num">${inTime ? `<input type="number" step="any" min="0" max="${x.remaining}" data-take-po="${escapeHtml(x.poLineId)}" placeholder="0" class="take-input">` : ''}</td>
          </tr>`; }).join('')}</tbody></table>`
          : `<div class="lot-sub">Nothing on order.</div>`}
        <div id="lotStatus" class="lot-status" aria-live="polite"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn" id="lotAddBtn">${existing ? 'Update order' : 'Add to order'}</button>
      </div>`;

    const qtyInput = lotPickForm.querySelector('#lot_qty');
    const takeInputs = () => [...lotPickForm.querySelectorAll('[data-take], [data-take-po]')];
    const fill = picks => takeInputs().forEach(i => {
      const x = picks.find(pk => i.dataset.take !== undefined ? pk.batch === i.dataset.take : pk.poLineId === i.dataset.takePo);
      i.value = x ? x.qty : '';
    });
    const readPicks = () => takeInputs().map(i => ({ code: srcCode, batch: i.dataset.take, poLineId: i.dataset.takePo, qty: roundQty(parseFloat(i.value) || 0), max: parseFloat(i.max) })).filter(x => x.qty > 0);
    const refresh = () => {
      const line = lineFor(parseFloat(qtyInput.value) || 0);
      const need = draftNeed(line);
      const total = roundQty(readPicks().reduce((s, x) => s + x.qty, 0));
      const over = readPicks().find(x => x.qty > x.max + 0.0001);
      const hasQty = fam ? line.units > 0 : line.qty > 0;
      const statusEl = lotPickForm.querySelector('#lotStatus');
      lotPickForm.querySelector('#lot_hint').textContent = fam ? familyHint(fam, line.units) : meta.isCase && hasQty ? `= ${qtyUnit(line.qty, meta.unit)}` : '';
      const coverable = roundQty(lots.reduce((s, b) => s + b.remaining, 0) + arrivals.filter(x => !date || x.due < date).reduce((s, x) => s + x.remaining, 0));
      let msg = '', bad = false;
      if (over) { msg = `${over.batch ? 'Lot ' + over.batch : 'That PO'} only has ${fmtQty(over.max, unit)} free.`; bad = true; }
      else if (total > need + 0.0001) { msg = `You've taken ${fmtQty(total, unit)} but only ${fmtQty(need, unit)} is needed.`; bad = true; }
      else if (hasQty && need > coverable + 0.0001) msg = `${fmtQty(roundQty(need - coverable), unit)} short: nothing left to cover it. You can still add it and replace it on the order later.`;
      else if (hasQty && total < need - 0.0001) msg = `${fmtQty(roundQty(need - total), unit)} not chosen yet: it'll be taken earliest best-before first.`;
      else if (hasQty) msg = `${fmtQty(total, unit)} chosen, all of it covered.`;
      statusEl.textContent = msg;
      statusEl.classList.toggle('bad', bad);
      lotPickForm.querySelector('#lotAddBtn').disabled = bad || !hasQty;
    };
    fill(existing ? (existing.picks || []) : planPicks(lineFor(shown), date));
    refresh();
    lotPickForm.oninput = (e) => {
      if (e.target === qtyInput) fill(planPicks(lineFor(parseFloat(qtyInput.value) || 0), date));
      refresh();
    };
    lotPickForm.onclick = (e) => { if (e.target.closest('[data-close]')) lotPickDialog.close(); };
    lotPickForm.onsubmit = (e) => {
      e.preventDefault();
      const line = lineFor(parseFloat(qtyInput.value) || 0);
      if (!(fam ? line.units : line.qty)) return;
      line.picks = planPicks(line, date, readPicks().map(({ max, ...x }) => x));
      const at = draftLines.findIndex(l => l.code === code);
      if (at >= 0) draftLines[at] = line; else draftLines.push(line);
      lotPickDialog.close();
      renderOrderSummary();
    };
    lotPickDialog.showModal();
    qtyInput.focus();
    qtyInput.select();
  }

  function productPickerRowHtml(p) {
    const code = p['Product code'];
    const meta = productOrderMeta(p);
    const line = draftLines.find(l => l.code === code);
    const qty = line ? line.qty : 0;
    const photoUrl = productPhoto(p);
    const photoHtml = photoUrl
      ? `<img class="cr-photo" src="${escapeHtml(photoUrl)}" alt="" loading="lazy">`
      : `<span class="cr-photo"></span>`;
    const subText = [p['Producer'], meta.isCase ? `${meta.perCase} × ${meta.unit === 'kg' ? (parseFloat(p['Nominal weight (kg)']) || '?') + 'kg' : '1 piece'} per case` : `Ordered per ${meta.unit === 'kg' ? 'kg' : 'piece'}`].filter(Boolean).join(' · ');
    // A cut portion has no stock of its own — show the whole it's cut from.
    const parent = p['Cut from (code)'] ? productOf(p['Cut from (code)']) : null;
    const stockHtml = parent
      ? stockPositionHtml(stockPos[parent['Product code']], productOrderMeta(parent).unit, `Cut from ${parent['Product code']}`)
      : stockPositionHtml(stockPos[code], meta.unit);
    return `
      <div class="cat-row picker-row" data-code="${escapeHtml(code)}">
        ${photoHtml}
        <div class="cr-info">
          <div class="cr-name-line"><span class="cr-name">${escapeHtml(p['Product name'])}</span></div>
          <div class="cr-sub">${escapeHtml(subText)}</div>
          ${stockHtml}
        </div>
        <div class="cr-stepper">
          <button type="button" class="stepper-btn" data-step="-1" data-code="${escapeHtml(code)}" ${qty <= 0 ? 'disabled' : ''} aria-label="Remove one">−</button>
          <div class="stepper-qty">${stepperQtyInputHtml(qty, meta, code)}</div>
          <button type="button" class="stepper-btn" data-step="1" data-code="${escapeHtml(code)}" aria-label="Add one">+</button>
        </div>
      </div>`;
  }

  // The qty cell is a real <input> (not just +/- buttons) so a large or
  // fractional quantity (100 cases, 1.6kg) can be typed directly instead of
  // clicked one step at a time. Case items show/edit the case count, with
  // the equivalent kg or piece total underneath; non-case items edit that
  // tracked unit directly, decimals allowed for kg.
  function stepperQtyInputHtml(qty, meta, code) {
    const displayQty = qty > 0 ? (meta.isCase ? roundQty(qty / meta.step) : qty) : '';
    const step = meta.isCase ? '1' : (meta.unit === 'kg' ? '0.01' : '1');
    const suffix = meta.isCase ? `case${roundQty(qty / meta.step) === 1 ? '' : 's'}` : unitLabel(meta.unit);
    const sub = meta.isCase ? `<span class="stepper-sub">${qty > 0 ? qtyUnit(qty, meta.unit) : ''}</span>` : '';
    return `
      <input type="number" class="stepper-qty-input" data-code="${escapeHtml(code)}" value="${displayQty}" placeholder="0" min="0" step="${step}">
      <span class="stepper-unit-suffix">${escapeHtml(suffix)}</span>
      ${sub}
    `;
  }

  // Both the +/- buttons and typing into the qty <input> land here — the
  // buttons pass a code+direction, direct input passes the code and reads
  // its own field. `skipInputValue` avoids re-writing the input mid-keystroke.
  function setDraftQty(code, qty, meta, p) {
    const line = draftLines.find(l => l.code === code);
    if (qty <= 0) {
      draftLines = draftLines.filter(l => l.code !== code);
    } else if (line) {
      line.qty = qty;
    } else {
      draftLines.push({ code, name: p['Product name'], qty, unit: meta.unit });
    }
  }

  function updateStepperRow(code, qty, meta, opts = {}) {
    const row = form.querySelector(`.picker-row[data-code="${CSS.escape(code)}"]`);
    if (!row) return;
    if (!opts.skipInputValue) {
      row.querySelector('.stepper-qty-input').value = qty > 0 ? (meta.isCase ? roundQty(qty / meta.step) : qty) : '';
    }
    const suffix = row.querySelector('.stepper-unit-suffix');
    if (suffix && meta.isCase) suffix.textContent = `case${roundQty(qty / meta.step) === 1 ? '' : 's'}`;
    const sub = row.querySelector('.stepper-sub');
    if (sub) sub.textContent = qty > 0 ? qtyUnit(qty, meta.unit) : '';
    row.querySelector('[data-step="-1"]').disabled = qty <= 0;
  }

  function adjustDraftQty(code, dir) {
    if (code.startsWith(FAMILY_PREFIX)) {
      const fam = familyByCode(code);
      const line = draftLines.find(l => l.code === code);
      if (fam) setFamilyUnits(fam, (line ? line.units : 0) + dir);
      return;
    }
    const p = products.find(pr => pr['Product code'] === code);
    if (!p) return;
    const meta = productOrderMeta(p);
    const line = draftLines.find(l => l.code === code);
    const qty = Math.max(0, roundQty((line ? line.qty : 0) + dir * meta.step));
    setDraftQty(code, qty, meta, p);
    updateStepperRow(code, qty, meta);
    renderOrderSummary();
  }

  // Typing directly into a picker row's qty <input> — for a case item the
  // typed number is a case count (converted to the tracked unit); otherwise
  // it's the tracked unit itself (kg allows decimals, e.g. 1.6).
  function handleQtyInput(code) {
    if (code.startsWith(FAMILY_PREFIX)) {
      const fam = familyByCode(code);
      const input = form.querySelector(`.picker-row[data-code="${CSS.escape(code)}"] .stepper-qty-input`);
      if (fam && input) setFamilyUnits(fam, parseFloat(input.value) || 0, { skipInputValue: true });
      return;
    }
    const p = products.find(pr => pr['Product code'] === code);
    if (!p) return;
    const meta = productOrderMeta(p);
    const row = form.querySelector(`.picker-row[data-code="${CSS.escape(code)}"]`);
    if (!row) return;
    const entered = parseFloat(row.querySelector('.stepper-qty-input').value);
    const clean = isNaN(entered) || entered < 0 ? 0 : entered;
    const qty = roundQty(meta.isCase ? clean * meta.step : clean);
    setDraftQty(code, qty, meta, p);
    updateStepperRow(code, qty, meta, { skipInputValue: true });
    renderOrderSummary();
  }

  // Case-ordered products (Ordering unit = Case) can only be ordered in
  // whole cases — the +/- stepper moves qty by one case at a time,
  // converted into the product's own tracked unit (kg or pc).
  function productOrderMeta(p) {
    const unit = p['Pricing basis'] === 'Per kg' ? 'kg' : 'pc';
    const perCase = parseFloat(p['Units per case']) || 0;
    const isCase = p['Ordering unit'] === 'Case' && perCase > 0;
    const nominalWeight = parseFloat(p['Nominal weight (kg)']) || 1;
    const step = isCase ? (unit === 'kg' ? perCase * nominalWeight : perCase) : 1;
    return { unit, isCase, perCase, step };
  }

  function roundQty(n) {
    return Math.round(n * 1000) / 1000;
  }

  async function handleCreateOrderSubmit(e) {
    e.preventDefault();
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;

    const customer = form.querySelector('#ord_customer').value;
    const deliveryDate = form.querySelector('#ord_deliveryDate').value;
    const orderDate = form.querySelector('#ord_orderDate').value;
    const placedBy = form.querySelector('#ord_placedBy').value.trim();
    if (!customer) { setDlgStatus('Pick a customer.', 'error'); return; }
    if (!deliveryDate) { setDlgStatus('Pick a delivery week.', 'error'); return; }
    if (!placedBy) { setDlgStatus('Enter who placed this order.', 'error'); return; }
    if (!draftLines.length) { setDlgStatus('Add at least one product.', 'error'); return; }

    setDlgStatus('Placing order...');
    try {
      const notes = form.querySelector('#ord_notes').value.trim();
      const [existingOrders, existingLines] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Orders!A:A', token),
        sheetsGet(cfg.spreadsheetId, 'OrderLines!A:A', token)
      ]);
      const orderId = nextId(existingOrders.length ? existingOrders : [['ID']], 'ORD');
      let base = existingLines.length ? existingLines : [['ID']];
      const placed = expandDraftLines().map(l => {
        const lineId = nextId(base, 'OL');
        base = base.concat([[lineId]]);
        return { ...l, lineId };
      });
      // Stock is allocated as the order is placed, so availability always
      // reflects every order not yet dispatched.
      const alloc = autoAllocate(placed, deliveryDate);
      await sheetsAppend(cfg.spreadsheetId, 'Orders!A:G', [orderId, orderDate, customer, deliveryDate, alloc.short ? 'New' : 'Allocated', notes, placedBy], token);
      await sheetsAppendRows(cfg.spreadsheetId, 'OrderLines!A:G', placed.map(l => [l.lineId, orderId, l.code, l.qty, l.unit, 'New', '']), token);
      if (alloc.rows.length) await appendAllocations(cfg, alloc.rows);

      dialogEl.close();
      await loadAll();
      setStatus(alloc.short ? `Order ${orderId} created — ${alloc.short} line(s) short of stock: open it to replace them.` : `Order ${orderId} created and allocated.`, alloc.short ? 'error' : 'ok');
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- view order + allocate stock ----

  function openViewDialog(orderId) {
    const order = ordersData.find(r => r.obj.ID === orderId);
    if (!order) return;
    renderViewForm(order);
    dialogEl.showModal();
    guard.arm();
  }

  function renderViewForm(order) {
    dialogEl.classList.remove('dlg-wide');
    dirtyCheck = null; // every action here (allocate/remove/status) saves immediately — nothing unsaved to lose
    draftLines = []; // staged "add product" picks — never carries over between opens/refreshes of this dialog
    const lines = orderLinesData.filter(l => l.obj['ORDER ID'] === order.obj.ID);
    const excludeCodes = lines.map(l => l.obj['PRODUCT CODE']);

    form.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">${escapeHtml(order.obj.ID)} — ${escapeHtml(order.obj.CUSTOMER)}</div>
          <div class="subtitle">Placed by ${escapeHtml(order.obj['PLACED BY']) || 'unknown'} on ${escapeHtml(fmtDateShort(order.obj.DATE))} · delivery ${escapeHtml(fmtDateShort(order.obj['DELIVERY DATE'])) || 'not set'}.</div>
        </div>
        <button type="button" class="dlg-close" data-cancel aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

        </div>

        <div class="field" style="margin-top:12px;">

      if (replaceBtn) { openReplaceDialog(order, replaceBtn.dataset.openReplace); return; }
