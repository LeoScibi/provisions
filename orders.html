  // ---- allocation: per line, in a pop-up, or all at once ----
  //
  // A cut-to-order line (a portion "Cut from" a whole) takes no allocation
  // of its own — it's cut from a wheel at the bench — so it's shown as such
  // and never holds the order back from Allocated.

  const isCutLine = l => { const p = productOf(l['PRODUCT CODE']); return !!(p && p['Cut from (code)']); };
  // Where a line's stock comes from. A cut portion holds none of its own: it
  // draws kilos from the whole it's cut from (1 × "1/16 wheel 2.3kg" = 2.3kg
  // of CCH001W), so pending cheese orders take wheel stock like anything
  // else. A whole ordered by the piece (`lineUnit` 'pc') but stocked in kilos
  // draws its nominal weight the same way. Everything else draws its own
  // code, in its own unit.
  function stockSource(code, lineUnit) {
    const p = productOf(code);
    const parent = p && p['Cut from (code)'] ? productOf(p['Cut from (code)']) : null;
    if (parent) return { code: parent['Product code'], perUnit: parseFloat(p['Nominal weight (kg)']) || 0, unit: 'kg', cut: true };
    const wholeKg = lineUnit === 'pc' && p?.['Pricing basis'] === 'Per kg' ? parseFloat(p['Nominal weight (kg)']) : 0;
    if (wholeKg) return { code, perUnit: wholeKg, unit: 'kg', cut: false };
    return { code, perUnit: 1, unit: null, cut: false };
  }
  const sourceUnit = (src, l) => src.unit || l.UNIT;
  const lineNeed = l => roundQty((parseFloat(l['QTY ORDERED']) || 0) * stockSource(l['PRODUCT CODE'], l.UNIT).perUnit);
  const allocatedFor = lineId => allocationsData.filter(a => a.obj['ORDER LINE ID'] === lineId)
    .reduce((s, a) => s + (parseFloat(a.obj['QTY ALLOCATED']) || 0), 0);
  const outstandingFor = l => Math.max(0, roundQty(lineNeed(l) - allocatedFor(l.ID)));
  const freeStock = code => roundQty(computeAvailableBatches(code).reduce((s, b) => s + b.remaining, 0));
  const fmtQty = (n, unit) => qtyUnit(roundQty(n), unit);

  function allocSummary(lines) {
    const need = lines.filter(l => lineNeed(l.obj) > 0);
    const ready = need.filter(l => outstandingFor(l.obj) <= 0.0001).length;
    return `${ready} of ${need.length} line(s) allocated`;
  }
  const canAllocateAll = lines => lines.some(l => {
    const src = stockSource(l.obj['PRODUCT CODE']);
    return outstandingFor(l.obj) > 0.0001 && (freeStock(src.code) > 0.0001 || incomingPool(src.code, currentOrderDate(l.obj)).length);
  });
  const currentOrderDate = l => ordersData.find(r => r.obj.ID === l['ORDER ID'])?.obj['DELIVERY DATE'] || '';

  function renderLineRow(line) {
    const l = line.obj;
    const code = l['PRODUCT CODE'];
    const ordered = parseFloat(l['QTY ORDERED']) || 0;
    const replaced = l.REPLACES ? `<div class="replaced-note">Replaces ${escapeHtml(productName(l.REPLACES))}</div>` : '';
    const src = stockSource(code, l.UNIT);
    const unit = sourceUnit(src, l);
    const fromWheel = src.cut ? `<div class="incoming-note">Cut from ${escapeHtml(src.code)} · ${escapeHtml(fmtQty(lineNeed(l), 'kg'))}</div>` : '';
    const nameCell = productCell(productOf(code), `${escapeHtml(productName(code))}<br><span class="code">${escapeHtml(code)}</span>${fromWheel}${replaced}`);
    if (src.cut && !src.perUnit) {
      // A portion with no nominal weight can't be turned into wheel kilos.
      return `
        <tr>
          <td>${nameCell}</td>
          <td class="num">${ordered} ${unitLabel(l.UNIT)}</td>
          <td class="num muted">—</td>
          <td class="num muted">—</td>
          <td><span class="tag t-chill" title="No nominal weight on this portion, so it can't be allocated from the wheel">Cut to order</span></td>
          <td class="line-actions"><button type="button" class="btn ghost sm" data-remove-line="${escapeHtml(l.ID)}">Remove</button></td>
        </tr>`;
    }
    const allocated = allocatedFor(l.ID);
    const outstanding = outstandingFor(l);
    const free = freeStock(src.code);
    const incoming = incomingPool(src.code, currentOrderDate(l));
    const incomingFree = roundQty(incoming.reduce((s, x) => s + x.remaining, 0));
    const ready = outstanding <= 0.0001;
    const short = !ready && free + incomingFree + 0.0001 < outstanding;
    const reservations = allocationsData.filter(a => a.obj['ORDER LINE ID'] === l.ID && a.obj['PO LINE ID']);
    const reservedNote = reservations.length ? `<div class="reserved-note">${reservations.map(a => { const i = poLineInfo(a.obj['PO LINE ID']); return `Reserved ${escapeHtml(fmtQty(parseFloat(a.obj['QTY ALLOCATED']) || 0, unit))} · ${escapeHtml(i.poId)}${i.due ? ' due ' + escapeHtml(fmtDateShort(i.due)) : ''}`; }).join('<br>')}</div>` : '';
    const statusBadge = ready ? (reservations.length ? '<span class="tag t-chill" title="Partly or fully held on stock still arriving">Reserved</span>' : '<span class="tag t-ok">Ready</span>')
      : (allocated > 0 ? '<span class="tag t-warn">Partial</span>' : '<span class="tag t-crit">Unallocated</span>');
    return `
      <tr>
        <td>${nameCell}${reservedNote}</td>
        <td class="num">${ordered} ${unitLabel(l.UNIT)}</td>
        <td class="num ${short ? 'neg' : ''}" title="${short ? 'Not enough free stock, on the shelf or arriving in time, to fill this line' : (src.cut ? `Free kilos of ${src.code} not yet allocated to any order` : 'Free stock not yet allocated to any order')}">${escapeHtml(fmtQty(free, unit))}${incomingFree > 0 ? `<div class="incoming-note">+${escapeHtml(fmtQty(incomingFree, unit))} due</div>` : ''}</td>
        <td class="num">${escapeHtml(fmtQty(allocated, unit))}</td>
        <td>${statusBadge}</td>
        <td class="line-actions">
          <button type="button" class="btn ghost sm" data-open-alloc="${escapeHtml(l.ID)}">${ready ? 'Lots' : 'Allocate'}</button>
          ${src.cut ? '' : `<button type="button" class="btn ghost sm${short ? ' attn' : ''}" data-open-replace="${escapeHtml(l.ID)}">Replace</button>`}
          <button type="button" class="btn ghost sm" data-remove-line="${escapeHtml(l.ID)}">Remove</button>
        </td>
      </tr>`;
  }

  // Allocations for lines being filled: each line not cut to order takes
  // shelf stock first expiry, first out (skipping lots already past their
  // best-before on the delivery date); whatever the shelf can't cover is
  // reserved on purchase orders still arriving before the delivery date —
  // a reservation has no lot yet, just the PO line (`poLineId`), and becomes
  // real lots at goods-in. Lines share one pool per product. A line's `picks`
  // (chosen in the New Order lot pop-up) are taken first; `taken` is stock
  // already claimed elsewhere, by pickKey. Returns { rows (for
  // appendAllocations), short: lines still not fully covered }.
  function autoAllocate(lines, deliveryDate, taken = {}) {
    const shelfPools = {}, poPools = {};
    const rows = [];
    let short = 0;
    lines.forEach(l => {
      if (!productOf(l.code)) return;
      // `inStockUnits`: qty is already in the source's unit (e.g. an
      // outstanding amount); otherwise a cut portion's pieces become kilos.
      const src = stockSource(l.code, l.unit);
      if (!src.perUnit) return;
      const code = src.code;
      const allLots = shelfPools[code] = shelfPools[code] || computeAvailableBatches(code)
        .map(b => ({ ...b, remaining: roundQty(b.remaining - (taken[pickKey(code, b)] || 0)) }));
      const shelf = allLots.filter(b => !b.bbe || !deliveryDate || b.bbe >= deliveryDate);
      const incoming = poPools[code] = poPools[code] || incomingPool(code, deliveryDate)
        .map(x => ({ ...x, remaining: roundQty(x.remaining - (taken[pickKey(code, x)] || 0)) }));
      let left = roundQty(l.inStockUnits ? l.qty : l.qty * src.perUnit);
      (l.picks || []).forEach(pk => {
        const from = pk.poLineId ? incoming.find(x => x.poLineId === pk.poLineId) : allLots.find(b => b.batch === pk.batch);
        const take = from ? roundQty(Math.min(left, pk.qty, from.remaining)) : 0;
        if (take <= 0) return;
        rows.push({ lineId: l.lineId, code, batch: pk.batch, poLineId: pk.poLineId, qty: take });
        from.remaining = roundQty(from.remaining - take);
        pk.qty = roundQty(pk.qty - take);
        left = roundQty(left - take);
      });
      // A cut piece comes off one wheel: take each whole piece from the
      // earliest-dated lot that still has enough for it, and only split a
      // piece across lots (below) when no single lot can cover it.
      if (src.unit) {
        while (left + 0.0001 >= src.perUnit) {
          const b = shelf.find(x => x.remaining + 0.0001 >= src.perUnit);
          if (!b) break;
          rows.push({ lineId: l.lineId, code, batch: b.batch, qty: src.perUnit });
          b.remaining = roundQty(b.remaining - src.perUnit);
          left = roundQty(left - src.perUnit);
        }
      }
      shelf.forEach(b => {
        if (left <= 0.0001) return;
        const take = roundQty(Math.min(left, b.remaining));
        if (take <= 0) return;
        rows.push({ lineId: l.lineId, code, batch: b.batch, qty: take });
        b.remaining = roundQty(b.remaining - take);
        left = roundQty(left - take);
      });
      incoming.forEach(x => {
        if (left <= 0.0001) return;
        const take = roundQty(Math.min(left, x.remaining));
        if (take <= 0) return;
        rows.push({ lineId: l.lineId, code, poLineId: x.poLineId, qty: take });
        x.remaining = roundQty(x.remaining - take);
        left = roundQty(left - take);
      });
      if (left > 0.0001) short++;
    });
    // Two pieces off the same lot (or PO line) for one order line = one row.
    const merged = [];
    rows.forEach(r => {
      const same = merged.find(m => m.lineId === r.lineId && m.code === r.code && (m.batch || '') === (r.batch || '') && (m.poLineId || '') === (r.poLineId || ''));
      if (same) same.qty = roundQty(same.qty + r.qty); else merged.push({ ...r });
    });
    return { rows: merged, short };
  }

  // What's still unreserved on open purchase order lines for a product, due
  // before `deliveryDate` (any time before it), soonest first.
  function incomingPool(code, deliveryDate) {
    const reserved = {};
    allocationsData.forEach(({ obj: a }) => { if (a['PO LINE ID']) reserved[a['PO LINE ID']] = (reserved[a['PO LINE ID']] || 0) + (parseFloat(a['QTY ALLOCATED']) || 0); });
    const openPo = Object.fromEntries(purchaseOrders.filter(po => !po.STATUS || po.STATUS === 'Ordered').map(po => [po.ID, po]));
    return poLines.filter(l => l['PRODUCT CODE'] === code && openPo[l['PO ID']]).map(l => {
      const po = openPo[l['PO ID']];
      const due = po['EXPECTED END DATE'] || po['EXPECTED START DATE'] || '';
      return { poLineId: l.ID, poId: po.ID, due, remaining: roundQty((parseFloat(l['QTY ORDERED']) || 0) - (reserved[l.ID] || 0)) };
    }).filter(x => x.remaining > 0.0001 && x.due && (!deliveryDate || x.due < deliveryDate))
      .sort((a, b) => a.due.localeCompare(b.due));
  }
  const poLineInfo = id => {
    const l = poLines.find(x => x.ID === id);
    const po = l && purchaseOrders.find(x => x.ID === l['PO ID']);
    return { poId: po?.ID || '?', due: po ? (po['EXPECTED END DATE'] || po['EXPECTED START DATE'] || '') : '' };
  };

  // FEFO split of `qty` over a product's free lots: [{ batch, bbe, take }].
  function fefoPlan(code, qty, pool) {
    const out = [];
    let left = qty;
    (pool || computeAvailableBatches(code)).forEach(b => {
      if (left <= 0.0001) return;
      const take = roundQty(Math.min(left, b.remaining));
      if (take > 0) { out.push({ batch: b.batch, bbe: b.bbe, take }); left = roundQty(left - take); }
    });
    return out;
  }

  async function appendAllocations(cfg, rows) {
    const existing = await sheetsGet(cfg.spreadsheetId, 'Allocations!A:A', token);
    let base = existing.length ? existing : [['ID']];
    const values = rows.map(r => {
      const id = nextId(base, 'ALO');
      base = base.concat([[id]]);
      return [id, r.lineId, r.code, r.batch || '', r.qty, todayIso(), '', r.poLineId || ''];
    });
    await sheetsAppendRows(cfg.spreadsheetId, 'Allocations!A:H', values, token);
  }

  async function handleAllocateAll(order) {
    const lines = orderLinesData.filter(l => l.obj['ORDER ID'] === order.obj.ID);
    const { rows } = autoAllocate(lines.map(({ obj: l }) => ({ lineId: l.ID, code: l['PRODUCT CODE'], qty: outstandingFor(l), inStockUnits: true }))
      .filter(l => l.qty > 0.0001), order.obj['DELIVERY DATE']);
    if (!rows.length) { setDlgStatus('Nothing more can be allocated from stock in hand or on its way.', 'error'); return; }
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Allocating…');
    try {
      await appendAllocations(cfg, rows);
      await refreshAfterAllocationChange(order.obj.ID);
      const left = orderLinesData.filter(l => l.obj['ORDER ID'] === order.obj.ID && outstandingFor(l.obj) > 0.0001).length;
      setDlgStatus(left ? `Allocated what's in stock — ${left} line(s) still short. Use Replace to swap them.` : 'Every line is allocated.', left ? 'error' : 'ok');
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- the Allocate pop-up ----
  const allocDialog = document.getElementById('allocDialog');
  const allocForm = document.getElementById('allocForm');

  function openAllocDialog(order, lineId) {
    const line = orderLinesData.find(l => l.obj.ID === lineId);
    if (!line) return;
    const l = { ...line.obj };
    const src = stockSource(l['PRODUCT CODE'], l.UNIT);
    const code = src.code;                 // what the stock is drawn from
    l.UNIT = sourceUnit(src, line.obj);    // and in what unit (kg for a wheel)
    const allocs = allocationsData.filter(a => a.obj['ORDER LINE ID'] === lineId);
    const outstanding = outstandingFor(l);
    const lots = computeAvailableBatches(code);
    const incoming = incomingPool(code, order.obj['DELIVERY DATE']);
    const plan = Object.fromEntries(fefoPlan(code, outstanding, lots).map(x => [x.batch, x.take]));
    // What the shelf can't cover is prefilled on the POs, soonest first.
    let poLeft = roundQty(outstanding - Object.values(plan).reduce((s, v) => s + v, 0));
    const poPlan = {};
    incoming.forEach(x => { if (poLeft > 0.0001) { poPlan[x.poLineId] = roundQty(Math.min(poLeft, x.remaining)); poLeft = roundQty(poLeft - poPlan[x.poLineId]); } });
    allocForm.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl" style="font-size:22px;">${escapeHtml(productName(l['PRODUCT CODE']))}</div>
          <div class="subtitle">${src.cut ? `Cut from ${escapeHtml(productName(code))} · ` : ''}${escapeHtml(order.obj.CUSTOMER)} · ordered ${escapeHtml(src.unit ? `${parseFloat(line.obj['QTY ORDERED']) || 0} × ${fmtQty(src.perUnit, 'kg')}` : fmtQty(parseFloat(l['QTY ORDERED']) || 0, l.UNIT))} · allocated ${escapeHtml(fmtQty(allocatedFor(lineId), l.UNIT))} · still needed <strong>${escapeHtml(fmtQty(outstanding, l.UNIT))}</strong></div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dlg-b">
        ${allocs.length ? `
          <div class="sub-h">Allocated</div>
          <table class="form" style="margin-bottom:16px;"><thead><tr><th>Lot</th><th>Best before</th><th class="num">Qty</th><th></th></tr></thead>
          <tbody>${allocs.map(a => `<tr>
            <td class="code">${a.obj['PO LINE ID'] ? `Reserved · ${escapeHtml(poLineInfo(a.obj['PO LINE ID']).poId)}` : escapeHtml(a.obj['BATCH/LOT NUMBER'])}</td>
            <td>${a.obj['PO LINE ID'] ? `<span class="muted">due ${escapeHtml(fmtDateShort(poLineInfo(a.obj['PO LINE ID']).due)) || '?'}</span>` : (escapeHtml(fmtDateShort(deliveryBbeFor(a.obj['PRODUCT CODE'], a.obj['BATCH/LOT NUMBER']))) || '—')}</td>
            <td class="num">${escapeHtml(fmtQty(parseFloat(a.obj['QTY ALLOCATED']) || 0, l.UNIT))}</td>
            <td class="line-actions"><button type="button" class="btn ghost sm" data-remove-alloc="${escapeHtml(a.obj.ID)}">Remove</button></td>
          </tr>`).join('')}</tbody></table>` : ''}
        <div class="sub-h">Free stock · earliest best-before first</div>
        ${lots.length ? `
          <table class="form"><thead><tr><th>Lot</th><th>Best before</th><th>Days left</th><th class="num">Free</th><th class="num">Take</th></tr></thead>
          <tbody>${lots.map(b => `<tr>
            <td class="code">${escapeHtml(b.batch)}</td>
            <td>${escapeHtml(fmtDateShort(b.bbe)) || '—'}</td>
            <td>${daysLeftHtml(b.bbe, order.obj['DELIVERY DATE'])}</td>
            <td class="num">${escapeHtml(fmtQty(b.remaining, b.unit))}</td>
            <td class="num"><input type="number" step="any" min="0" max="${b.remaining}" data-take="${escapeHtml(b.batch)}" value="${plan[b.batch] || ''}" placeholder="0" class="take-input"></td>
          </tr>`).join('')}</tbody></table>`
          : `<div class="note">No free stock of this product on the shelf.</div>`}
        ${incoming.length ? `
          <div class="sub-h" style="margin-top:16px;">Arriving before the delivery date · reserve now, lots filled in at goods-in</div>
          <table class="form"><thead><tr><th>Purchase order</th><th>Due</th><th>Arrives</th><th class="num">Unreserved</th><th class="num">Reserve</th></tr></thead>
          <tbody>${incoming.map(x => `<tr>
            <td class="code">${escapeHtml(x.poId)}</td>
            <td>${escapeHtml(fmtDateShort(x.due))}</td>
            <td>${escapeHtml(arrivesLabel(x.due))}</td>
            <td class="num">${escapeHtml(fmtQty(x.remaining, l.UNIT))}</td>
            <td class="num"><input type="number" step="any" min="0" max="${x.remaining}" data-take-po="${escapeHtml(x.poLineId)}" value="${poPlan[x.poLineId] || ''}" placeholder="0" class="take-input"></td>
          </tr>`).join('')}</tbody></table>` : ''}
        <div id="allocStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-replace-instead style="margin-right:auto;">Replace instead…</button>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        ${lots.length || incoming.length ? `<button type="button" class="btn" id="allocSaveBtn">Allocate</button>` : ''}
      </div>`;
    const updateTotal = () => {
      const btn = allocForm.querySelector('#allocSaveBtn');
      if (!btn) return;
      const total = [...allocForm.querySelectorAll('[data-take], [data-take-po]')].reduce((s, i) => s + (parseFloat(i.value) || 0), 0);
      btn.textContent = total > 0 ? `Allocate ${fmtQty(total, l.UNIT)}` : 'Allocate';
      btn.disabled = total <= 0;
    };
    updateTotal();
    allocForm.oninput = updateTotal;
    allocForm.onclick = async (e) => {
      if (e.target.closest('[data-close]')) { allocDialog.close(); return; }
      if (e.target.closest('[data-replace-instead]')) { allocDialog.close(); openReplaceDialog(order, lineId); return; }
      const rm = e.target.closest('[data-remove-alloc]');
      if (rm) { allocDialog.close(); await handleRemoveAllocation(order, rm.dataset.removeAlloc); openAllocDialog(ordersData.find(r => r.obj.ID === order.obj.ID) || order, lineId); return; }
      if (e.target.closest('#allocSaveBtn')) saveAllocDialog(order, l, lots, incoming);
    };
    allocDialog.showModal();
  }

  async function saveAllocDialog(order, l, lots, incoming) {
    const status = allocForm.querySelector('#allocStatus');
    const rows = [];
    for (const input of allocForm.querySelectorAll('[data-take]')) {
      const qty = roundQty(parseFloat(input.value) || 0);
      if (qty <= 0) continue;
      const lot = lots.find(b => b.batch === input.dataset.take);
      if (qty > lot.remaining + 0.0001) { status.textContent = `Lot ${lot.batch} only has ${fmtQty(lot.remaining, lot.unit)} free.`; status.style.color = 'var(--crit)'; return; }
      rows.push({ lineId: l.ID, code: stockSource(l['PRODUCT CODE']).code, batch: lot.batch, qty });
    }
    for (const input of allocForm.querySelectorAll('[data-take-po]')) {
      const qty = roundQty(parseFloat(input.value) || 0);
      if (qty <= 0) continue;
      const x = incoming.find(i => i.poLineId === input.dataset.takePo);
      if (qty > x.remaining + 0.0001) { status.textContent = `${x.poId} only has ${fmtQty(x.remaining, l.UNIT)} unreserved.`; status.style.color = 'var(--crit)'; return; }
      rows.push({ lineId: l.ID, code: stockSource(l['PRODUCT CODE']).code, poLineId: x.poLineId, qty });
    }
    if (!rows.length) return;
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    status.textContent = 'Allocating…';
    try {
      await appendAllocations(cfg, rows);
      allocDialog.close();
      await refreshAfterAllocationChange(order.obj.ID);
    } catch (err) {
      status.textContent = 'Error: ' + err.message; status.style.color = 'var(--crit)';
    }
  }

  // ---- the Replace pop-up ----
  //
  // Swaps a line's product for another (e.g. one with stock). The line keeps
  // the code it originally had in REPLACES — so delivery notes and packing
  // slips can say what it stands in for — its old allocations are released,
  // and the new product is allocated FEFO straight away as far as stock
  // allows. Cut-to-order products aren't offered: a replacement is picked,
  // not cut, so the cutting list never changes.
  const replaceDialog = document.getElementById('replaceDialog');
  const replaceForm = document.getElementById('replaceForm');

  function openReplaceDialog(order, lineId) {
    const line = orderLinesData.find(l => l.obj.ID === lineId);
    if (!line) return;
    const l = line.obj, code = l['PRODUCT CODE'];
    const current = productOf(code) || {};
    let chosen = null;
    const candidates = products.filter(p => (p.Active || 'Yes') !== 'No' && p['Product code'] !== code && !p['Cut from (code)'])
      .map(p => ({ p, free: freeStock(p['Product code']), same: (p['Group ID'] && p['Group ID'] === current['Group ID']) || p.Category === current.Category }));
    replaceForm.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl" style="font-size:22px;">Replace ${escapeHtml(productName(code))}</div>
          <div class="subtitle">${escapeHtml(order.obj.CUSTOMER)} · ordered ${escapeHtml(fmtQty(parseFloat(l['QTY ORDERED']) || 0, l.UNIT))}${l.REPLACES ? ` · already replacing ${escapeHtml(productName(l.REPLACES))}` : ''}</div>
        </div>
        <button type="button" class="dlg-close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dlg-b">
        <input type="search" id="rpl_search" placeholder="Search products by name or code…" style="margin-bottom:10px;">
        <div id="rpl_list" class="rpl-list"></div>
        <div class="rpl-qty" id="rpl_qtyRow" hidden>
          <label for="rpl_qty">Quantity of the replacement</label>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="any" min="0" id="rpl_qty" style="width:110px;"><span id="rpl_unit" class="muted"></span></div>
        </div>
        <div id="rplStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="button" class="btn" id="rplSaveBtn" disabled>Replace</button>
      </div>`;
    const unitFor = p => p['Pricing basis'] === 'Per kg' ? 'kg' : 'pc';
    const renderList = () => {
      const term = searchNorm(replaceForm.querySelector('#rpl_search').value.trim());
      const list = candidates
        .filter(c => !term || searchMatch(c.p['Product name'], term) || searchMatch(c.p['Product code'], term))
        .sort((a, b) => (b.free > 0) - (a.free > 0) || b.same - a.same || a.p['Product name'].localeCompare(b.p['Product name']))
        .slice(0, term ? 60 : 30);
      replaceForm.querySelector('#rpl_list').innerHTML = list.length ? list.map(c => `
        <button type="button" class="rpl-row${chosen === c.p['Product code'] ? ' on' : ''}" data-pick="${escapeHtml(c.p['Product code'])}">
          ${productThumb(c.p, 'xs')}
          <span class="rpl-name">${escapeHtml(c.p['Product name'])}<span class="code"> ${escapeHtml(c.p['Product code'])}</span></span>
          <span class="rpl-free ${c.free > 0 ? '' : 'neg'}">${c.free > 0 ? escapeHtml(fmtQty(c.free, unitFor(c.p))) + ' free' : 'none free'}</span>
        </button>`).join('') : '<div class="muted" style="padding:10px 0; font-size:13px;">No products match.</div>';
    };
    renderList();
    replaceForm.querySelector('#rpl_search').addEventListener('input', renderList);
    replaceForm.onclick = (e) => {
      if (e.target.closest('[data-close]')) { replaceDialog.close(); return; }
      const pickBtn = e.target.closest('[data-pick]');
      if (pickBtn) {
        chosen = pickBtn.dataset.pick;
        const p = productOf(chosen);
        replaceForm.querySelector('#rpl_qtyRow').hidden = false;
        const qtyInput = replaceForm.querySelector('#rpl_qty');
        if (!qtyInput.value) qtyInput.value = parseFloat(l['QTY ORDERED']) || '';
        replaceForm.querySelector('#rpl_unit').textContent = unitLabel(unitFor(p));
        const btn = replaceForm.querySelector('#rplSaveBtn');
        btn.disabled = false;
        btn.textContent = `Replace with ${p['Product name']}`;
        renderList();
        return;
      }
      if (e.target.closest('#rplSaveBtn')) saveReplacement(order, line, chosen);
    };
    replaceDialog.showModal();
    replaceForm.querySelector('#rpl_search').focus();
  }

  async function saveReplacement(order, line, newCode) {
    const status = replaceForm.querySelector('#rplStatus');
    const p = productOf(newCode);
    const qty = roundQty(parseFloat(replaceForm.querySelector('#rpl_qty').value) || 0);
    if (!p || qty <= 0) { status.textContent = 'Pick a product and a quantity.'; status.style.color = 'var(--crit)'; return; }
    const replacesIdx = lineHeaders.indexOf('REPLACES');
    if (replacesIdx < 0) { status.textContent = 'Re-run Setup first — it adds the REPLACES column to OrderLines.'; status.style.color = 'var(--crit)'; return; }
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    status.textContent = 'Replacing…';
    const l = line.obj;
    const unit = p['Pricing basis'] === 'Per kg' ? 'kg' : 'pc';
    try {
      // Release the old product's allocations first.
      const oldAllocs = allocationsData.filter(a => a.obj['ORDER LINE ID'] === l.ID);
      if (oldAllocs.length) {
        const sid = await ensureSheetId(cfg, 'Allocations');
        await sheetsBatchUpdate(cfg.spreadsheetId, buildDeleteRowRequests(sid, oldAllocs.map(a => a.rowNumber)), token);
      }
      await sheetsBatchUpdateValues(cfg.spreadsheetId, [
        { range: `OrderLines!C${line.rowNumber}:E${line.rowNumber}`, values: [[newCode, qty, unit]] },
        { range: `OrderLines!${colLetter(replacesIdx + 1)}${line.rowNumber}`, values: [[l.REPLACES || l['PRODUCT CODE']]] }
      ], token);
      // Allocate the replacement from what's free, earliest best-before first.
      const { rows } = autoAllocate([{ lineId: l.ID, code: newCode, qty }], order.obj['DELIVERY DATE']);
      if (rows.length) await appendAllocations(cfg, rows);
      replaceDialog.close();
      await refreshAfterAllocationChange(order.obj.ID);
      setDlgStatus(`Replaced with ${p['Product name']}.`, 'ok');
    } catch (err) {
      status.textContent = 'Error: ' + err.message; status.style.color = 'var(--crit)';
    }
  }

  // Available lots for a product: what's been delivered minus what's
  // already allocated to ANY order line — stock is a shared pool, FEFO
  // (earliest best-before first) sorted, same computation as the Dashboard
  // and Stock pages.
  function computeAvailableBatches(productCode) {
    const batchMap = {};
    deliveriesData.forEach(({ obj: d }) => {
      if (d['PRODUCT CODE'] !== productCode) return;
      const key = d['BATCH/LOT NUMBER'];
      if (!batchMap[key]) batchMap[key] = { batch: key, bbe: d['BEST BEFORE DATE'], unit: d.UNIT || 'kg', remaining: 0 };
      batchMap[key].remaining += parseFloat(d['QTY RECEIVED']) || 0;
      if (d['BEST BEFORE DATE'] && (!batchMap[key].bbe || d['BEST BEFORE DATE'] < batchMap[key].bbe)) batchMap[key].bbe = d['BEST BEFORE DATE'];
    });
    allocationsData.forEach(({ obj: a }) => {
      if (a['PRODUCT CODE'] !== productCode) return;
      const key = a['BATCH/LOT NUMBER'];
      if (batchMap[key]) batchMap[key].remaining -= parseFloat(a['QTY ALLOCATED']) || 0;
    });
    return Object.values(batchMap)
      .filter(b => b.remaining > 0.0001)
      .sort((a, b) => (a.bbe || '9999').localeCompare(b.bbe || '9999'));
  }

  function deliveryBbeFor(productCode, batch) {
    const d = deliveriesData.find(r => r.obj['PRODUCT CODE'] === productCode && r.obj['BATCH/LOT NUMBER'] === batch);
    return d ? d.obj['BEST BEFORE DATE'] : '';
  }

  async function handleRemoveAllocation(order, allocId) {
    if (!confirm('Remove this allocation? This can\'t be undone.')) return;
    const alloc = allocationsData.find(a => a.obj.ID === allocId);
    if (!alloc) return;
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Removing...');
    try {
      const sid = await ensureSheetId(cfg, 'Allocations');
      if (sid === null) throw new Error('Allocations tab not found — run Setup first.');
      await sheetsBatchUpdate(cfg.spreadsheetId, buildDeleteRowRequests(sid, [alloc.rowNumber]), token);
      await refreshAfterAllocationChange(order.obj.ID);
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  async function handleAddLinesToOrder(order) {
    if (!draftLines.length) { setDlgStatus('Pick at least one product first.', 'error'); return; }
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Adding to order...');
    try {
      const existingLines = await sheetsGet(cfg.spreadsheetId, 'OrderLines!A:A', token);
      let base = existingLines.length ? existingLines : [['ID']];
      const placed = expandDraftLines().map(l => {
        const lineId = nextId(base, 'OL');
        base = base.concat([[lineId]]);
        return { ...l, lineId };
      });
      await sheetsAppendRows(cfg.spreadsheetId, 'OrderLines!A:G', placed.map(l => [l.lineId, order.obj.ID, l.code, l.qty, l.unit, 'New', '']), token);
      const alloc = autoAllocate(placed, order.obj['DELIVERY DATE']);
      if (alloc.rows.length) await appendAllocations(cfg, alloc.rows);
      draftLines = [];
      await refreshAfterAllocationChange(order.obj.ID);
      if (alloc.short) setDlgStatus(`Added — ${alloc.short} line(s) short of stock. Use Replace to swap them.`, 'error');
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // Removing a line cascades to its allocations too — an allocation without
  // an order line would be a dangling reference with no order to trace back
  // to (and would keep the lot it claims stuck as "unavailable" forever).
  async function handleRemoveLine(order, lineId) {
    const line = orderLinesData.find(l => l.obj.ID === lineId);
    if (!line) return;
    const lineAllocs = allocationsData.filter(a => a.obj['ORDER LINE ID'] === lineId);
    const msg = lineAllocs.length
      ? `Remove this line? It has ${lineAllocs.length} stock allocation(s) already made — those will be removed too, freeing the stock back up. This can't be undone.`
      : `Remove this line? This can't be undone.`;
    if (!confirm(msg)) return;

    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Removing...');
    try {
      const linesSid = await ensureSheetId(cfg, 'OrderLines');
      const allocsSid = await ensureSheetId(cfg, 'Allocations');
      if (linesSid === null || allocsSid === null) throw new Error('Required tab not found — run Setup first.');
      const requests = [
        ...buildDeleteRowRequests(linesSid, [line.rowNumber]),
        ...buildDeleteRowRequests(allocsSid, lineAllocs.map(a => a.rowNumber))
      ];
      await sheetsBatchUpdate(cfg.spreadsheetId, requests, token);
      await refreshAfterAllocationChange(order.obj.ID);
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // Deletes the order itself, plus every line on it and every allocation on
  // those lines — otherwise they'd be left dangling with no order to belong
  // to, and their stock would stay claimed forever.
  async function handleDeleteOrder(order) {
    const lines = orderLinesData.filter(l => l.obj['ORDER ID'] === order.obj.ID);
    const lineIds = new Set(lines.map(l => l.obj.ID));
    const allocs = allocationsData.filter(a => lineIds.has(a.obj['ORDER LINE ID']));
    const msg = `Delete order ${order.obj.ID}? This removes its ${lines.length} line(s)`
      + (allocs.length ? ` and ${allocs.length} stock allocation(s)` : '') + `. This can't be undone.`;
    if (!confirm(msg)) return;

    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Deleting...');
    try {
      const ordersSid = await ensureSheetId(cfg, 'Orders');
      const linesSid = await ensureSheetId(cfg, 'OrderLines');
      const allocsSid = await ensureSheetId(cfg, 'Allocations');
      if (ordersSid === null || linesSid === null || allocsSid === null) throw new Error('Required tab not found — run Setup first.');
      const requests = [
        ...buildDeleteRowRequests(ordersSid, [order.rowNumber]),
        ...buildDeleteRowRequests(linesSid, lines.map(l => l.rowNumber)),
        ...buildDeleteRowRequests(allocsSid, allocs.map(a => a.rowNumber))
      ];
      await sheetsBatchUpdate(cfg.spreadsheetId, requests, token);
      dialogEl.close();
      setStatus(`Order ${order.obj.ID} deleted.`, 'ok');
      loadAll();
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // Re-fetches everything (simplest way to keep the shared stock pool and
  // every line's allocated total consistent), nudges the order's own STATUS
  // between New <-> Allocated if that's newly warranted, then re-renders
  // the still-open dialog for this same order.
  async function refreshAfterAllocationChange(orderId) {
    await loadAll();
    await maybeAutoUpdateStatus(orderId);
    const order = ordersData.find(r => r.obj.ID === orderId);
    if (order) { renderViewForm(order); setDlgStatus('Updated.', 'ok'); }
  }

  async function maybeAutoUpdateStatus(orderId) {
    const order = ordersData.find(r => r.obj.ID === orderId);
    if (!order) return;
    const status = order.obj.STATUS || 'New';
    if (status !== 'New' && status !== 'Allocated') return; // never touch later manual stages (Picked/Cut/Packed/Dispatched)
    const lines = orderLinesData.filter(l => l.obj['ORDER ID'] === orderId);
    if (!lines.length) return;
    const fullyAllocated = lines.every(l => {
      const ordered = lineNeed(l.obj); // a cut portion needs kilos of its wheel
      const allocated = allocationsData.filter(a => a.obj['ORDER LINE ID'] === l.obj.ID).reduce((s, a) => s + (parseFloat(a.obj['QTY ALLOCATED']) || 0), 0);
      return allocated + 0.0001 >= ordered;
    });
    const newStatus = fullyAllocated ? 'Allocated' : 'New';
    if (newStatus === status) return;
    try {
      const cfg = getStoredConfig();
      await sheetsUpdateRange(cfg.spreadsheetId, `Orders!E${order.rowNumber}:E${order.rowNumber}`, [[newStatus]], token, 'USER_ENTERED');
      order.obj.STATUS = newStatus;
      renderTable();
    } catch (err) { /* best-effort — the Status dropdown in the dialog still works manually */ }
  }

  async function handleStatusChange(order, newStatus) {
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    setDlgStatus('Updating status...');
    try {
      await sheetsUpdateRange(cfg.spreadsheetId, `Orders!E${order.rowNumber}:E${order.rowNumber}`, [[newStatus]], token, 'USER_ENTERED');
      order.obj.STATUS = newStatus;
      renderTable();
      setDlgStatus('Status updated.', 'ok');
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- wiring ----

  document.getElementById('newOrderBtn').addEventListener('click', () => {
    if (!token) return;
    renderNewOrderForm();
    dialogEl.showModal();
    guard.arm();
  });
  document.getElementById('reloadBtn').addEventListener('click', loadAll);

  window.addEventListener('load', loadAll);
</script>
</body>
</html>
