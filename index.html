<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=40">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body class="signed-out">

<div class="signin-screen">
  <div class="signin-card">
    <img class="signin-logo" src="img/logo.png" alt="Provisions — Wine &amp; Cheese">
    <h2>Stock &amp; orders</h2>
    <p class="sub">Sign in with your Google account to continue.</p>
    <button type="button" class="btn" id="signInBtn">Sign in with Google</button>
    <div class="mono js-status signin-status" role="alert"></div>
  </div>
</div>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Dashboard</h2>

  <div class="mono js-status" style="margin:-12px 0 16px; font-size:12.5px; color:var(--steel);"></div>

  <div id="dashCard" style="display:none;">

    <!-- This week's snapshot — week-scoped; the switcher only affects this band -->
    <div class="section-gap week-band">
      <div class="week-bar">
        <button type="button" class="wk-btn" id="wkPrev" aria-label="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div><span class="kicker" id="wkKicker">This week</span></div>
        <button type="button" class="wk-btn" id="wkNext" aria-label="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <a href="#" class="wk-jump" id="wkJump" style="display:none;">Jump to this week <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
      </div>
      <h2 style="font-size:22px; margin-bottom:16px;" id="wkHeading">This week's snapshot</h2>
      <div class="row" id="wkStats" style="margin-bottom:2px;"></div>
    </div>

    <div class="live-divider"><span class="kicker">Right now</span></div>

    <!-- Right now: four compact boxes; each expands to full width on click. -->
    <div class="dash-grid">
      <section class="panel dash-box" id="boxDeliveries">
        <div class="panel-h"><h3 id="upcomingTitle">Deliveries this week</h3><span class="db-count" id="upcomingCount"></span><button type="button" class="db-expand" data-expand aria-label="Expand" title="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg></button></div>
        <div class="db-body">
          <div id="lateSection" hidden>
            <div class="db-sub db-sub-late">Late · <span id="lateCount"></span></div>
            <div id="lateList"></div>
            <div class="db-sub">Due this week</div>
          </div>
          <div id="upcomingList"></div>
        </div>
        <button type="button" class="db-more" data-expand hidden></button>
      </section>

      <section class="panel dash-box" id="boxOrders">
        <div class="panel-h"><h3>Customer orders</h3><span class="db-count" id="ordersCount"></span><a href="orders.html" class="btn sm" style="margin-left:6px;">+ New</a><button type="button" class="db-expand" data-expand aria-label="Expand" title="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg></button></div>
        <div class="db-body"><div id="custOrdersList"></div></div>
        <button type="button" class="db-more" data-expand hidden></button>
      </section>

      <section class="panel dash-box" id="boxShort">
        <div class="panel-h"><h3>Short-dated · under 3 weeks</h3><span class="db-count" id="expiringCount"></span><button type="button" class="db-expand" data-expand aria-label="Expand" title="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg></button></div>
        <div class="db-body"><div id="expiringList"></div></div>
        <button type="button" class="db-more" data-expand hidden></button>
      </section>

      <section class="panel dash-box" id="boxLow">
        <div class="panel-h"><h3>Low stock</h3><span class="db-count" id="lowStockCount"></span><button type="button" class="db-expand" data-expand aria-label="Expand" title="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg></button></div>
        <div class="db-body"><div id="lowStockList"></div></div>
        <button type="button" class="db-more" data-expand hidden></button>
      </section>
    </div>

  </div>
</main>

<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=7"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script>
  const signInBtn = document.getElementById('signInBtn');
  let tokenClient = null;

  // One status line on the sign-in screen, one under the Dashboard heading —
  // only one is visible at a time, so both get the same message.
  function setStatus(msg, kind) {
    document.querySelectorAll('.js-status').forEach(el => {
      el.textContent = msg;
      el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
    });
  }

  function refreshSignedInUI() {
    document.body.classList.toggle('signed-out', !tryResumeSession());
  }

  // Turns a sheet's [header, ...rows] into plain objects keyed by header text.
  function toObjects(rows) {
    if (!rows.length) return [];
    const [head, ...rest] = rows;
    return rest.map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] ?? ''; }); return o; });
  }

  function fmtDateShort(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function fmtDateRange(s, e) {
    if (!s) return 'No date set';
    if (!e || e === s) return fmtDateShort(s);
    return `${fmtDateShort(s)} – ${fmtDateShort(e)}`;
  }

  // ---- week helpers — weeks run Monday–Sunday; offset 0 = the week
  // containing today, negative = past, positive = future ----

  function mondayOf(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function weekRange(offset) {
    const start = mondayOf(new Date());
    start.setDate(start.getDate() + offset * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return { start, end };
  }

  // Local-date ISO string (not toISOString, which converts to UTC and can
  // shift the date near midnight in a +ve timezone like BST).
  function isoDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function fmtWeekRange(start, end) {
    const sameMonth = start.getMonth() === end.getMonth();
    const s = start.toLocaleDateString('en-GB', sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' });
    const e = end.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    return `${s}–${e}`;
  }

  function dateInRange(dateStr, startIso, endIso) {
    return !!dateStr && dateStr >= startIso && dateStr <= endIso;
  }

  function rangesOverlap(aStart, aEnd, bStart, bEnd) {
    return aStart <= bEnd && (aEnd || aStart) >= bStart;
  }

  function daysUntil(dateStr) {
    const target = new Date(dateStr + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((target - today) / 86400000);
  }

  // ---- icons (stroke-based, 24px grid, matches the sidebar's rail icons) ----
  const ICON_CHEVRON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.2 2"/></svg>`;
  const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const ICON_BOX = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><path d="M12 11.5v9"/></svg>`;
  const ICON_CLIPBOARD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4"/></svg>`;
  const ICON_CHECK_CIRCLE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.3 2.3 4.7-5"/></svg>`;
  const ICON_STOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>`;

  // ---- dashboard data + rendering ----

  let weekOffset = 0;
  // The "Short-dated" panel lists lots with this many days or fewer left.
  const SHORT_DATED_DAYS = 21;
  let dash = null; // cached load — week nav re-renders from this without refetching

  async function loadDashboard() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const card = document.getElementById('dashCard');
    if (!token || !cfg.spreadsheetId) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    setStatus('');
    try {
      const groupsP = loadProductGroups(cfg.spreadsheetId); // in parallel with the reads below
      const [productRows, deliveryRows, allocationRows, poRows, polRows, orderRows, lineRows] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Products!A:AZ', token),
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Orders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'OrderLines!A:Z', token)
      ]);

      const products = toObjects(productRows);
      const productByCode = {};
      products.forEach(p => { productByCode[p['Product code']] = p; });
      registerProducts(products);
      registerProductGroups(await groupsP);

      // Batches currently in stock — Deliveries minus Allocations per
      // product+lot, same computation as the Stock page.
      const batchMap = {};
      const bKey = (code, batch) => `${code} ${batch}`;
      toObjects(deliveryRows).forEach(d => {
        const k = bKey(d['PRODUCT CODE'], d['BATCH/LOT NUMBER']);
        if (!batchMap[k]) batchMap[k] = { code: d['PRODUCT CODE'], batch: d['BATCH/LOT NUMBER'], unit: d.UNIT || 'kg', bbe: d['BEST BEFORE DATE'], received: 0, allocated: 0 };
        batchMap[k].received += parseFloat(d['QTY RECEIVED']) || 0;
        if (d['BEST BEFORE DATE'] && (!batchMap[k].bbe || d['BEST BEFORE DATE'] < batchMap[k].bbe)) batchMap[k].bbe = d['BEST BEFORE DATE'];
      });
      toObjects(allocationRows).forEach(a => {
        const k = bKey(a['PRODUCT CODE'], a['BATCH/LOT NUMBER']);
        if (batchMap[k]) batchMap[k].allocated += parseFloat(a['QTY ALLOCATED']) || 0;
      });
      const batches = Object.values(batchMap)
        .map(b => ({ ...b, remaining: b.received - b.allocated }))
        .filter(b => b.remaining > 0.0001);

      const onHandByCode = {};
      batches.forEach(b => { onHandByCode[b.code] = (onHandByCode[b.code] || 0) + b.remaining; });

      const poLineCountById = {};
      toObjects(polRows).forEach(l => { poLineCountById[l['PO ID']] = (poLineCountById[l['PO ID']] || 0) + 1; });
      const orderLineCountById = {};
      toObjects(lineRows).forEach(l => { orderLineCountById[l['ORDER ID']] = (orderLineCountById[l['ORDER ID']] || 0) + 1; });

      dash = {
        products, productByCode, batches, onHandByCode,
        purchaseOrders: toObjects(poRows), poLineCountById, poLines: toObjects(polRows),
        orders: toObjects(orderRows), orderLineCountById, orderLines: toObjects(lineRows)
      };

      renderWeekBand();
      renderUpcomingDeliveries();
      renderCustomerOrders();
      renderStockAlerts();
      updateDashBoxes();
      setStatus('');
    } catch (err) {
      setStatus('Error loading dashboard: ' + err.message, 'error');
    }
  }

  // Week-scoped: everything in this band re-filters to the selected week.
  function renderWeekBand() {
    if (!dash) return;
    const { start, end } = weekRange(weekOffset);
    const startIso = isoDate(start), endIso = isoDate(end);
    const isCurrent = weekOffset === 0;

    const kicker = document.getElementById('wkKicker');
    kicker.textContent = isCurrent ? `This week · ${fmtWeekRange(start, end)}` : `Week of ${fmtWeekRange(start, end)}`;
    kicker.classList.toggle('away', !isCurrent);
    document.getElementById('wkHeading').textContent = isCurrent ? "This week's snapshot" : `Snapshot — week of ${fmtWeekRange(start, end)}`;
    document.getElementById('wkJump').style.display = isCurrent ? 'none' : 'inline-flex';

    const ordersInWeek = dash.orders.filter(o => dateInRange(o['DELIVERY DATE'], startIso, endIso));
    const pending = ordersInWeek.filter(o => (o.STATUS || 'New') === 'New').length;
    const confirmed = ordersInWeek.length - pending;

    const deliveriesExpected = dash.purchaseOrders.filter(po => {
      if (po.STATUS === 'Cancelled') return false;
      const s = po['EXPECTED START DATE'];
      if (!s) return false;
      return rangesOverlap(s, po['EXPECTED END DATE'] || s, startIso, endIso);
    }).length;

    const lotsExpiring = dash.batches.filter(b => dateInRange(b.bbe, startIso, endIso)).length;

    document.getElementById('wkStats').innerHTML = `
      <div class="stat"><span class="l">Customer orders</span><span class="n">${ordersInWeek.length}</span></div>
      <div class="stat"><span class="l">Pending</span><span class="n">${pending}</span></div>
      <div class="stat"><span class="l">Confirmed</span><span class="n">${confirmed}</span></div>
      <div class="stat"><span class="l">Deliveries expected</span><span class="n">${deliveriesExpected}</span></div>
      <div class="stat${lotsExpiring > 0 ? ' bad' : ''}"><span class="l">Lots expiring</span><span class="n">${lotsExpiring}</span></div>
    `;
  }

  // Live, split by date: POs still awaiting delivery whose expected window
  // falls in the current week, and — separately — open POs already past the
  // end of their window (late), most overdue first. A PO due in a later week
  // shows in neither; the week band above counts those.
  function poRowHtml(po, late) {
    const due = po['EXPECTED END DATE'] || po['EXPECTED START DATE'];
    const daysLate = late ? Math.max(1, -daysUntil(due)) : 0;
    return `
      <a class="lrow" href="purchase-orders.html?open=${encodeURIComponent(po.ID)}" data-po-id="${escapeHtml(po.ID)}">
        <div class="lrow-body">
          <div class="lrow-name">${escapeHtml(po.SUPPLIER)} <span class="code" style="margin-left:6px;">${escapeHtml(po.ID)}</span></div>
          <div class="lrow-meta">${late ? 'Was due ' : ''}${escapeHtml(fmtDateRange(po['EXPECTED START DATE'], po['EXPECTED END DATE']))} &middot; ${dash.poLineCountById[po.ID] || 0} item(s)</div>
        </div>
        <div class="lrow-side">
          ${late ? `<span class="tag t-crit">${daysLate} day${daysLate === 1 ? '' : 's'} late</span>` : ''}
          <span class="lrow-chev">${ICON_CHEVRON}</span>
        </div>
      </a>`;
  }

  function renderUpcomingDeliveries() {
    const { start, end } = weekRange(0);
    const startIso = isoDate(start), endIso = isoDate(end), todayIso = isoDate(new Date());
    const open = dash.purchaseOrders.filter(o => o.STATUS === 'Ordered' || !o.STATUS);
    const dueBy = po => po['EXPECTED END DATE'] || po['EXPECTED START DATE'] || '';
    const late = open.filter(po => dueBy(po) && dueBy(po) < todayIso)
      .sort((a, b) => dueBy(a).localeCompare(dueBy(b)));
    const thisWeek = open.filter(po => !late.includes(po) && po['EXPECTED START DATE']
        && rangesOverlap(po['EXPECTED START DATE'], dueBy(po), startIso, endIso))
      .sort((a, b) => a['EXPECTED START DATE'].localeCompare(b['EXPECTED START DATE']));
    const later = open.filter(po => !late.includes(po) && !thisWeek.includes(po)).length;

    document.getElementById('upcomingCount').textContent = `${late.length ? late.length + ' late · ' : ''}${thisWeek.length}`;
    document.getElementById('lateSection').hidden = !late.length;
    document.getElementById('lateCount').textContent = late.length || '';
    document.getElementById('lateList').innerHTML = late.map(po => poRowHtml(po, true)).join('');

    document.getElementById('upcomingTitle').textContent = `Deliveries this week · ${fmtWeekRange(start, end)}`;
    const list = document.getElementById('upcomingList');
    if (!thisWeek.length) {
      list.innerHTML = `
        <div class="empty-block">
          <div class="empty-icon">${ICON_BOX}</div>
          <div class="empty-title">No deliveries due this week</div>
          <div class="empty-sub">${later ? `${later} purchase order(s) are due in later weeks — use the week arrows above to see them.` : "Deliveries you're expecting from suppliers will show up here."}</div>
          <a href="purchase-orders.html" class="btn ghost sm">+ New purchase order</a>
        </div>`;
      return;
    }
    list.innerHTML = thisWeek.map(po => poRowHtml(po, false)).join('')
      + (later ? `<div class="lrow-foot muted">${later} more purchase order(s) due in later weeks.</div>` : '');
  }

  // Live: open (not yet Dispatched) customer orders — clicking a row deep
  // links into orders.html and opens that exact order's detail dialog.
  function renderCustomerOrders() {
    const list = document.getElementById('custOrdersList');
    const open = dash.orders
      .filter(o => o.STATUS !== 'Dispatched')
      .sort((a, b) => (a['DELIVERY DATE'] || '9999').localeCompare(b['DELIVERY DATE'] || '9999'));
    document.getElementById('ordersCount').textContent = open.length || '';

    if (!open.length) {
      list.innerHTML = `
        <div class="empty-block">
          <div class="empty-icon">${ICON_CLIPBOARD}</div>
          <div class="empty-title">No open customer orders</div>
          <div class="empty-sub">New orders you place will show up here until they're dispatched.</div>
          <a href="orders.html" class="btn ghost sm">+ New customer order</a>
        </div>`;
      return;
    }
    list.innerHTML = open.map(o => {
      const pending = (o.STATUS || 'New') === 'New';
      return `
      <a class="lrow" href="orders.html?open=${encodeURIComponent(o.ID)}" data-order-id="${escapeHtml(o.ID)}">
        <span class="lrow-icon ${pending ? 'pending' : 'confirmed'}">${pending ? ICON_CLOCK : ICON_CHECK}</span>
        <div class="lrow-body">
          <div class="lrow-name">${escapeHtml(o.CUSTOMER)}</div>
          <div class="lrow-meta">${o['DELIVERY DATE'] ? 'Delivery ' + escapeHtml(fmtDateShort(o['DELIVERY DATE'])) : 'No delivery date set'} &middot; ${dash.orderLineCountById[o.ID] || 0} item(s)</div>
        </div>
        <div class="lrow-side">
          <span class="tag ${pending ? 't-warn' : 't-ok'}">${pending ? 'Pending' : 'Confirmed'}</span>
          <span class="lrow-chev">${ICON_CHEVRON}</span>
        </div>
      </a>`;
    }).join('');
  }

  // Live: short-dated lots — anything in stock with under 3 weeks
  // (SHORT_DATED_DAYS) left, or already past its best-before, soonest first,
  // so sales and the shops can push it in time (independent of the week
  // switcher above) — and low stock (on-hand below each product's own
  // Reorder threshold) — see Products for that field.
  function renderStockAlerts() {
    const expiring = dash.batches
      .filter(b => b.bbe && daysUntil(b.bbe) <= SHORT_DATED_DAYS)
      .sort((a, b) => a.bbe.localeCompare(b.bbe));

    document.getElementById('expiringCount').textContent = expiring.length || '';
    const expList = document.getElementById('expiringList');
    expList.innerHTML = !expiring.length ? `
      <div class="empty-block">
        <div class="empty-icon">${ICON_CHECK_CIRCLE}</div>
        <div class="empty-title">Nothing short-dated</div>
        <div class="empty-sub">Every lot in stock has more than 3 weeks of shelf life.</div>
      </div>` : expiring.map(b => {
      const days = daysUntil(b.bbe);
      const prod = dash.productByCode[b.code];
      return `
      <div class="arow">
        ${productCell(prod, `
          <div class="arow-name">${escapeHtml(prod ? prod['Product name'] : b.code)}</div>
          <div class="arow-sub code">Lot ${escapeHtml(b.batch)} · ${escapeHtml(qtyUnit(Math.round(b.remaining * 100) / 100, b.unit))} left</div>`)}
        <span class="tag ${days <= 7 ? 't-crit' : days <= 14 ? 't-warn' : 't-yell'}">${days < 0 ? 'Past best-before' : days + 'd left'}</span>
      </div>`;
    }).join('');

    const low = dash.products
      .map(p => ({ p, onHand: dash.onHandByCode[p['Product code']] || 0, threshold: parseFloat(p['Reorder threshold']) }))
      .filter(x => !isNaN(x.threshold) && x.threshold > 0 && x.onHand < x.threshold)
      .sort((a, b) => (a.onHand - a.threshold) - (b.onHand - b.threshold));

    document.getElementById('lowStockCount').textContent = low.length || '';
    const lowList = document.getElementById('lowStockList');
    lowList.innerHTML = !low.length ? `
      <div class="empty-block">
        <div class="empty-icon">${ICON_STOCK}</div>
        <div class="empty-title">Everything's well stocked</div>
        <div class="empty-sub">No products below their reorder threshold right now.</div>
      </div>` : low.map(({ p, onHand }) => {
      const unit = p['Pricing basis'] === 'Per kg' ? 'kg' : 'pc';
      return `
      <div class="arow">
        ${productCell(p, `
          <div class="arow-name">${escapeHtml(p['Product name'])}</div>
          <div class="arow-sub">${escapeHtml(p.Category || '')}</div>`)}
        <span class="tag t-warn">${onHand.toFixed(unit === 'kg' ? 1 : 0)}${unit === 'kg' ? 'kg' : ' ' + unitLabel(unit)} left</span>
      </div>`;
    }).join('');
  }

  document.getElementById('wkPrev').addEventListener('click', () => { weekOffset--; renderWeekBand(); });
  document.getElementById('wkNext').addEventListener('click', () => { weekOffset++; renderWeekBand(); });
  document.getElementById('wkJump').addEventListener('click', (e) => { e.preventDefault(); weekOffset = 0; renderWeekBand(); });

  // ---- the four "Right now" boxes: compact by default, one click to see
  // everything (the box spans the full width); click again to fold it ----
  function updateDashBoxes() {
    document.querySelectorAll('.dash-box').forEach(box => {
      const body = box.querySelector('.db-body');
      const more = box.querySelector('.db-more');
      const expanded = box.classList.contains('expanded');
      const overflowing = body.scrollHeight > body.clientHeight + 2;
      const rows = body.querySelectorAll('.lrow, .arow').length;
      more.hidden = !expanded && !overflowing;
      more.textContent = expanded ? 'Show less' : `Show all ${rows}`;
      box.classList.toggle('fades', !expanded && overflowing);
      box.querySelectorAll('[data-expand].db-expand').forEach(b => {
        b.hidden = !expanded && !overflowing; // nothing more to show
        b.title = b.ariaLabel = expanded ? 'Collapse' : 'Expand';
      });
    });
  }
  document.querySelector('.dash-grid').addEventListener('click', e => {
    const btn = e.target.closest('[data-expand]');
    if (!btn) return;
    const box = btn.closest('.dash-box');
    box.classList.toggle('expanded');
    updateDashBoxes();
    if (box.classList.contains('expanded')) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  window.addEventListener('resize', () => { if (dash) updateDashBoxes(); });

  const hoverLine = (code, qty, unit) => {
    const prod = dash.productByCode[code];
    return { product: prod, name: prod ? prod['Product name'] : code, qty: qtyUnit(qty, unit) };
  };
  const poHoverCard = el => {
    const o = dash && dash.purchaseOrders.find(p => p.ID === el.dataset.poId);
    if (!o) return null;
    return {
      title: o.SUPPLIER, id: o.ID, status: o.STATUS || 'Ordered',
      meta: [`Expected ${fmtDateRange(o['EXPECTED START DATE'], o['EXPECTED END DATE'])}`, o.NOTES ? `Note: ${o.NOTES}` : ''],
      lines: dash.poLines.filter(l => l['PO ID'] === o.ID).map(l => hoverLine(l['PRODUCT CODE'], l['QTY ORDERED'], l.UNIT))
    };
  };
  attachOrderHoverCard(document.getElementById('upcomingList'), '[data-po-id]', poHoverCard);
  attachOrderHoverCard(document.getElementById('lateList'), '[data-po-id]', poHoverCard);
  attachOrderHoverCard(document.getElementById('custOrdersList'), '[data-order-id]', el => {
    const o = dash && dash.orders.find(x => x.ID === el.dataset.orderId);
    if (!o) return null;
    return {
      title: o.CUSTOMER, id: o.ID, status: o.STATUS || 'New',
      meta: [
        o['DELIVERY DATE'] ? `Delivery ${fmtDateShort(o['DELIVERY DATE'])}` : 'No delivery date set',
        o['PLACED BY'] ? `Placed by ${o['PLACED BY']}` : '',
        o.NOTES ? `Note: ${o.NOTES}` : ''
      ],
      lines: dash.orderLines.filter(l => l['ORDER ID'] === o.ID).map(l => hoverLine(l['PRODUCT CODE'], l['QTY ORDERED'], l.UNIT))
    };
  });

  window.addEventListener('load', () => {
    refreshSignedInUI();
    loadDashboard();
  });
  // An order or PO opened in place (js/shell.js) may have changed status,
  // lines or stock — re-read so the panels match.
  window.onRecordDialogClosed = loadDashboard;

  signInBtn.addEventListener('click', () => {
    tokenClient = initGoogleAuth({
      clientId: getStoredConfig().clientId,
      onToken: () => {
        // Signed out from another page (or its session ran out)? Go back there.
        let next = '';
        try { next = sessionStorage.getItem(NEXT_PAGE_KEY) || ''; sessionStorage.removeItem(NEXT_PAGE_KEY); } catch (e) {}
        if (next && !/^index\.html/.test(next)) { location.replace(next); return; }
        setStatus('');
        refreshSignedInUI();
        refreshAccount();
        restartPageLoader();
        loadDashboard();
      },
      onError: (err) => setStatus(err, 'error')
    });
    tokenClient.requestAccessToken(signInRequest({ prompt: 'select_account' }));
  });
</script>
</body>
</html>
