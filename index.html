<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Today</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=48">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="theme-color" content="#2C3A57">
</head>
<body class="signed-out">

<div class="signin-screen">
  <div class="signin-card">
    <img class="signin-logo" src="img/logo.png" alt="Provisions — Wine &amp; Cheese">
    <h2>Stock &amp; orders</h2>
    <p class="sub">Sign in with your Google account to continue.</p>
    <button type="button" class="btn" id="signInBtn">Sign in with Google</button>
    <div class="mono js-status signin-status" role="alert"></div>
  </div>
</div>

<header class="topbar no-print" id="topbar"></header>

<main class="today">
  <div class="today-head">
    <div>
      <div class="kicker" id="todayKicker"></div>
      <h2>Today</h2>
    </div>
    <div class="alerts" id="alerts"></div>
  </div>

  <div class="mono js-status" style="margin:-8px 0 16px; font-size:12.5px; color:var(--steel);"></div>

  <div id="dashCard" hidden>
    <!-- On a phone: big buttons for the warehouse jobs, each with what's waiting. -->
    <section class="tasks" id="phoneTasks" aria-label="Warehouse jobs"></section>

    <button type="button" class="task-back" id="taskViewBtn">← Warehouse buttons</button>
    <div class="today-grid">
      <section class="panel run-card" id="runToday" aria-labelledby="runTodayH"></section>
      <div class="today-side">
        <section class="panel run-card run-next" id="runNext" aria-labelledby="runNextH"></section>
        <section class="panel gi-card" aria-labelledby="goodsInH">
          <div class="run-h"><h3 id="goodsInH">Goods in</h3><a href="purchase-orders.html" class="run-link">All POs</a></div>
          <div id="goodsInList"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=12"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/cuts.js?v=1"></script>
<script src="js/lists-data.js?v=2"></script>
<script>
  const signInBtn = document.getElementById('signInBtn');
  let tokenClient = null;

  // One status line on the sign-in screen, one under the Dashboard heading —
  // only one is visible at a time, so both get the same message.
  function setStatus(msg, kind) {
    document.querySelectorAll('.js-status').forEach(el => {
      el.textContent = msg;
      el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
    });
  }

  function refreshSignedInUI() {
    document.body.classList.toggle('signed-out', !tryResumeSession());
  }

  // ---- Today ----
  // What has to happen now: the next delivery run (today's, if there is one)
  // step by step, the run after it, goods due in, and a strip of stock alerts.
  // Everything is computed from one loadListsData() read (js/lists-data.js);
  // nothing is stored.

  // Lots with this many days or fewer left count as short-dated.
  const ALERT_SHORT_DAYS = 21;
  // Order statuses in working order, each a shade darker (the run bar).
  const STAGES = [
    ['New', '#D8DCE6'], ['Allocated', '#AEB6C9'], ['Picked', '#8A95AE'],
    ['Cut', '#66728F'], ['Packed', '#3E4A69'], ['Dispatched', '#1F2940']
  ];
  const ICON_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

  const statusOf = o => o.STATUS || 'New';
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const todayIso = () => isoDate(new Date());

  function daysUntil(iso) {
    const t = new Date(iso + 'T00:00:00'), now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((t - now) / 86400000);
  }
  function dayName(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
  }
  // "Today", "Tomorrow", "In 6 days", "2 days ago".
  function whenLabel(iso) {
    const n = daysUntil(iso);
    return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n > 1 ? `In ${n} days` : n === -1 ? 'Yesterday' : `${-n} days ago`;
  }

  // Pieces still to weigh on an order: every piece weighSource() says goes
  // over the bench, less the Cuts rows already saved against its line.
  function piecesToWeigh(order) {
    return data.lines.filter(l => l['ORDER ID'] === order.ID).reduce((n, l) => {
      const src = weighSource(l, data.productByCode);
      if (!src) return n;
      return n + Math.max(0, linePieces(l, src).count - (data.cutsOfLine[l.ID] || []).length);
    }, 0);
  }

  // One delivery date's orders and what's left to do on them.
  function runOf(date) {
    const orders = data.orders.filter(o => o['DELIVERY DATE'] === date);
    const counts = Object.fromEntries(STAGES.map(([s]) => [s, 0]));
    orders.forEach(o => { counts[statusOf(o)] = (counts[statusOf(o)] || 0) + 1; });
    const open = orders.filter(o => statusOf(o) !== 'Dispatched');
    const weigh = open.map(o => ({ o, n: piecesToWeigh(o) }));
    const toWeigh = weigh.reduce((s, x) => s + x.n, 0);
    const weighing = weigh.filter(x => x.n > 0).map(x => x.o.ID);
    const zones = [...new Set(orders.map(zoneOf).filter(Boolean))].sort((a, b) => (a === 'London' ? -1 : 1));
    return {
      date, orders, counts, zones,
      allocate: open.filter(o => statusOf(o) === 'New' || packLines(o).some(l => l.short)),
      pick: open.filter(o => statusOf(o) === 'Allocated'),
      toWeigh, weighOrders: weighing.length,
      pack: open.filter(o => ['Picked', 'Cut'].includes(statusOf(o)) && !weighing.includes(o.ID)),
      dispatch: open.filter(o => statusOf(o) === 'Packed'),
      invoiceable: orders.filter(o => !/\bTEST\b/.test(o.NOTES || '') && piecesToWeigh(o) === 0).length,
      billable: orders.filter(o => !/\bTEST\b/.test(o.NOTES || '')).length
    };
  }

  // Today's run if today has open orders, else the next date that does; then
  // the delivery date after it. Earlier days still not dispatched are an alert.
  function pickRuns() {
    const today = todayIso();
    const dates = [...new Set(data.orders.map(o => o['DELIVERY DATE']).filter(Boolean))].sort();
    const hasOpen = d => data.orders.some(o => o['DELIVERY DATE'] === d && statusOf(o) !== 'Dispatched');
    const first = hasOpen(today) ? today : dates.find(d => d > today && hasOpen(d)) || (dates.includes(today) ? today : null);
    const second = first ? dates.find(d => d > first) : null;
    return { first, second };
  }

  function runTitle(run) {
    const zones = run.zones.length ? run.zones.join(' + ') : 'Delivery';
    return `${escapeHtml(zones)} · ${escapeHtml(dayName(run.date))}`;
  }

  function stageBar(run, big) {
    const total = run.orders.length || 1;
    const parts = STAGES.filter(([s]) => run.counts[s]);
    const label = parts.map(([s]) => `${run.counts[s]} ${s.toLowerCase()}`).join(', ');
    return `
      <div class="run-bar${big ? '' : ' sm'}" role="img" aria-label="${escapeHtml(label)}">
        ${parts.map(([s, c]) => `<span style="flex:${run.counts[s] / total}; background:${c}" title="${s}: ${run.counts[s]}"></span>`).join('')}
      </div>
      <div class="run-legend">${STAGES.filter(([s]) => run.counts[s] || (big && ['Allocated', 'Packed', 'Dispatched'].includes(s))).map(([s, c]) =>
        `<span><i style="background:${c}"></i><b>${run.counts[s]}</b> ${s}</span>`).join('')}</div>`;
  }

  function stepRow(n, { title, sub, count, href, action, primary, later }) {
    const done = !count && !later;
    return `
      <div class="step${done ? ' done' : ''}${later ? ' later' : ''}">
        <span class="step-n">${done ? ICON_TICK : n}</span>
        <div class="step-b"><div class="step-t">${title}</div><div class="step-s">${done ? 'Nothing waiting' : sub}</div></div>
        <a class="btn sm${primary && !done ? '' : ' ghost'}" href="${href}">${action}</a>
      </div>`;
  }

  function renderRunToday(run) {
    const box = document.getElementById('runToday');
    if (!run) {
      box.innerHTML = `
        <div class="run-h"><div><div class="kicker">Next run</div><h3 id="runTodayH" class="run-title">No deliveries booked</h3></div></div>
        <div class="empty-block">
          <div class="empty-title">Nothing to send out yet</div>
          <div class="empty-sub">Orders you place show up here, step by step, for the day they're delivered.</div>
          <a href="orders.html?new=1" class="btn sm">+ New order</a>
        </div>`;
      return;
    }
    const d = run.date;
    const q = `?day=${d}`;
    // The first step with something waiting is the one to do now.
    const steps = [
      run.allocate.length ? { title: 'Allocate stock', sub: `${plural(run.allocate.length, 'order')} not fully covered`, count: run.allocate.length, href: `orders.html${q}`, action: 'Open orders' } : null,
      { title: 'Pick', sub: `${plural(run.pick.length, 'order')} allocated, ready to pick`, count: run.pick.length, href: `picking.html${q}`, action: 'Picking list' },
      { title: 'Weigh cuts', sub: `${plural(run.toWeigh, 'piece')} across ${plural(run.weighOrders, 'order')}`, count: run.toWeigh, href: 'cutting.html', action: 'Weigh cuts' },
      { title: 'Pack', sub: `${plural(run.pack.length, 'order')} picked and weighed`, count: run.pack.length, href: `lists.html${q}`, action: 'Packing slips' },
      { title: 'Load and dispatch', sub: `${plural(run.dispatch.length, 'order')} packed`, count: run.dispatch.length, href: `day-sheet.html${q}`, action: 'Day sheet' },
      { title: 'Invoice in Xero', sub: `${run.invoiceable} of ${run.billable} ready · every piece must be weighed first`, count: run.invoiceable, href: `lists.html${q}`, action: 'Export to Xero', later: !run.invoiceable && run.billable > 0 }
    ].filter(Boolean);
    const now = steps.findIndex(s => s.count);
    if (now >= 0) steps[now].primary = true;
    const n = daysUntil(d);
    box.innerHTML = `
      <div class="run-h">
        <div><div class="kicker">${n === 0 ? "Today's run" : 'Next run · ' + escapeHtml(whenLabel(d))}</div><h3 id="runTodayH" class="run-title">${runTitle(run)}</h3></div>
        <a class="run-link" href="orders.html${q}">${plural(run.orders.length, 'order')} · open pipeline</a>
      </div>
      ${stageBar(run, true)}
      <div class="steps">${steps.map((s, i) => stepRow(i + 1, s)).join('')}</div>`;
  }

  function renderRunNext(run) {
    const box = document.getElementById('runNext');
    box.hidden = !run;
    if (!run) return;
    const q = `?day=${run.date}`;
    const pieces = run.orders.filter(o => statusOf(o) !== 'Dispatched').reduce((s, o) => s + piecesToWeigh(o), 0);
    box.innerHTML = `
      <div class="run-h">
        <div><div class="kicker">After that · ${escapeHtml(whenLabel(run.date))}</div><h3 id="runNextH" class="run-title sm">${runTitle(run)}</h3></div>
        <a class="run-link" href="orders.html${q}">${plural(run.orders.length, 'order')}</a>
      </div>
      ${stageBar(run, false)}
      <div class="todo-list">
        ${run.allocate.length ? `<a class="todo warn" href="orders.html${q}"><span>${plural(run.allocate.length, 'order')} not fully allocated</span><span>Allocate →</span></a>` : ''}
        ${pieces ? `<a class="todo" href="cutting-list.html${q}"><span>Cutting list · ${plural(pieces, 'piece')}</span><span>Print →</span></a>` : ''}
        ${!run.allocate.length && !pieces ? '<p class="muted" style="margin:0;">All allocated, nothing to cut.</p>' : ''}
      </div>`;
  }

  // Open purchase orders that are late, due today or due in the next week.
  function goodsIn() {
    const today = todayIso();
    const dueBy = po => po['EXPECTED END DATE'] || po['EXPECTED START DATE'] || '';
    const open = data.purchaseOrders.filter(po => po.STATUS === 'Ordered' || !po.STATUS);
    const late = open.filter(po => dueBy(po) && dueBy(po) < today).sort((a, b) => dueBy(a).localeCompare(dueBy(b)));
    const dueToday = open.filter(po => !late.includes(po) && po['EXPECTED START DATE'] && po['EXPECTED START DATE'] <= today);
    const soon = open.filter(po => !late.includes(po) && !dueToday.includes(po) && po['EXPECTED START DATE'] && daysUntil(po['EXPECTED START DATE']) <= 7)
      .sort((a, b) => a['EXPECTED START DATE'].localeCompare(b['EXPECTED START DATE']));
    return { late, dueToday, soon, later: open.length - late.length - dueToday.length - soon.length };
  }

  function renderGoodsIn(gi) {
    const lineCount = id => data.poLines.filter(l => l['PO ID'] === id).length;
    const row = (po, kind) => {
      const due = po['EXPECTED END DATE'] || po['EXPECTED START DATE'];
      const label = kind === 'late' ? `Late ${plural(Math.max(1, -daysUntil(due)), 'day')}` : kind === 'today' ? 'Due today' : `Due ${dayName(po['EXPECTED START DATE'])}`;
      return `
        <div class="gi-row">
          <a class="gi-main" href="purchase-orders.html?open=${encodeURIComponent(po.ID)}" data-po-id="${escapeHtml(po.ID)}">
            <span class="code">${escapeHtml(po.ID)}</span>
            <span class="gi-sup">${escapeHtml(po.SUPPLIER)}<small class="${kind === 'late' ? 'late' : ''}">${escapeHtml(label)} · ${plural(lineCount(po.ID), 'line')}</small></span>
          </a>
          ${kind !== 'soon' ? `<a class="btn sm${kind === 'today' ? '' : ' ghost'}" href="receiving.html">Receive</a>` : ''}
        </div>`;
    };
    const rows = [...gi.late.map(po => row(po, 'late')), ...gi.dueToday.map(po => row(po, 'today')), ...gi.soon.map(po => row(po, 'soon'))];
    document.getElementById('goodsInList').innerHTML = rows.length
      ? rows.join('') + (gi.later ? `<div class="muted gi-more">${plural(gi.later, 'more purchase order')} due later.</div>` : '')
      : `<p class="muted" style="margin:4px 0 0;">Nothing due in the next week.${gi.later ? ` ${plural(gi.later, 'purchase order')} due later.` : ''}</p>`;
  }

  // Short-dated lots and products under their reorder threshold, from stock
  // on hand (Deliveries minus Allocations, as on the Stock page).
  function stockAlerts() {
    const lots = {};
    data.deliveries.forEach(d => {
      const k = `${d['PRODUCT CODE']} ${d['BATCH/LOT NUMBER']}`;
      if (!lots[k]) lots[k] = { code: d['PRODUCT CODE'], bbe: d['BEST BEFORE DATE'], left: 0 };
      lots[k].left += parseFloat(d['QTY RECEIVED']) || 0;
      if (d['BEST BEFORE DATE'] && (!lots[k].bbe || d['BEST BEFORE DATE'] < lots[k].bbe)) lots[k].bbe = d['BEST BEFORE DATE'];
    });
    data.allocs.forEach(a => {
      const k = `${a['PRODUCT CODE']} ${a['BATCH/LOT NUMBER']}`;
      if (lots[k] && !a['PO LINE ID']) lots[k].left -= parseFloat(a['QTY ALLOCATED']) || 0;
    });
    const inStock = Object.values(lots).filter(l => l.left > 0.0001);
    const onHand = {};
    inStock.forEach(l => { onHand[l.code] = (onHand[l.code] || 0) + l.left; });
    return {
      shortDated: inStock.filter(l => l.bbe && daysUntil(l.bbe) <= ALERT_SHORT_DAYS).length,
      low: data.products.filter(p => {
        const t = parseFloat(p['Reorder threshold']);
        return t > 0 && (onHand[p['Product code']] || 0) < t;
      }).length
    };
  }

  function renderAlerts(gi, stock, overdue, short) {
    const chip = (n, text, href, kind) => n ? `<a class="alert-chip ${kind}" href="${href}"><i></i>${escapeHtml(text)}</a>` : '';
    const html = [
      chip(overdue, `${plural(overdue, 'order')} from earlier days not dispatched`, 'orders.html', 'crit'),
      chip(gi.late.length, `${plural(gi.late.length, 'PO')} late`, 'purchase-orders.html', 'crit'),
      chip(short, `${plural(short, 'order')} short of stock`, 'orders.html', 'crit'),
      chip(stock.shortDated, `${plural(stock.shortDated, 'lot')} short-dated`, 'stock.html', 'yell'),
      chip(stock.low, `${plural(stock.low, 'product')} low`, 'stock.html', 'plain')
    ].join('');
    document.getElementById('alerts').innerHTML = html || '<span class="alert-chip ok"><i></i>No stock alerts</span>';
  }

  function renderPhoneTasks(run, gi) {
    const tile = (href, title, sub, n, icon, big) => `
      <a class="task${big ? ' big' : ''}" href="${href}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>
        <span class="task-b"><span class="task-t">${title}</span><span class="task-s">${sub}</span></span>
        ${n ? `<span class="task-n">${n}</span>` : ''}
      </a>`;
    const q = run ? `?day=${run.date}` : '';
    const inCount = gi.late.length + gi.dueToday.length;
    document.getElementById('phoneTasks').innerHTML = `
      ${run ? `<div class="task-run"><span>${escapeHtml(whenLabel(run.date))}</span><strong>${runTitle(run)} · ${plural(run.orders.length, 'order')}</strong></div>` : ''}
      ${tile('cutting.html', 'Weigh cuts', run && run.toWeigh ? `${plural(run.toWeigh, 'piece')} · ${plural(run.weighOrders, 'order')}` : 'Nothing to weigh', run ? run.toWeigh : 0, '<path d="M5 20h14"/><path d="M12 4v4"/><path d="M6 8h12l-2 8H8z"/>', true)}
      ${tile('receiving.html', 'Goods in', inCount ? `${plural(inCount, 'delivery', 'deliveries')} due` : 'None due', inCount, '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>')}
      ${tile(`picking.html${q}`, 'Pick', run && run.pick.length ? `${plural(run.pick.length, 'order')} ready` : 'Nothing to pick', run ? run.pick.length : 0, '<path d="M9 5h9M9 12h9M9 19h9"/><path d="M4.5 5l1 1 2-2M4.5 12l1 1 2-2M4.5 19l1 1 2-2"/>')}
      ${tile(`lists.html${q}`, 'Pack', run && run.pack.length ? `${plural(run.pack.length, 'order')} ready` : 'Nothing to pack', run ? run.pack.length : 0, '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>')}
      ${tile('stock-take.html', 'Stock take', 'Count the shelves', 0, '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/><path d="M8.5 12.5l2 2 4-4.5"/>')}
      <button type="button" class="task-office" id="officeViewBtn">Show the full office view</button>`;
  }

  async function loadDashboard() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const card = document.getElementById('dashCard');
    const now = new Date();
    document.getElementById('todayKicker').textContent =
      `${now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })} · Week ${isoWeek(now)}`;
    if (!token || !cfg.spreadsheetId) { card.hidden = true; return; }
    card.hidden = false;
    setStatus('');
    try {
      data = await loadListsData(cfg.spreadsheetId, token);
      const { first, second } = pickRuns();
      const run = first ? runOf(first) : null;
      const gi = goodsIn();
      const today = todayIso();
      const undispatched = data.orders.filter(o => statusOf(o) !== 'Dispatched');
      const overdue = undispatched.filter(o => o['DELIVERY DATE'] && o['DELIVERY DATE'] < today).length;
      const short = undispatched.filter(o => packLines(o).some(l => l.short)).length;
      renderAlerts(gi, stockAlerts(), overdue, short);
      renderRunToday(run);
      renderRunNext(second ? runOf(second) : null);
      renderGoodsIn(gi);
      renderPhoneTasks(run, gi);
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  // Phones get the warehouse buttons; "Show the full office view" swaps to the
  // laptop layout and is remembered on that phone.
  const OFFICE_KEY = 'provisions_officeView';
  try { if (localStorage.getItem(OFFICE_KEY) === '1') document.body.classList.add('office-view'); } catch (e) {}
  document.getElementById('dashCard').addEventListener('click', e => {
    if (!e.target.closest('#officeViewBtn, #taskViewBtn')) return;
    const on = document.body.classList.toggle('office-view');
    try { localStorage.setItem(OFFICE_KEY, on ? '1' : '0'); } catch (err) {}
    window.scrollTo(0, 0);
  });

  attachOrderHoverCard(document.getElementById('goodsInList'), '[data-po-id]', el => {
    const o = data && data.purchaseOrders.find(p => p.ID === el.dataset.poId);
    if (!o) return null;
    return {
      title: o.SUPPLIER, id: o.ID, status: o.STATUS || 'Ordered',
      meta: [o.NOTES ? `Note: ${o.NOTES}` : ''],
      lines: data.poLines.filter(l => l['PO ID'] === o.ID).map(l => {
        const prod = data.productByCode[l['PRODUCT CODE']];
        return { product: prod, name: prod ? prod['Product name'] : l['PRODUCT CODE'], qty: qtyUnit(l['QTY ORDERED'], l.UNIT) };
      })
    };
  });

  window.addEventListener('load', () => {
    refreshSignedInUI();
    loadDashboard();
  });
  // An order or PO opened in place (js/shell.js) may have changed status,
  // lines or stock — re-read so the page matches.
  window.onRecordDialogClosed = loadDashboard;

  signInBtn.addEventListener('click', () => {
    tokenClient = initGoogleAuth({
      clientId: getStoredConfig().clientId,
      onToken: () => {
        // Signed out from another page (or its session ran out)? Go back there.
        let next = '';
        try { next = sessionStorage.getItem(NEXT_PAGE_KEY) || ''; sessionStorage.removeItem(NEXT_PAGE_KEY); } catch (e) {}
        if (next && !/^index\.html/.test(next)) { location.replace(next); return; }
        setStatus('');
        refreshSignedInUI();
        refreshAccount();
        restartPageLoader();
        loadDashboard();
      },
      onError: (err) => setStatus(err, 'error')
    });
    tokenClient.requestAccessToken(signInRequest({ prompt: 'select_account' }));
  });
</script>
</body>
