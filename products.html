<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Products</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=31">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:32px; flex-wrap:wrap;">
    <div style="max-width:60ch;">
      <span class="kicker">Item master</span>
      <h2>Products</h2>
    </div>
    <div id="productsActions" style="display:none; gap:9px; flex:none; padding-top:8px;">
      <button type="button" class="btn ghost" id="bulkPhotosBtn" title="Select image files named after product codes (e.g. CCS050.jpg) — matched files upload to Drive and are set as that product's photo.">Bulk photos</button>
      <button type="button" class="btn" id="addProductBtn">+ Add product</button>
    </div>
  </div>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="productsMount"></div>
</main>

<dialog id="photosDialog">
  <div class="dlg-h">
    <div>
      <div class="ttl">Bulk upload photos</div>
    </div>
    <button type="button" class="dlg-close" id="photosCloseX" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-b">
    <div class="field">
      <label>Image files</label>
      <input type="file" id="photosFileInput" multiple accept="image/*">
    </div>
    <div id="photosPreview"></div>
    <div id="photosStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
  </div>
  <div class="dlg-f">
    <button type="button" class="btn ghost" id="photosCloseBtn">Close</button>
    <button type="button" class="btn" id="photosUploadBtn">Upload</button>
  </div>
</dialog>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=4"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=3"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/drive.js?v=3"></script>
<script src="js/searchable-select.js?v=2"></script>
<script src="js/stock-calc.js?v=2"></script>
<script src="js/crud-page.js?v=20"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('productsActions').style.display = ok ? 'flex' : 'none';
    return ok;
  }

  // ---- Catalogue-mode field logic — Products-specific, so it lives here
  // rather than in the generic js/crud-page.js.

  function packLabel(pick) {
    const wkg = pick('Nominal weight (kg)');
    const wTxt = wkg ? `${wkg}kg` : '';
    if (pick('Ordering unit') === 'Case' && pick('Units per case')) return `${pick('Units per case')} × ${wTxt}`;
    return wTxt ? `1 × ${wTxt}` : (pick('Ordering unit') || '');
  }

  function currency(v) {
    const n = parseFloat(v);
    return isNaN(n) ? '—' : `£${n.toFixed(2)}`;
  }

  // GP at list is a formula-driven text cell (e.g. "31.20%"), not a plain
  // number — parseFloat happily ignores the trailing '%'.
  function gpInfo(pick) {
    const n = parseFloat(pick('GP at list'));
    const has = !isNaN(n);
    return {
      value: has ? n : null,
      text: has ? `${n.toFixed(1)}%` : '—',
      color: !has ? 'var(--mist)' : n < 20 ? 'var(--crit)' : n < 28 ? 'var(--yell)' : 'var(--ok)'
    };
  }

  // Priority order matches how the design reads a row at a glance: a
  // missing Xero code blocks accounting sync, low/missing GP is a pricing
  // problem — only the first is shown on the row card, but all count
  // toward "Needs attention".
  function rowBadges(pick) {
    const list = [];
    if (!pick('Xero item code')) list.push({ text: 'No Xero code', tone: 'warn' });
    const g = gpInfo(pick);
    if (g.value !== null && g.value < 20) list.push({ text: 'GP low', tone: 'crit' });
    if (g.value === null) list.push({ text: 'GP missing', tone: 'yell' });
    return list;
  }

  // On-hand stock per product code (js/stock-calc.js), filled in once
  // Deliveries + Allocations have loaded; null until then.
  let stockByCode = null;

  async function loadStock() {
    const cfg = getStoredConfig();
    const toObjects = ([head = [], ...rows]) => rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
    try {
      const [deliveries, allocations] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z'),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z')
      ]);
      stockByCode = computeStockByProduct(toObjects(deliveries), toObjects(allocations));
    } catch (err) {
      stockByCode = {};
      showToast(`Couldn't load stock levels: ${err.message}`, 'error');
    }
  }

  // ok / low (under the product's Reorder threshold) / out, or null while loading.
  function stockLevel(pick) {
    if (!stockByCode) return null;
    const s = stockByCode[pick('Product code')];
    const onHand = s ? s.onHand : 0;
    const threshold = parseFloat(pick('Reorder threshold'));
    const unit = s ? s.unit : (pick('Pricing basis') === 'Per kg' ? 'kg' : 'pc');
    const state = onHand <= 0.0001 ? 'out' : (!isNaN(threshold) && onHand < threshold ? 'low' : 'ok');
    return { onHand, unit, state };
  }

  function stockFigure(pick) {
    const lvl = stockLevel(pick);
    if (!lvl) return null;
    if (lvl.state === 'out') return { n: 'Out', u: '', l: 'of stock', tone: 'crit' };
    const n = lvl.unit === 'kg' ? lvl.onHand.toFixed(1).replace(/\.0$/, '') : String(Math.round(lvl.onHand));
    return { n, u: lvl.unit === 'kg' ? 'kg' : 'pcs', l: lvl.state === 'low' ? 'low stock' : 'in stock', tone: lvl.state === 'low' ? 'warn' : 'ok' };
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    const products = initCrudTable({
      mount: '#productsMount',
      title: 'Products',
      tab: 'Products',
      headers: ['Product code','Product name','Category','Default supplier','Producer','Storage','Ordering unit','Units per case','Pricing basis','Nominal weight (kg)','Cost price £','Landed cost £','GP at list','Tolerance band (%)','Cut from (code)','Cut shelf life (days)','Part-cut shelf life (days)','Target pack weight (kg)','Xero item code','Xero account code','VAT rate','Active','Sellable','Notes','Photo URL','Reorder threshold','Tech sheet URL','Training notes','Cheese ID'],
      autoId: null,
      fields: [
        { key: 'Product code', label: 'Product code', type: 'text', required: true, placeholder: 'e.g. CCS050' },
        { key: 'Product name', label: 'Product name', type: 'text', required: true, placeholder: 'e.g. Brie Dongé 3kg', primary: true },
        { key: 'Category', label: 'Category', type: 'select', options: ['Biscuits','Charcuterie','Cheese','Condiment','Deli & Snacks','Jam','Non-Food','Oil','Pasta','Preserved Veg','Pâté & Terrine','Ready Meals','Tinned Fish','Vinegar'] },
        { key: 'Default supplier', label: 'Default supplier', type: 'ref', refTab: 'Suppliers', refValue: 'Supplier name' },
        { key: 'Producer', label: 'Producer', type: 'text' },
        { key: 'Storage', label: 'Storage', type: 'select', options: ['Ambient', 'Chilled'] },
        { key: 'Ordering unit', label: 'Ordering unit', type: 'select', options: ['Case', 'Unit'] },
        { key: 'Units per case', label: 'Units per case', type: 'number' },
        { key: 'Pricing basis', label: 'Pricing basis', type: 'select', options: ['Per kg', 'Per unit'] },
        { key: 'Nominal weight (kg)', label: 'Nominal weight (kg)', type: 'number' },
        { key: 'Cost price £', label: 'Cost price (£)', type: 'number', format: 'currency' },
        { key: 'Landed cost £', label: 'Landed cost (£)', type: 'number', format: 'currency' },
        { key: 'GP at list', label: 'GP at list', type: 'text', placeholder: 'e.g. 31.20% — usually a formula, edit with care' },
        { key: 'Tolerance band (%)', label: 'Tolerance band (%)', type: 'number' },
        { key: 'Cut from (code)', label: 'Cut from (code)', type: 'text', placeholder: 'Whole product this is cut from, if any' },
        { key: 'Cut shelf life (days)', label: 'Cut shelf life (days)', type: 'number' },
        { key: 'Part-cut shelf life (days)', label: 'Part-cut shelf life (days)', type: 'number' },
        { key: 'Target pack weight (kg)', label: 'Target pack weight (kg)', type: 'number' },
        { key: 'Xero item code', label: 'Xero item code', type: 'text' },
        { key: 'Xero account code', label: 'Xero account code', type: 'text' },
        { key: 'VAT rate', label: 'VAT rate', type: 'select', options: ['20% (VAT on income)', 'Zero rated income'] },
        { key: 'Active', label: 'Active', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' },
        { key: 'Sellable', label: 'Sellable', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' },
        { key: 'Notes', label: 'Notes', type: 'textarea' },
        { key: 'Photo URL', label: 'Photo', type: 'image', placeholder: 'https://... — usually set via Bulk upload photos' },
        { key: 'Reorder threshold', label: 'Reorder threshold', type: 'number', placeholder: 'On-hand qty below this is flagged as low stock' },
        {
          key: 'Tech sheet URL', label: 'Tech sheet', type: 'file', section: 'Docs & training',
          placeholder: 'https://... — paste a link, or upload a file below',
          onUpload: async (file, getField) => {
            const cfg = getStoredConfig();
            const token = tryResumeSession();
            if (!token || !cfg.spreadsheetId) throw new Error('Sign in on the Dashboard first.');
            const code = getField('Product code');
            if (!code) throw new Error('Enter a product code first.');
            const folderId = await driveEnsureDocsFolder(token);
            return driveUploadProductDoc(folderId, code, file, token);
          }
        },
        {
          key: 'Training notes', label: 'Training sheet', type: 'textarea', section: 'Docs & training',
          placeholder: 'Everything staff should know handling this product — cutting, storage, allergens, talking points...'
        },
        { key: 'Cheese ID', label: 'Cheese', type: 'text', placeholder: 'e.g. CHZ012 — set from the Cheeses page' }
      ],
      // So a portion with no photo can show the whole it's cut from.
      onLoad: (rows, get) => registerProducts(rows.map(r => ({
        'Product code': get(r.values, 'Product code'), 'Photo URL': get(r.values, 'Photo URL'), 'Cheese ID': get(r.values, 'Cheese ID')
      }))),
      inlineEdit: true,
      catalogue: {
        layout: 'cards',
        stock: stockFigure,
        tabsBy: 'Category',
        groupBy: 'Category',
        // The cheese's photo when it has one (one upload covers all its SKUs).
        photo: (pick) => productPhoto({ 'Photo URL': pick('Photo URL'), 'Cheese ID': pick('Cheese ID'), 'Cut from (code)': pick('Cut from (code)') }),
        name: 'Product name',
        tag: (pick) => ({ text: pick('Storage'), on: pick('Storage') === 'Chilled' }),
        sub: (pick) => [pick('Producer'), pick('Default supplier')].filter(Boolean).join(' · '),
        meta: (pick) => [pick('Product code'), packLabel(pick)],
        prices: [
          { label: 'Cost', get: (pick) => currency(pick('Cost price £')) },
          { label: 'Landed', get: (pick) => currency(pick('Landed cost £')), big: true }
        ],
        gpLabel: 'GP',
        gp: (pick) => { const g = gpInfo(pick); return { text: g.text, color: g.color }; },
        badges: rowBadges,
        stats: (rows, get) => {
          const pick = (r) => (key) => get(r.values, key);
          const active = rows.filter(r => (pick(r)('Active') || '').toUpperCase() === 'YES').length;
          const gps = rows.map(r => gpInfo(pick(r)).value).filter(v => v !== null);
          const avgGp = gps.length ? gps.reduce((a, b) => a + b, 0) / gps.length : null;
          const needsAttn = rows.filter(r => rowBadges(pick(r)).length > 0).length;
          const cats = new Set(rows.map(r => pick(r)('Category')).filter(Boolean));
          const isShort = (pick) => ['low', 'out'].includes(stockLevel(pick)?.state);
          const short = stockByCode ? rows.filter(r => isShort(pick(r))).length : null;
          return [
            { l: 'Active', n: String(active), u: `of ${rows.length}` },
            { l: 'Low or out of stock', n: short === null ? '…' : String(short), u: 'products', tone: short ? 'crit' : undefined, key: 'short', filter: isShort },
            { l: 'Average GP', n: avgGp === null ? '—' : `${avgGp.toFixed(1)}%`, u: 'at list' },
            { l: 'Needs attention', n: String(needsAttn), u: 'records', tone: needsAttn > 0 ? 'warn' : undefined, key: 'attention', filter: (pick) => rowBadges(pick).length > 0 },
            { l: 'Categories', n: String(cats.size), u: 'in use' }
          ];
        },
        kicker: (pick) => [pick('Category'), pick('Product code')].filter(Boolean).join(' · '),
        detailSub: (pick) => {
          const producer = pick('Producer'), supplier = pick('Default supplier');
          return producer && supplier ? `${producer} · via ${supplier}` : (producer || supplier || '');
        },
        emptyTitle: 'Nothing in the catalogue yet',
        emptySub: 'Add your first product, or use Bulk photos once your SKUs are in.'
      }
    });

    loadStock().then(() => products.then(p => p.rerender()));
    loadCheeses(getStoredConfig().spreadsheetId).then(cheeses => { registerCheeses(cheeses); products.then(p => p.rerender()); });

    document.getElementById('addProductBtn').addEventListener('click', () => products.then(p => p.openAdd()));

    initBulkPhotosUpload(products);
  });

  // Bulk photo upload: match each selected file's name (minus extension) to
  // a Products.Product code, upload matched files to the app's Drive photos
  // folder (js/drive.js), and write the resulting URL into that row's
  // Photo URL cell directly via the Sheets API — this bypasses the crud-page
  // add/edit dialog entirely since it's writing many rows at once.
  function initBulkPhotosUpload(productsTable) {
    const dialog = document.getElementById('photosDialog');
    const fileInput = document.getElementById('photosFileInput');
    const preview = document.getElementById('photosPreview');
    const statusEl = document.getElementById('photosStatus');
    const openBtn = document.getElementById('bulkPhotosBtn');
    const closeBtn = document.getElementById('photosCloseBtn');
    const closeX = document.getElementById('photosCloseX');
    const uploadBtn = document.getElementById('photosUploadBtn');
    let selectedFiles = [];

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
    }

    function baseName(filename) {
      return filename.replace(/\.[^.]+$/, '').trim();
    }

    function renderPreview(codesUC) {
      if (!selectedFiles.length) { preview.innerHTML = ''; return; }
      preview.innerHTML = `<table style="width:100%; font-size:12.5px;"><tbody>` + selectedFiles.map(f => {
        const code = baseName(f.name);
        const matched = codesUC.has(code.toUpperCase());
        return `<tr><td>${escapeHtml(f.name)}</td><td class="mono">${escapeHtml(code)}</td><td>${matched ? '<span class="tag t-ok">Match</span>' : '<span class="tag t-crit">No match</span>'}</td></tr>`;
      }).join('') + `</tbody></table>`;
    }

    openBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      preview.innerHTML = '';
      setStatus('');
      dialog.showModal();
    });
    closeBtn.addEventListener('click', () => dialog.close());
    closeX.addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

    fileInput.addEventListener('change', async () => {
      selectedFiles = [...fileInput.files];
      if (!selectedFiles.length) { preview.innerHTML = ''; setStatus(''); return; }
      setStatus('Checking product codes...');
      try {
        const cfg = getStoredConfig();
        const token = tryResumeSession();
        if (!token || !cfg.spreadsheetId) throw new Error('Sign in on the Dashboard first.');
        const rows = await sheetsGet(cfg.spreadsheetId, 'Products!A:A', token);
        const codesUC = new Set(rows.slice(1).map(r => (r[0] || '').toString().trim().toUpperCase()).filter(Boolean));
        renderPreview(codesUC);
        const matchedCount = selectedFiles.filter(f => codesUC.has(baseName(f.name).toUpperCase())).length;
        setStatus(`${matchedCount} of ${selectedFiles.length} file(s) match a product code.`);
      } catch (err) {
        setStatus('Error checking product codes: ' + err.message, 'error');
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFiles.length) { setStatus('Choose image files first.', 'error'); return; }
      const cfg = getStoredConfig();
      const token = tryResumeSession();
      if (!token || !cfg.spreadsheetId) { setStatus('Sign in on the Dashboard first.', 'error'); return; }

      uploadBtn.disabled = true;
      try {
        setStatus('Reading Products sheet...');
        const rows = await sheetsGet(cfg.spreadsheetId, 'Products!A:Z', token);
        const header = rows[0] || [];
        const codeIdx = header.indexOf('Product code');
        const photoIdx = header.indexOf('Photo URL');
        if (codeIdx === -1 || photoIdx === -1) throw new Error('Run Setup first — Products is missing the Photo URL column.');
        const photoCol = colLetter(photoIdx + 1);

        const codeToRow = new Map();      // exact Product code -> sheet row number
        const codeToRowUC = new Map();    // uppercased fallback, for forgiving filename matches
        rows.slice(1).forEach((r, i) => {
          const code = (r[codeIdx] || '').toString().trim();
          if (!code) return;
          const rowNumber = i + 2;
          codeToRow.set(code, rowNumber);
          codeToRowUC.set(code.toUpperCase(), rowNumber);
        });

        setStatus('Preparing Drive folder...');
        const folderId = await driveEnsureFolder(token);

        let uploaded = 0;
        const unmatched = [];
        const failed = [];
        for (const file of selectedFiles) {
          const rawCode = baseName(file.name);
          const rowNumber = codeToRow.get(rawCode) ?? codeToRowUC.get(rawCode.toUpperCase());
          if (!rowNumber) { unmatched.push(file.name); continue; }
          setStatus(`Uploading ${file.name} (${uploaded + unmatched.length + failed.length + 1}/${selectedFiles.length})...`);
          try {
            const url = await driveUploadProductPhoto(folderId, rawCode, file, token);
            await sheetsUpdateRange(cfg.spreadsheetId, `Products!${photoCol}${rowNumber}:${photoCol}${rowNumber}`, [[url]], token, 'USER_ENTERED');
            uploaded++;
          } catch (err) {
            failed.push(`${file.name}: ${err.message}`);
          }
        }

        let summary = `Uploaded ${uploaded} of ${selectedFiles.length}.`;
        if (unmatched.length) summary += ` No matching product code for: ${unmatched.join(', ')}.`;
        if (failed.length) summary += ` Failed: ${failed.join('; ')}.`;
        setStatus(summary, (failed.length || unmatched.length) ? 'error' : 'ok');

        productsTable.then(p => p.reload());
      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
