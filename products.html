<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Products</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=39">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:32px; flex-wrap:wrap;">
    <div style="max-width:60ch;">
      <span class="kicker">Item master</span>
      <h2>Products</h2>
    </div>
    <div id="productsActions" style="display:none; gap:9px; flex:none; padding-top:8px; flex-wrap:wrap; align-items:center;">
      <div class="seg" role="tablist" aria-label="View">
        <button type="button" class="seg-btn" data-view="products" role="tab">Products</button>
        <button type="button" class="seg-btn" data-view="skus" role="tab">SKUs</button>
      </div>
      <button type="button" class="btn ghost" id="groupBtn" data-for="products" title="Put every SKU that isn't in a product yet into one — previewed before anything is written.">Group SKUs into products</button>
      <button type="button" class="btn ghost" id="bulkPhotosBtn" data-for="skus" title="Select image files named after SKU codes (e.g. CCS050.jpg) — matched files upload to Drive and are set as that SKU's photo.">Bulk photos</button>
      <button type="button" class="btn" id="addProductBtn" data-for="products">+ Add product</button>
      <button type="button" class="btn" id="addSkuBtn" data-for="skus">+ Add SKU</button>
    </div>
  </div>

  <div id="ungroupedNote"></div>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="groupsMount" data-for="products"></div>
  <div id="productsMount" data-for="skus"></div>
</main>

<dialog id="photosDialog">
  <div class="dlg-h">
    <div>
      <div class="ttl">Bulk upload photos</div>
    </div>
    <button type="button" class="dlg-close" id="photosCloseX" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-b">
    <div class="field">
      <label>Image files</label>
      <input type="file" id="photosFileInput" multiple accept="image/*">
    </div>
    <div id="photosPreview"></div>
    <div id="photosStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
  </div>
  <div class="dlg-f">
    <button type="button" class="btn ghost" id="photosCloseBtn">Close</button>
    <button type="button" class="btn" id="photosUploadBtn">Upload</button>
  </div>
</dialog>

<dialog id="groupDialog">
  <div class="dlg-h">
    <div><div class="ttl">Group SKUs into products</div></div>
    <button type="button" class="dlg-close" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-b" id="groupBody"></div>
  <div class="dlg-f">
    <button type="button" class="btn ghost" data-close>Cancel</button>
    <button type="button" class="btn" id="groupApplyBtn" disabled>Create</button>
  </div>
</dialog>

<script src="js/config.js?v=5"></script>
<script src="js/sheets.js?v=6"></script>
<script src="js/shell.js?v=7"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/drive.js?v=3"></script>
<script src="js/searchable-select.js?v=2"></script>
<script src="js/stock-calc.js?v=3"></script>
<script src="js/crud-page.js?v=21"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('productsActions').style.display = ok ? 'flex' : 'none';
    return ok;
  }

  // ---- Catalogue-mode field logic — Products-specific, so it lives here
  // rather than in the generic js/crud-page.js.

  function packLabel(pick) {
    const wkg = pick('Nominal weight (kg)');
    const wTxt = wkg ? `${wkg}kg` : '';
    if (pick('Ordering unit') === 'Case' && pick('Units per case')) return `${pick('Units per case')} × ${wTxt}`;
    return wTxt ? `1 × ${wTxt}` : (pick('Ordering unit') || '');
  }

  function currency(v) {
    const n = parseFloat(v);
    return isNaN(n) ? '—' : `£${n.toFixed(2)}`;
  }

  // GP at list is a formula-driven text cell (e.g. "31.20%"), not a plain
  // number — parseFloat happily ignores the trailing '%'.
  function gpInfo(pick) {
    const n = parseFloat(pick('GP at list'));
    const has = !isNaN(n);
    return {
      value: has ? n : null,
      text: has ? `${n.toFixed(1)}%` : '—',
      color: !has ? 'var(--mist)' : n < 20 ? 'var(--crit)' : n < 28 ? 'var(--yell)' : 'var(--ok)'
    };
  }

  // Priority order matches how the design reads a row at a glance: a
  // missing Xero code blocks accounting sync, low/missing GP is a pricing
  // problem — only the first is shown on the row card, but all count
  // toward "Needs attention".
  function rowBadges(pick) {
    const list = [];
    if (!pick('Xero item code')) list.push({ text: 'No Xero code', tone: 'warn' });
    const g = gpInfo(pick);
    if (g.value !== null && g.value < 20) list.push({ text: 'GP low', tone: 'crit' });
    if (g.value === null) list.push({ text: 'GP missing', tone: 'yell' });
    return list;
  }

  // On-hand stock per product code (js/stock-calc.js), filled in once
  // Deliveries + Allocations have loaded; null until then.
  let stockByCode = null;

  async function loadStock() {
    const cfg = getStoredConfig();
    const toObjects = ([head = [], ...rows]) => rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
    try {
      const [deliveries, allocations] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z'),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z')
      ]);
      stockByCode = computeStockByProduct(toObjects(deliveries), toObjects(allocations));
    } catch (err) {
      stockByCode = {};
      showToast(`Couldn't load stock levels: ${err.message}`, 'error');
    }
  }

  // ok / low (under the product's Reorder threshold) / out, or null while loading.
  function stockLevel(pick) {
    if (!stockByCode) return null;
    const s = stockByCode[pick('Product code')];
    const onHand = s ? s.onHand : 0;
    const threshold = parseFloat(pick('Reorder threshold'));
    const unit = s ? s.unit : (pick('Pricing basis') === 'Per kg' ? 'kg' : 'pc');
    const state = onHand <= 0.0001 ? 'out' : (!isNaN(threshold) && onHand < threshold ? 'low' : 'ok');
    return { onHand, unit, state };
  }

  function stockFigure(pick) {
    const lvl = stockLevel(pick);
    if (!lvl) return null;
    if (lvl.state === 'out') return { n: 'Out', u: '', l: 'of stock', tone: 'crit' };
    const n = lvl.unit === 'kg' ? lvl.onHand.toFixed(1).replace(/\.0$/, '') : String(Math.round(lvl.onHand));
    return { n, u: lvl.unit === 'kg' ? 'kg' : 'pcs', l: lvl.state === 'low' ? 'low stock' : 'in stock', tone: lvl.state === 'low' ? 'warn' : 'ok' };
  }

  // ---- Products view: one card per product (the ProductGroups tab) ----
  //
  // A product owns the photo, spec sheet and training notes; its SKUs are
  // Products rows whose Group ID points at it. Each is a Wholesale SKU
  // (e.g. a whole wheel plus its portions), except the codes in the
  // product's Shop SKU / Selfridges SKU fields, which fill those two
  // channels — one SKU each, either may be empty.

  const GROUP_HEADERS = ['ID','Product name','Shop SKU','Selfridges SKU','Nominal wheel weight (kg)','Photo URL','Tech sheet URL','Training notes','Notes','Active','Category'];
  const CATEGORIES = ['Biscuits','Charcuterie','Cheese','Condiment','Deli & Snacks','Jam','Non-Food','Oil','Pasta','Preserved Veg','Pâté & Terrine','Ready Meals','Tinned Fish','Vinegar'];

  let skusTable = null, groupsTable = null, skuOpenEdit = null;
  // From the SKUs table's last load: every SKU as a header-keyed object
  // (plus rowNumber), grouped by Group ID; groupCol is Products."Group ID"'s
  // column letter, null until Setup has added it.
  let skuIndex = { all: [], byGroup: {}, byCode: {}, groupCol: null };
  let openGroupSkus = null; // re-renders an open product's SKUs tab after a change

  function indexSkus(rows, get) {
    const head = ['Product code','Product name','Category','Default supplier','Producer','Storage','Ordering unit','Units per case','Pricing basis','Nominal weight (kg)','Cost price £','Landed cost £','GP at list','Tolerance band (%)','Cut from (code)','Cut shelf life (days)','Part-cut shelf life (days)','Target pack weight (kg)','Xero item code','Xero account code','VAT rate','Active','Sellable','Notes','Photo URL','Reorder threshold','Tech sheet URL','Training notes','Group ID'];
    const all = rows.map(r => ({ rowNumber: r.rowNumber, ...Object.fromEntries(head.map(h => [h, (get(r.values, h) ?? '').toString()])) }))
      .filter(p => p['Product code']);
    const byGroup = {}, byCode = {};
    all.forEach(p => {
      byCode[p['Product code']] = p;
      if (p['Group ID']) (byGroup[p['Group ID']] = byGroup[p['Group ID']] || []).push(p);
    });
    skuIndex = { all, byGroup, byCode, groupCol: colLetter(head.indexOf('Group ID') + 1) };
    registerProducts(all);
    renderUngroupedNote();
    groupsTable?.then(g => g.rerender());
    openGroupSkus?.();
  }

  const groupSkus = pick => skuIndex.byGroup[pick('ID')] || [];
  // The SKU that speaks for the product on its card: the whole (not cut
  // from anything), heaviest first.
  function mainSku(pick) {
    const skus = groupSkus(pick).filter(p => p['Product code'] !== (pick('Shop SKU') || '').trim() && p['Product code'] !== (pick('Selfridges SKU') || '').trim());
    const list = skus.length ? skus : groupSkus(pick);
    return list.filter(p => !p['Cut from (code)']).sort((a, b) => (parseFloat(b['Nominal weight (kg)']) || 0) - (parseFloat(a['Nominal weight (kg)']) || 0))[0] || list[0] || null;
  }
  const skuPick = sku => key => (sku ? sku[key] : '') || '';

  function groupStock(pick) {
    const main = mainSku(pick);
    if (!main || !stockByCode) return main ? null : { n: '—', u: '', l: 'no SKUs', tone: 'muted' };
    return stockFigure(skuPick(main));
  }

  function groupBadges(pick) {
    const skus = groupSkus(pick);
    if (!skus.length) return [{ text: 'No SKUs', tone: 'warn' }];
    const list = [];
    if (skus.some(p => !p['Xero item code'])) list.push({ text: 'No Xero code', tone: 'warn' });
    return list;
  }

  function renderUngroupedNote() {
    const n = skuIndex.all.filter(p => !p['Group ID']).length;
    document.getElementById('ungroupedNote').innerHTML = n && readView() === 'products' ? `
      <div class="note info" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span><strong>${n} SKU(s) aren't in a product yet</strong> — they only show under SKUs.</span>
        <button type="button" class="btn ghost sm" onclick="openGrouping()">Group them</button>
      </div>` : '';
  }

  const fileSlug = s => 'product-' + searchNorm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  function initGroupsTable() {
    return initCrudTable({
      mount: '#groupsMount',
      title: 'Products',
      tab: 'ProductGroups',
      headers: GROUP_HEADERS,
      autoId: 'PG',
      fields: [
        { key: 'Product name', label: 'Product name', type: 'text', required: true, primary: true, placeholder: 'e.g. Comté Petite 10/14M' },
        { key: 'Shop SKU', label: 'Shop SKU', type: 'text', placeholder: 'SKU / Xero code used by the shops' },
        { key: 'Selfridges SKU', label: 'Selfridges SKU', type: 'text', placeholder: 'SKU / Xero code used for Selfridges' },
        { key: 'Nominal wheel weight (kg)', label: 'Nominal wheel weight (kg)', type: 'number', placeholder: 'Cheese cut from a wheel only' },
        {
          key: 'Photo URL', label: 'Photo', type: 'image', placeholder: 'https://... — or upload below',
          onUpload: async (file, getField) => {
            const name = getField('Product name');
            if (!name) throw new Error('Enter the product name first.');
            const folderId = await driveEnsureFolder(tryResumeSession());
            return driveUploadProductPhoto(folderId, fileSlug(name), file, tryResumeSession());
          }
        },
        {
          key: 'Tech sheet URL', label: 'Spec sheet', type: 'file', section: 'Docs & training',
          placeholder: 'https://... — paste a link, or upload a file below',
          onUpload: async (file, getField) => {
            const name = getField('Product name');
            if (!name) throw new Error('Enter the product name first.');
            const folderId = await driveEnsureDocsFolder(tryResumeSession());
            return driveUploadProductDoc(folderId, fileSlug(name), file, tryResumeSession());
          }
        },
        { key: 'Training notes', label: 'Training notes', type: 'textarea', section: 'Docs & training', placeholder: 'Cutting, storage, allergens, talking points…' },
        { key: 'Notes', label: 'Notes', type: 'textarea' },
        { key: 'Active', label: 'Active', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' },
        { key: 'Category', label: 'Category', type: 'select', options: CATEGORIES }
      ],
      catalogue: {
        layout: 'cards',
        stock: groupStock,
        tabsBy: 'Category',
        groupBy: 'Category',
        photo: (pick) => (pick('Photo URL') || '').trim() || productPhoto(mainSku(pick)),
        name: 'Product name',
        tag: (pick) => { const s = skuPick(mainSku(pick)); return { text: s('Storage'), on: s('Storage') === 'Chilled' }; },
        sub: (pick) => { const s = skuPick(mainSku(pick)), n = groupSkus(pick).length; return [s('Producer'), s('Default supplier'), n > 1 ? `${n} SKUs` : ''].filter(Boolean).join(' · '); },
        meta: (pick) => { const n = groupSkus(pick).length; return [`${n} SKU${n === 1 ? '' : 's'}`, skuPick(mainSku(pick))('Product code')]; },
        prices: [{ label: 'Landed', get: (pick) => currency(skuPick(mainSku(pick))('Landed cost £')), big: true }],
        gpLabel: 'GP',
        gp: (pick) => { const g = gpInfo(skuPick(mainSku(pick))); return { text: g.text, color: g.color }; },
        badges: groupBadges,
        stats: (rows, get) => {
          const pick = (r) => (key) => get(r.values, key);
          const skuCount = skuIndex.all.length;
          const needsAttn = rows.filter(r => groupBadges(pick(r)).length > 0).length;
          const cats = new Set(rows.map(r => pick(r)('Category')).filter(Boolean));
          const isShort = (pick) => { const m = mainSku(pick); return !!m && ['low', 'out'].includes(stockLevel(skuPick(m))?.state); };
          const short = stockByCode ? rows.filter(r => isShort(pick(r))).length : null;
          return [
            { l: 'Products', n: String(rows.length), u: `${skuCount} SKUs` },
            { l: 'Low or out of stock', n: short === null ? '…' : String(short), u: 'products', tone: short ? 'crit' : undefined, key: 'short', filter: isShort },
            { l: 'Needs attention', n: String(needsAttn), u: 'products', tone: needsAttn > 0 ? 'warn' : undefined, key: 'attention', filter: (pick) => groupBadges(pick).length > 0 },
            { l: 'Categories', n: String(cats.size), u: 'in use' }
          ];
        },
        kicker: (pick) => [pick('Category'), pick('ID')].filter(Boolean).join(' · '),
        detailSub: (pick) => { const s = skuPick(mainSku(pick)); const pr = s('Producer'), su = s('Default supplier'); return pr && su ? `${pr} · via ${su}` : (pr || su || ''); },
        emptyTitle: 'No products yet',
        emptySub: 'Use "Group SKUs into products" to build them from your SKUs, or add one.'
      },
      detailSection: { label: 'SKUs', first: true, render: (container, pick) => renderGroupSkus(container, pick) },
      // Every product's photo, so SKU cards and thumbnails show it too.
      onLoad: (rows, get) => {
        registerProductGroups(rows.map(r => ({ ID: get(r.values, 'ID'), 'Photo URL': get(r.values, 'Photo URL') })));
        skusTable?.then(p => p.rerender());
        openGroupSkus?.();
      }
    });
  }

  // The SKUs tab of a product: Wholesale (link / unlink / add), Shop and
  // Selfridges. Clicking a SKU opens its own record on top.
  function renderGroupSkus(container, pick) {
    const id = pick('ID');
    openGroupSkus = () => { if (container.isConnected) renderGroupSkus(container, pick); else openGroupSkus = null; };
    const shop = (pick('Shop SKU') || '').trim(), selfridges = (pick('Selfridges SKU') || '').trim();
    const wholesale = (skuIndex.byGroup[id] || []).filter(p => p['Product code'] !== shop && p['Product code'] !== selfridges)
      .sort((a, b) => (parseFloat(b['Nominal weight (kg)']) || 0) - (parseFloat(a['Nominal weight (kg)']) || 0));
    const unlinked = skuIndex.all.filter(p => !p['Group ID']).sort((a, b) => (a['Product name'] || '').localeCompare(b['Product name'] || ''));
    const col = skuIndex.groupCol;

    const skuRow = (p, removable) => `
      <div class="cz-sku" data-open-sku="${p.rowNumber}" title="Open this SKU">
        ${productThumb(p, 'xs')}
        <div class="cz-sku-t"><div class="cz-sku-name">${escapeHtml(p['Product name'])}</div>
          <div class="code">${escapeHtml(p['Product code'])}${p['Cut from (code)'] ? ` · cut from ${escapeHtml(p['Cut from (code)'])}` : ''}${p['Nominal weight (kg)'] ? ` · ${escapeHtml(p['Nominal weight (kg)'])}kg` : ''}</div></div>
        ${removable ? `<button type="button" class="sp-remove" data-unlink="${escapeHtml(p['Product code'])}" title="Take out of this product" aria-label="Take ${escapeHtml(p['Product name'])} out of this product"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
      </div>`;
    const channel = (label, code) => {
      if (!code) return `<div class="cz-empty">No ${label} SKU — set one under Details if it's sold there.</div>`;
      const p = skuIndex.byCode[code];
      return p ? skuRow(p, false) : `<div class="cz-sku"><span class="pthumb pthumb-xs"></span><div class="cz-sku-t"><div class="cz-sku-name">${escapeHtml(code)}</div><div class="code">Not in SKUs — likely only in Xero</div></div></div>`;
    };

    container.innerHTML = `
      <div class="sp-section">
        <div class="cz-channel"><h4>Wholesale <span class="code">${wholesale.length}</span></h4>
          ${wholesale.length ? wholesale.map(p => skuRow(p, true)).join('') : '<div class="cz-empty">No wholesale SKUs yet.</div>'}
          <div class="cz-link">
            <select id="pg_linkSel"><option value="">Add an existing SKU…</option>${unlinked.map(p => `<option value="${escapeHtml(p['Product code'])}">${escapeHtml(p['Product name'])} (${escapeHtml(p['Product code'])})</option>`).join('')}</select>
            <button type="button" class="btn ghost sm" id="pg_linkBtn">Add</button>
            <button type="button" class="btn ghost sm" id="pg_newBtn">+ New SKU</button>
          </div>
        </div>
        <div class="cz-channel"><h4>Shop</h4>${channel('Shop', shop)}</div>
        <div class="cz-channel"><h4>Selfridges</h4>${channel('Selfridges', selfridges)}</div>
      </div>`;

    const setGroup = async (code, value) => {
      const p = skuIndex.byCode[code];
      await sheetsUpdateRange(getStoredConfig().spreadsheetId, `Products!${col}${p.rowNumber}`, [[value]]);
      showToast(value ? `Added ${p['Product name']}` : `Took out ${p['Product name']}`);
      (await skusTable).reload(); // re-indexes, which re-renders this tab
    };
    container.querySelector('#pg_linkBtn').addEventListener('click', () => {
      const code = container.querySelector('#pg_linkSel').value;
      if (code) setGroup(code, id).catch(err => showToast('Couldn’t add: ' + err.message, 'error'));
    });
    container.querySelector('#pg_newBtn').addEventListener('click', async () =>
      (await skusTable).openAdd({ 'Group ID': id, 'Category': pick('Category') || '' }));
    container.querySelectorAll('[data-unlink]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      setGroup(b.dataset.unlink, '').catch(err => showToast('Couldn’t take it out: ' + err.message, 'error'));
    }));
    container.querySelectorAll('[data-open-sku]').forEach(r => r.addEventListener('click', () => skuOpenEdit?.(parseInt(r.dataset.openSku, 10))));
    enhanceSelect(container.querySelector('#pg_linkSel'));
  }

  // ---- views ----

  const VIEW_KEY = 'provisions_productsView';
  function readView() { try { return localStorage.getItem(VIEW_KEY) === 'skus' ? 'skus' : 'products'; } catch (e) { return 'products'; } }
  function setView(view) {
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
    // The inactive view's table is collapsed, not hidden, so its dialogs can
    // still open on top (a product's SKUs tab opens a SKU's record).
    document.querySelectorAll('[data-for]').forEach(el => {
      if (el.tagName === 'BUTTON') el.hidden = el.dataset.for !== view;
      else el.classList.toggle('view-off', el.dataset.for !== view);
    });
    document.querySelectorAll('[data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === view); b.setAttribute('aria-selected', b.dataset.view === view); });
    renderUngroupedNote();
  }

  // ---- grouping SKUs into products (re-runnable) ----
  //
  // A cut portion belongs to the whole it's "Cut from"; otherwise the
  // product is everything before " — " in the name ("Comté Petite 10/14M
  // — 1/4 wheel 9kg" → "Comté Petite 10/14M"), so a portion missing its
  // "Cut from" still lands with its whole. A name without " — " is a
  // product with one SKU, its trailing weight dropped ("Brie Dongé 3kg" →
  // "Brie Dongé") unless that would merge two sizes — different sizes stay
  // separate products ("Fig & Honey Chutney 210g" / "3kg"). A
  // "(Selfridges)" SKU fills the Selfridges slot of the one product with the
  // same name, or becomes a product of its own. SKUs already in a product
  // are left alone and a product that already exists by name is reused, so
  // it's safe to re-run; existing products missing a Category get their
  // SKUs' one.

  const SELFRIDGES_RE = /\s*\(Selfridges\)\s*$/i;
  const WEIGHT_RE = /\s+\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?\s*(?:kg|g|ml|l)$/i;

  function planGroups(skus, groups) {
    const byCode = Object.fromEntries(skus.map(p => [p['Product code'], p]));
    const rootOf = p => { let cur = p; for (let n = 0; n < 3 && cur['Cut from (code)'] && byCode[cur['Cut from (code)']]; n++) cur = byCode[cur['Cut from (code)']]; return cur; };
    const baseName = p => {
      const name = (p['Product name'] || '').replace(SELFRIDGES_RE, '').trim();
      const i = name.indexOf(' — ');
      return { name: i >= 0 ? name.slice(0, i).trim() : name, dashed: i >= 0 };
    };
    const candidates = skus.filter(p => !p['Group ID']);
    const plan = new Map();

    candidates.filter(p => !SELFRIDGES_RE.test(p['Product name'] || '')).forEach(p => {
      const { name, dashed } = baseName(rootOf(p));
      const key = searchNorm(name);
      if (!plan.has(key)) plan.set(key, { name, dashed, members: [], selfridges: '' });
      plan.get(key).members.push(p);
    });

    // Drop trailing weights where that keeps every name distinct, counting
    // products that already exist too.
    const stripped = g => g.dashed ? g.name : g.name.replace(WEIGHT_RE, '').trim();
    const counts = {};
    groups.forEach(g => { const k = searchNorm(g['Product name']); counts[k] = (counts[k] || 0) + 1; });
    plan.forEach(g => { const k = searchNorm(stripped(g)); counts[k] = (counts[k] || 0) + 1; });
    const existingNames = new Set(groups.map(g => searchNorm(g['Product name'])));
    plan.forEach(g => {
      const k = searchNorm(stripped(g));
      if (counts[k] === 1 || (counts[k] === 2 && existingNames.has(k) && searchNorm(g.name) === k)) g.name = stripped(g);
    });

    candidates.filter(p => SELFRIDGES_RE.test(p['Product name'] || '')).forEach(p => {
      const name = baseName(p).name;
      const k = searchNorm(name.replace(WEIGHT_RE, '').trim());
      const matches = [...plan.values()].filter(g => !g.selfridgesOnly && searchNorm(g.name.replace(WEIGHT_RE, '').trim()) === k);
      if (matches.length === 1 && !matches[0].selfridges) {
        matches[0].selfridges = p['Product code'];
        matches[0].members.push(p);
      } else {
        plan.set('selfridges:' + p['Product code'], { name: name.replace(WEIGHT_RE, '').trim() || name, dashed: false, members: [p], selfridges: p['Product code'], selfridgesOnly: true });
      }
    });

    const existingByName = Object.fromEntries(groups.map(g => [searchNorm(g['Product name']), g]));
    return [...plan.values()].map(g => {
      const wholesale = g.members.filter(p => p['Product code'] !== g.selfridges);
      const whole = wholesale.find(p => !p['Cut from (code)'] && /—\s*whole/i.test(p['Product name']))
        || wholesale.find(p => !p['Cut from (code)']) || g.members[0];
      const first = key => [whole, ...g.members].map(p => (p[key] || '').toString().trim()).find(Boolean) || '';
      const existing = existingByName[searchNorm(g.name)];
      return {
        name: g.name, existingId: existing ? existing.ID : '', members: g.members, wholesale, selfridges: g.selfridges,
        category: whole.Category || '',
        nominal: whole['Pricing basis'] === 'Per kg' && whole.Category === 'Cheese' ? (whole['Nominal weight (kg)'] || '') : '',
        photo: first('Photo URL'), techSheet: first('Tech sheet URL'), training: first('Training notes')
      };
    }).sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  }

  let grouping = null; // { plan, groupRows, fillCategory: [{ rowNumber, category }] }

  async function openGrouping() {
    const dlg = document.getElementById('groupDialog');
    const body = document.getElementById('groupBody');
    const applyBtn = document.getElementById('groupApplyBtn');
    body.innerHTML = '<div class="sp-loading">Reading SKUs…</div>';
    applyBtn.disabled = true;
    dlg.showModal();
    try {
      const groupRows = await sheetsGet(getStoredConfig().spreadsheetId, 'ProductGroups!A:Z').catch(() => null);
      if (!groupRows || !groupRows.length || !skuIndex.groupCol || !skuIndex.all.length) {
        body.innerHTML = `<div class="note">Re-run <a href="setup.html" style="color:inherit; text-decoration:underline;">Setup</a> first — it adds the ProductGroups tab and the Group ID column on Products.</div>`;
        return;
      }
      const [head, ...rest] = groupRows;
      const groups = rest.map((r, i) => ({ rowNumber: i + 2, ...Object.fromEntries(head.map((h, j) => [h, r[j] ?? ''])) }));
      const plan = planGroups(skuIndex.all, groups);
      const catIdx = head.indexOf('Category');
      const fillCategory = catIdx < 0 ? [] : groups
        .filter(g => !g.Category && (skuIndex.byGroup[g.ID] || []).some(p => p.Category))
        .map(g => ({ rowNumber: g.rowNumber, category: skuIndex.byGroup[g.ID].find(p => p.Category).Category, col: colLetter(catIdx + 1) }));
      grouping = { plan, groupRows, fillCategory };
      const newCount = plan.filter(g => !g.existingId).length;
      const linkCount = plan.reduce((n, g) => n + g.members.length, 0);
      if (!plan.length && !fillCategory.length) {
        body.innerHTML = '<div class="note ok">Every SKU is already in a product — nothing to do.</div>';
        return;
      }
      body.innerHTML = `
        <p style="margin:0 0 12px; font-size:13.5px;">This creates <strong>${newCount} product(s)</strong>${plan.length > newCount ? ` (and adds to ${plan.length - newCount} existing)` : ''} from <strong>${linkCount} SKU(s)</strong>${fillCategory.length ? `, and fills in the category on ${fillCategory.length} existing product(s)` : ''}. Nothing is deleted or renamed; SKU photos are copied onto the product. Check the grouping, then Create.</p>
        ${plan.length ? `<div class="scroll" style="max-height:52vh; overflow:auto;">
          <table><thead><tr><th>Product</th><th>Category</th><th>Wholesale SKUs</th><th>Selfridges</th></tr></thead>
          <tbody>${plan.map(g => `
            <tr>
              <td>${productCell({ 'Photo URL': g.photo }, `<strong>${escapeHtml(g.name)}</strong>${g.existingId ? ` <span class="tag t-amb">exists · ${escapeHtml(g.existingId)}</span>` : ''}`, 'xs')}</td>
              <td>${escapeHtml(g.category)}</td>
              <td class="code" style="white-space:normal;">${g.wholesale.map(p => escapeHtml(p['Product code'])).join(', ') || '—'}</td>
              <td class="code">${escapeHtml(g.selfridges) || '—'}</td>
            </tr>`).join('')}</tbody></table>
        </div>` : ''}`;
      applyBtn.textContent = newCount ? `Create ${newCount} product(s) from ${linkCount} SKU(s)`
        : plan.length ? `Add ${linkCount} SKU(s) to existing products` : 'Fill in categories';
      applyBtn.disabled = false;
    } catch (err) {
      body.innerHTML = `<div class="note">Couldn't read the sheet: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function applyGrouping() {
    const { plan, groupRows, fillCategory } = grouping;
    const cfg = getStoredConfig();
    const applyBtn = document.getElementById('groupApplyBtn');
    applyBtn.disabled = true;
    try {
      let base = groupRows;
      const newRows = [];
      plan.forEach(g => {
        if (g.existingId) { g.id = g.existingId; return; }
        g.id = nextId(base, 'PG');
        base = base.concat([[g.id]]);
        newRows.push([g.id, g.name, '', g.selfridges, g.nominal, g.photo, g.techSheet, g.training, '', 'Yes', g.category]);
      });
      if (newRows.length) await sheetsAppendRows(cfg.spreadsheetId, 'ProductGroups!A:K', newRows);
      const writes = plan.flatMap(g => g.members.map(p => ({ range: `Products!${skuIndex.groupCol}${p.rowNumber}`, values: [[g.id]] })))
        .concat(fillCategory.map(f => ({ range: `ProductGroups!${f.col}${f.rowNumber}`, values: [[f.category]] })));
      for (let i = 0; i < writes.length; i += 200) await sheetsBatchUpdateValues(cfg.spreadsheetId, writes.slice(i, i + 200));
      document.getElementById('groupDialog').close();
      showToast(`Created ${newRows.length} product(s)${fillCategory.length ? `, filled ${fillCategory.length} categories` : ''}`);
      (await groupsTable).reload();
      (await skusTable).reload();
    } catch (err) {
      applyBtn.disabled = false;
      document.getElementById('groupBody').insertAdjacentHTML('afterbegin', `<div class="note">Error: ${escapeHtml(err.message)} — it's safe to try again; anything already written is reused.</div>`);
    }
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    // The SKUs view: one row per SKU (the Products tab).
    const products = initCrudTable({
      mount: '#productsMount',
      title: 'SKUs',
      tab: 'Products',
      headers: ['Product code','Product name','Category','Default supplier','Producer','Storage','Ordering unit','Units per case','Pricing basis','Nominal weight (kg)','Cost price £','Landed cost £','GP at list','Tolerance band (%)','Cut from (code)','Cut shelf life (days)','Part-cut shelf life (days)','Target pack weight (kg)','Xero item code','Xero account code','VAT rate','Active','Sellable','Notes','Photo URL','Reorder threshold','Tech sheet URL','Training notes','Group ID'],
      autoId: null,
      fields: [
        { key: 'Product code', label: 'Product code', type: 'text', required: true, placeholder: 'e.g. CCS050' },
        { key: 'Product name', label: 'Product name', type: 'text', required: true, placeholder: 'e.g. Brie Dongé 3kg', primary: true },
        { key: 'Category', label: 'Category', type: 'select', options: ['Biscuits','Charcuterie','Cheese','Condiment','Deli & Snacks','Jam','Non-Food','Oil','Pasta','Preserved Veg','Pâté & Terrine','Ready Meals','Tinned Fish','Vinegar'] },
        { key: 'Default supplier', label: 'Default supplier', type: 'ref', refTab: 'Suppliers', refValue: 'Supplier name' },
        { key: 'Producer', label: 'Producer', type: 'text' },
        { key: 'Storage', label: 'Storage', type: 'select', options: ['Ambient', 'Chilled'] },
        { key: 'Ordering unit', label: 'Ordering unit', type: 'select', options: ['Case', 'Unit'] },
        { key: 'Units per case', label: 'Units per case', type: 'number' },
        { key: 'Pricing basis', label: 'Pricing basis', type: 'select', options: ['Per kg', 'Per unit'] },
        { key: 'Nominal weight (kg)', label: 'Nominal weight (kg)', type: 'number' },
        { key: 'Cost price £', label: 'Cost price (£)', type: 'number', format: 'currency' },
        { key: 'Landed cost £', label: 'Landed cost (£)', type: 'number', format: 'currency' },
        { key: 'GP at list', label: 'GP at list', type: 'text', placeholder: 'e.g. 31.20% — usually a formula, edit with care' },
        { key: 'Tolerance band (%)', label: 'Tolerance band (%)', type: 'number' },
        { key: 'Cut from (code)', label: 'Cut from (code)', type: 'text', placeholder: 'Whole product this is cut from, if any' },
        { key: 'Cut shelf life (days)', label: 'Cut shelf life (days)', type: 'number' },
        { key: 'Part-cut shelf life (days)', label: 'Part-cut shelf life (days)', type: 'number' },
        { key: 'Target pack weight (kg)', label: 'Target pack weight (kg)', type: 'number' },
        { key: 'Xero item code', label: 'Xero item code', type: 'text' },
        { key: 'Xero account code', label: 'Xero account code', type: 'text' },
        { key: 'VAT rate', label: 'VAT rate', type: 'select', options: ['20% (VAT on income)', 'Zero rated income'] },
        { key: 'Active', label: 'Active', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' },
        { key: 'Sellable', label: 'Sellable', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' },
        { key: 'Notes', label: 'Notes', type: 'textarea' },
        { key: 'Photo URL', label: 'Photo', type: 'image', placeholder: 'https://... — usually set via Bulk upload photos' },
        { key: 'Reorder threshold', label: 'Reorder threshold', type: 'number', placeholder: 'On-hand qty below this is flagged as low stock' },
        {
          key: 'Tech sheet URL', label: 'Tech sheet', type: 'file', section: 'Docs & training',
          placeholder: 'https://... — paste a link, or upload a file below',
          onUpload: async (file, getField) => {
            const cfg = getStoredConfig();
            const token = tryResumeSession();
            if (!token || !cfg.spreadsheetId) throw new Error('Sign in on the Dashboard first.');
            const code = getField('Product code');
            if (!code) throw new Error('Enter a product code first.');
            const folderId = await driveEnsureDocsFolder(token);
            return driveUploadProductDoc(folderId, code, file, token);
          }
        },
        {
          key: 'Training notes', label: 'Training sheet', type: 'textarea', section: 'Docs & training',
          placeholder: 'Everything staff should know handling this product — cutting, storage, allergens, talking points...'
        },
        { key: 'Group ID', label: 'Product', type: 'text', placeholder: "e.g. PG012 — usually set from the product's SKUs tab" }
      ],
      // Feeds the product cards (their SKUs, stock and photos) — and so
      // re-runs after every SKU save.
      onLoad: (rows, get, openEdit) => { skuOpenEdit = openEdit; indexSkus(rows, get); },
      inlineEdit: true,
      catalogue: {
        layout: 'cards',
        stock: stockFigure,
        tabsBy: 'Category',
        groupBy: 'Category',
        // The product's photo when it has one (one upload covers all its SKUs).
        photo: (pick) => productPhoto({ 'Photo URL': pick('Photo URL'), 'Group ID': pick('Group ID'), 'Cut from (code)': pick('Cut from (code)') }),
        name: 'Product name',
        tag: (pick) => ({ text: pick('Storage'), on: pick('Storage') === 'Chilled' }),
        sub: (pick) => [pick('Producer'), pick('Default supplier')].filter(Boolean).join(' · '),
        meta: (pick) => [pick('Product code'), packLabel(pick)],
        prices: [
          { label: 'Cost', get: (pick) => currency(pick('Cost price £')) },
          { label: 'Landed', get: (pick) => currency(pick('Landed cost £')), big: true }
        ],
        gpLabel: 'GP',
        gp: (pick) => { const g = gpInfo(pick); return { text: g.text, color: g.color }; },
        badges: rowBadges,
        stats: (rows, get) => {
          const pick = (r) => (key) => get(r.values, key);
          const active = rows.filter(r => (pick(r)('Active') || '').toUpperCase() === 'YES').length;
          const gps = rows.map(r => gpInfo(pick(r)).value).filter(v => v !== null);
          const avgGp = gps.length ? gps.reduce((a, b) => a + b, 0) / gps.length : null;
          const needsAttn = rows.filter(r => rowBadges(pick(r)).length > 0).length;
          const cats = new Set(rows.map(r => pick(r)('Category')).filter(Boolean));
          const isShort = (pick) => ['low', 'out'].includes(stockLevel(pick)?.state);
          const short = stockByCode ? rows.filter(r => isShort(pick(r))).length : null;
          return [
            { l: 'Active', n: String(active), u: `of ${rows.length}` },
            { l: 'Low or out of stock', n: short === null ? '…' : String(short), u: 'products', tone: short ? 'crit' : undefined, key: 'short', filter: isShort },
            { l: 'Average GP', n: avgGp === null ? '—' : `${avgGp.toFixed(1)}%`, u: 'at list' },
            { l: 'Needs attention', n: String(needsAttn), u: 'records', tone: needsAttn > 0 ? 'warn' : undefined, key: 'attention', filter: (pick) => rowBadges(pick).length > 0 },
            { l: 'Categories', n: String(cats.size), u: 'in use' }
          ];
        },
        kicker: (pick) => [pick('Category'), pick('Product code')].filter(Boolean).join(' · '),
        detailSub: (pick) => {
          const producer = pick('Producer'), supplier = pick('Default supplier');
          return producer && supplier ? `${producer} · via ${supplier}` : (producer || supplier || '');
        },
        emptyTitle: 'No SKUs yet',
        emptySub: 'Add your first SKU, or use Bulk photos once your SKUs are in.'
      }
    });
    skusTable = products;
    groupsTable = initGroupsTable();

    loadStock().then(() => { products.then(p => p.rerender()); groupsTable.then(g => g.rerender()); });

    document.getElementById('addProductBtn').addEventListener('click', () => groupsTable.then(g => g.openAdd()));
    document.getElementById('addSkuBtn').addEventListener('click', () => products.then(p => p.openAdd()));
    document.getElementById('groupBtn').addEventListener('click', openGrouping);
    document.getElementById('groupApplyBtn').addEventListener('click', applyGrouping);
    document.querySelectorAll('#groupDialog [data-close]').forEach(b => b.addEventListener('click', () => document.getElementById('groupDialog').close()));
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    setView(readView());

    initBulkPhotosUpload(products);
  });

  // Bulk photo upload: match each selected file's name (minus extension) to
  // a Products.Product code, upload matched files to the app's Drive photos
  // folder (js/drive.js), and write the resulting URL into that row's
  // Photo URL cell directly via the Sheets API — this bypasses the crud-page
  // add/edit dialog entirely since it's writing many rows at once.
  function initBulkPhotosUpload(productsTable) {
    const dialog = document.getElementById('photosDialog');
    const fileInput = document.getElementById('photosFileInput');
    const preview = document.getElementById('photosPreview');
    const statusEl = document.getElementById('photosStatus');
    const openBtn = document.getElementById('bulkPhotosBtn');
    const closeBtn = document.getElementById('photosCloseBtn');
    const closeX = document.getElementById('photosCloseX');
    const uploadBtn = document.getElementById('photosUploadBtn');
    let selectedFiles = [];

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
    }

    function baseName(filename) {
      return filename.replace(/\.[^.]+$/, '').trim();
    }

    function renderPreview(codesUC) {
      if (!selectedFiles.length) { preview.innerHTML = ''; return; }
      preview.innerHTML = `<table style="width:100%; font-size:12.5px;"><tbody>` + selectedFiles.map(f => {
        const code = baseName(f.name);
        const matched = codesUC.has(code.toUpperCase());
        return `<tr><td>${escapeHtml(f.name)}</td><td class="mono">${escapeHtml(code)}</td><td>${matched ? '<span class="tag t-ok">Match</span>' : '<span class="tag t-crit">No match</span>'}</td></tr>`;
      }).join('') + `</tbody></table>`;
    }

    openBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      preview.innerHTML = '';
      setStatus('');
      dialog.showModal();
    });
    closeBtn.addEventListener('click', () => dialog.close());
    closeX.addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

    fileInput.addEventListener('change', async () => {
      selectedFiles = [...fileInput.files];
      if (!selectedFiles.length) { preview.innerHTML = ''; setStatus(''); return; }
      setStatus('Checking product codes...');
      try {
        const cfg = getStoredConfig();
        const token = tryResumeSession();
        if (!token || !cfg.spreadsheetId) throw new Error('Sign in on the Dashboard first.');
        const rows = await sheetsGet(cfg.spreadsheetId, 'Products!A:A', token);
        const codesUC = new Set(rows.slice(1).map(r => (r[0] || '').toString().trim().toUpperCase()).filter(Boolean));
        renderPreview(codesUC);
        const matchedCount = selectedFiles.filter(f => codesUC.has(baseName(f.name).toUpperCase())).length;
        setStatus(`${matchedCount} of ${selectedFiles.length} file(s) match a product code.`);
      } catch (err) {
        setStatus('Error checking product codes: ' + err.message, 'error');
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFiles.length) { setStatus('Choose image files first.', 'error'); return; }
      const cfg = getStoredConfig();
      const token = tryResumeSession();
      if (!token || !cfg.spreadsheetId) { setStatus('Sign in on the Dashboard first.', 'error'); return; }

      uploadBtn.disabled = true;
      try {
        setStatus('Reading Products sheet...');
        const rows = await sheetsGet(cfg.spreadsheetId, 'Products!A:Z', token);
        const header = rows[0] || [];
        const codeIdx = header.indexOf('Product code');
        const photoIdx = header.indexOf('Photo URL');
        if (codeIdx === -1 || photoIdx === -1) throw new Error('Run Setup first — Products is missing the Photo URL column.');
        const photoCol = colLetter(photoIdx + 1);

        const codeToRow = new Map();      // exact Product code -> sheet row number
        const codeToRowUC = new Map();    // uppercased fallback, for forgiving filename matches
        rows.slice(1).forEach((r, i) => {
          const code = (r[codeIdx] || '').toString().trim();
          if (!code) return;
          const rowNumber = i + 2;
          codeToRow.set(code, rowNumber);
          codeToRowUC.set(code.toUpperCase(), rowNumber);
        });

        setStatus('Preparing Drive folder...');
        const folderId = await driveEnsureFolder(token);

        let uploaded = 0;
        const unmatched = [];
        const failed = [];
        for (const file of selectedFiles) {
          const rawCode = baseName(file.name);
          const rowNumber = codeToRow.get(rawCode) ?? codeToRowUC.get(rawCode.toUpperCase());
          if (!rowNumber) { unmatched.push(file.name); continue; }
          setStatus(`Uploading ${file.name} (${uploaded + unmatched.length + failed.length + 1}/${selectedFiles.length})...`);
          try {
            const url = await driveUploadProductPhoto(folderId, rawCode, file, token);
            await sheetsUpdateRange(cfg.spreadsheetId, `Products!${photoCol}${rowNumber}:${photoCol}${rowNumber}`, [[url]], token, 'USER_ENTERED');
            uploaded++;
          } catch (err) {
            failed.push(`${file.name}: ${err.message}`);
          }
        }

        let summary = `Uploaded ${uploaded} of ${selectedFiles.length}.`;
        if (unmatched.length) summary += ` No matching product code for: ${unmatched.join(', ')}.`;
        if (failed.length) summary += ` Failed: ${failed.join('; ')}.`;
        setStatus(summary, (failed.length || unmatched.length) ? 'error' : 'ok');

        productsTable.then(p => p.reload());
      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });
  }
</script>
