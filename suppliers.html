<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Suppliers</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=19">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Suppliers</h2>
  <p class="sub">Who deliveries come from — keyed by supplier name. Import/dispatch rates and delivery-day fields support landed-cost and ordering-schedule work later.</p>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="suppliersMount"></div>
</main>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=1"></script>
<script src="js/util.js?v=2"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/searchable-select.js?v=1"></script>
<script src="js/crud-page.js?v=13"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    return ok;
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    initCrudTable({
      mount: '#suppliersMount',
      title: 'Suppliers',
      subtitle: 'Who deliveries come from — lead time, import/dispatch rates, and contact details.',
      tab: 'Suppliers',
      headers: ['Supplier name','Country','Currency','Lead time (weeks)','Import rate (%)','Dispatch rate (%)','Delivers from','Delivers to','Ordering schedule','Contact email','Notes'],
      autoId: null,
      inlineEdit: true,
      fields: [
        { key: 'Supplier name', label: 'Supplier name', type: 'text', required: true },
        { key: 'Country', label: 'Country', type: 'text', placeholder: 'e.g. France' },
        { key: 'Currency', label: 'Currency', type: 'text', placeholder: 'e.g. EUR' },
        { key: 'Lead time (weeks)', label: 'Lead time (weeks)', type: 'number' },
        { key: 'Import rate (%)', label: 'Import rate (%)', type: 'number' },
        { key: 'Dispatch rate (%)', label: 'Dispatch rate (%)', type: 'number' },
        { key: 'Delivers from', label: 'Delivers from', type: 'select', options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Exact date given'] },
        { key: 'Delivers to', label: 'Delivers to', type: 'select', options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Exact date given'] },
        { key: 'Ordering schedule', label: 'Ordering schedule', type: 'text', placeholder: 'e.g. Weekly by Monday 5pm' },
        { key: 'Contact email', label: 'Contact email', type: 'text' },
        { key: 'Notes', label: 'Notes', type: 'textarea' }
      ]
    });
  });
</script>
</body>
</html>
