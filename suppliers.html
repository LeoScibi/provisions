<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Suppliers</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=36">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Suppliers</h2>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="suppliersMount"></div>
</main>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=6"></script>
<script src="js/util.js?v=3"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/searchable-select.js?v=2"></script>
<script src="js/supplier-products.js?v=1"></script>
<script src="js/crud-page.js?v=21"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    return ok;
  }

  // ---- A supplier's products, shown inside its record (crud-page's
  // detailSection). Edits save straight to the SupplierProducts tab as you
  // make them — they're separate from the supplier's own Save button.
  const todayIso = () => new Date().toISOString().slice(0, 10);
  const money = v => (v === '' || v == null || isNaN(parseFloat(v))) ? '' : `£${parseFloat(v).toFixed(2)}`;

  async function renderSupplierProducts(container, supplier) {
    const cfg = getStoredConfig();
    container.innerHTML = `<div class="sp-section"><div class="sp-head"><h3>Products</h3></div><div class="sp-loading">Loading products…</div></div>`;
    let products, links;
    try {
      const [productRows, spLinks, groups] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Products!A:AZ'),
        loadSupplierProducts(cfg.spreadsheetId),
        loadProductGroups(cfg.spreadsheetId)
      ]);
      const [head = [], ...rows] = productRows;
      products = rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? '']))).filter(p => p['Product code']);
      registerProducts(products);
      registerProductGroups(groups);
      links = spLinks;
    } catch (err) {
      container.innerHTML = `<div class="sp-section"><div class="note">Couldn't load this supplier's products: ${escapeHtml(err.message)}</div></div>`;
      return;
    }
    const reload = () => renderSupplierProducts(container, supplier);
    const supplied = productsForSupplier(products, links, supplier);
    const others = products.filter(p => !supplied.some(e => e.product['Product code'] === p['Product code']))
      .sort((a, b) => (a['Product name'] || '').localeCompare(b['Product name'] || ''));

    container.innerHTML = `
      <div class="sp-section">
        <div class="sp-head">
          <h3>Products</h3><span class="code">${supplied.length}</span>
          <span class="sp-hint">Their code and cost save as you type.</span>
        </div>
        ${supplied.length ? `
        <div class="sp-cols"><span>Product</span><span>Their code</span><span>Cost £</span><span></span></div>
        <div class="sp-list">${supplied.map(({ product: p, link, isDefault }) => `
          <div class="sp-row" data-code="${escapeHtml(p['Product code'])}">
            ${productPhoto(p) ? `<img class="sp-photo" src="${escapeHtml(productPhoto(p))}" alt="">` : '<span class="sp-photo"></span>'}
            <div class="sp-info">
              <div class="sp-name">${escapeHtml(p['Product name'])}</div>
              <div class="sp-sub"><span class="code">${escapeHtml(p['Product code'])}</span>${p.Category ? ` · ${escapeHtml(p.Category)}` : ''}${isDefault ? ' <span class="tag t-ok">Default supplier</span>' : ''}</div>
            </div>
            <input class="sp-code" value="${escapeHtml(link?.obj['SUPPLIER PRODUCT CODE'] || '')}" placeholder="—" aria-label="${escapeHtml(supplier)}'s code for ${escapeHtml(p['Product name'])}">
            <input class="sp-cost" type="number" step="0.01" min="0" value="${escapeHtml(link?.obj['COST PRICE £'] || '')}"
              placeholder="${isDefault && p['Cost price £'] ? escapeHtml(money(p['Cost price £'])) : '—'}" aria-label="Cost from ${escapeHtml(supplier)}">
            ${isDefault
              ? '<span class="sp-remove-gap" title="Change the default supplier on the product itself"></span>'
              : `<button type="button" class="sp-remove" aria-label="Stop buying ${escapeHtml(p['Product name'])} from ${escapeHtml(supplier)}" title="Remove from this supplier"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`}
          </div>`).join('')}
        </div>` : `<div class="sp-empty">No products from this supplier yet. Add one below, or set it as a product's Default supplier.</div>`}
        <div class="sp-add">
          <select class="sp-add-product" aria-label="Product to add">
            <option value="">Add a product…</option>
            ${others.map(p => `<option value="${escapeHtml(p['Product code'])}">${escapeHtml(p['Product name'])} (${escapeHtml(p['Product code'])})</option>`).join('')}
          </select>
          <input class="sp-add-code" placeholder="Their code" aria-label="Supplier's product code">
          <input class="sp-add-cost" type="number" step="0.01" min="0" placeholder="Cost £" aria-label="Cost">
          <button type="button" class="btn sm sp-add-btn">Add</button>
        </div>
      </div>`;
    enhanceSelect(container.querySelector('.sp-add-product'));

    // Writes a row's code + cost: updates its link, or creates one for a
    // product that so far only counted through its Default supplier.
    async function saveRow(rowEl) {
      const entry = supplied.find(e => e.product['Product code'] === rowEl.dataset.code);
      const code = rowEl.querySelector('.sp-code').value.trim();
      const cost = rowEl.querySelector('.sp-cost').value.trim();
      try {
        if (entry.link) {
          const n = entry.link.rowNumber;
          await sheetsUpdateRange(cfg.spreadsheetId, `${SP_TAB}!D${n}:G${n}`, [[code, cost, entry.link.obj.NOTES || '', todayIso()]]);
          entry.link.obj['SUPPLIER PRODUCT CODE'] = code;
          entry.link.obj['COST PRICE £'] = cost;
        } else {
          if (!code && !cost) return;
          await addLink(entry.product['Product code'], code, cost);
          return reload();
        }
        showToast(`Saved ${entry.product['Product name']}.`);
      } catch (err) {
        showToast(`Couldn't save: ${err.message}`, 'error');
      }
    }

    async function addLink(productCode, code, cost) {
      const existing = await sheetsGet(cfg.spreadsheetId, SP_RANGE).catch(() => []);
      const id = nextId(existing.length ? existing : [SP_HEADERS], 'SP');
      await sheetsAppend(cfg.spreadsheetId, SP_RANGE, [id, supplier, productCode, code, cost, '', todayIso()]);
    }

    container.querySelectorAll('.sp-row input').forEach(input => {
      input.addEventListener('change', () => saveRow(input.closest('.sp-row')));
    });
    container.querySelectorAll('.sp-remove').forEach(btn => btn.addEventListener('click', async () => {
      const entry = supplied.find(e => e.product['Product code'] === btn.closest('.sp-row').dataset.code);
      if (!confirm(`Stop buying ${entry.product['Product name']} from ${supplier}?`)) return;
      try {
        await deleteSupplierProduct(cfg.spreadsheetId, entry.link.obj.ID);
        showToast(`Removed ${entry.product['Product name']} from ${supplier}.`);
        reload();
      } catch (err) {
        showToast(`Couldn't remove: ${err.message}`, 'error');
      }
    }));
    container.querySelector('.sp-add-btn').addEventListener('click', async () => {
      const productCode = container.querySelector('.sp-add-product').value;
      if (!productCode) { showToast('Pick a product to add.', 'error'); return; }
      try {
        await addLink(productCode, container.querySelector('.sp-add-code').value.trim(), container.querySelector('.sp-add-cost').value.trim());
        showToast(`Added to ${supplier}.`);
        reload();
      } catch (err) {
        showToast(`Couldn't add: ${err.message}`, 'error');
      }
    });
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    initCrudTable({
      mount: '#suppliersMount',
      title: 'Suppliers',
      tab: 'Suppliers',
      headers: ['Supplier name','Country','Currency','Lead time (weeks)','Import rate (%)','Dispatch rate (%)','Delivers from','Delivers to','Ordering schedule','Contact email','Notes'],
      autoId: null,
      inlineEdit: true,
      fields: [
        { key: 'Supplier name', label: 'Supplier name', type: 'text', required: true },
        { key: 'Country', label: 'Country', type: 'text', placeholder: 'e.g. France' },
        { key: 'Currency', label: 'Currency', type: 'text', placeholder: 'e.g. EUR' },
        { key: 'Lead time (weeks)', label: 'Lead time (weeks)', type: 'number' },
        { key: 'Import rate (%)', label: 'Import rate (%)', type: 'number' },
        { key: 'Dispatch rate (%)', label: 'Dispatch rate (%)', type: 'number' },
        { key: 'Delivers from', label: 'Delivers from', type: 'select', options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Exact date given'] },
        { key: 'Delivers to', label: 'Delivers to', type: 'select', options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Exact date given'] },
        { key: 'Ordering schedule', label: 'Ordering schedule', type: 'text', placeholder: 'e.g. Weekly by Monday 5pm' },
        { key: 'Contact email', label: 'Contact email', type: 'text' },
        { key: 'Notes', label: 'Notes', type: 'textarea' }
      ],
      detailSection: { label: 'Products', first: true, render: (container, pick) => renderSupplierProducts(container, pick('Supplier name')) }
    });
  });
</script>
</body>
</html>
