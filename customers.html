<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Customers</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Customers</h2>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="customersMount"></div>
</main>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=2"></script>
<script src="js/util.js?v=2"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/searchable-select.js?v=1"></script>
<script src="js/crud-page.js?v=18"></script>
<script>
  function requireAuth() {
    const cfg = getStoredConfig();
    const token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    return ok;
  }

  window.addEventListener('load', () => {
    if (!requireAuth()) return;

    initCrudTable({
      mount: '#customersMount',
      title: 'Customers',
      tab: 'Customers',
      headers: ['Customer name (as in Xero)','Your account ref','Delivery address','Delivery day','Delivery zone','Delivery route','Payment terms (days)','Direct Debit status','Min shelf life on receipt (days)','Price list','Discount (%)','Contact email','Active'],
      autoId: null,
      fields: [
        { key: 'Customer name (as in Xero)', label: 'Customer name (as in Xero)', type: 'text', required: true },
        { key: 'Your account ref', label: 'Your account ref', type: 'text' },
        { key: 'Delivery address', label: 'Delivery address', type: 'textarea' },
        { key: 'Delivery day', label: 'Delivery day', type: 'select', options: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] },
        { key: 'Delivery zone', label: 'Delivery zone', type: 'select', options: ['London', 'Out of London'] },
        { key: 'Delivery route', label: 'Delivery route', type: 'text' },
        { key: 'Payment terms (days)', label: 'Payment terms (days)', type: 'number' },
        { key: 'Direct Debit status', label: 'Direct Debit status', type: 'select', options: ['None', 'Active mandate', 'Lapsed'] },
        { key: 'Min shelf life on receipt (days)', label: 'Min shelf life on receipt (days)', type: 'number' },
        { key: 'Price list', label: 'Price list', type: 'select', options: ['Standard', 'P2P', 'Selfridges'] },
        { key: 'Discount (%)', label: 'Discount (%)', type: 'number' },
        { key: 'Contact email', label: 'Contact email', type: 'text' },
        { key: 'Active', label: 'Active', type: 'checkbox', trueValue: 'Yes', falseValue: 'No' }
      ]
    });
  });
</script>
</body>
</html>
