<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisions — Purchase Orders</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=34">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar no-print" id="topbar"></header>

<main>
  <h2>Purchase Orders</h2>

  <div id="signedOutNotice" class="note" style="display:none;">
    Not signed in — go to the <a href="index.html" style="color:inherit; text-decoration:underline;">Dashboard</a> to sign in. Your session will carry over here.
  </div>

  <div id="poCard" style="display:none;">
    <div class="panel-h" style="border:none; background:none; padding:0 0 8px;">
      <h3 style="text-transform:none; letter-spacing:normal; font-size:15px; color:var(--ink); font-weight:600;">Purchase Orders</h3>
      <button type="button" class="btn add-btn sm" id="newPoBtn" style="margin:0;">+ New PO</button>
      <button type="button" class="btn ghost sm" id="reloadBtn" style="margin:0;">Reload</button>
    </div>
    <div class="panel"><div class="scroll" style="overflow-x:auto;">
      <table id="poTable">
        <thead><tr><th>ID</th><th>Supplier</th><th>Order date</th><th>Expected delivery</th><th>Status</th><th class="num">Items</th></tr></thead>
        <tbody></tbody>
      </table>
    </div></div>
    <div id="status" class="mono" style="margin-top:8px; font-size:12.5px; color:var(--steel);"></div>
  </div>
</main>

<dialog id="poDialog">
  <form id="poForm"></form>
</dialog>

<script src="js/config.js?v=4"></script>
<script src="js/sheets.js?v=3"></script>
<script src="js/shell.js?v=6"></script>
<script src="js/util.js?v=3"></script>
<script src="js/stock-calc.js?v=2"></script>
<script src="js/product-ui.js?v=4"></script>
<script src="js/supplier-products.js?v=1"></script>
<script src="js/dialog-guard.js?v=1"></script>
<script src="js/daterange.js?v=1"></script>
<script src="js/searchable-select.js?v=2"></script>
<script>
  let token = null;
  let suppliers = [];
  let supplierLinks = []; // SupplierProducts — see js/supplier-products.js
  let products = [];
  let poRowsData = [];   // [{ rowNumber, obj }] from PurchaseOrders
  let polRowsData = [];  // [{ rowNumber, obj }] from PurchaseOrderLines
  let deliveriesData = [];   // flat objs from Deliveries — on-hand stock, per batch
  let allocationsData = [];  // flat objs from Allocations — stock already spoken for
  let ordersData = [];       // flat objs from Orders — which allocations have been dispatched
  let orderLinesData = [];   // flat objs from OrderLines
  let stockPos = {};         // computeStockPosition() result, refreshed each time the picker renders
  let draftLines = [];   // working line items while creating a PO
  let receiveLines = []; // working line items while receiving a PO
  let dateRangePicker = null;
  let dirtyCheck = null; // set per dialog mode; attachDiscardGuard calls it via a stable wrapper

  const statusEl = document.getElementById('status');
  const dialogEl = document.getElementById('poDialog');
  const form = document.getElementById('poForm');
  const guard = attachDiscardGuard(dialogEl, { scope: form, isDirtyOverride: () => dirtyCheck ? dirtyCheck() : false });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }

  function setDlgStatus(msg, kind) {
    const el = form.querySelector('#poDlgStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? 'var(--ok)' : 'var(--steel)';
  }

  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    const ok = !!(token && cfg.spreadsheetId);
    document.getElementById('signedOutNotice').style.display = ok ? 'none' : 'block';
    document.getElementById('poCard').style.display = ok ? 'block' : 'none';
    return ok;
  }

  async function ensureAuth(statusFn) {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    if (!token || !cfg.spreadsheetId) { (statusFn || setStatus)('Sign in on the Dashboard first.', 'error'); return null; }
    return cfg;
  }

  function toRowObjects(rows) {
    if (!rows.length) return [];
    const [head, ...rest] = rows;
    return rest.map((r, i) => {
      const o = {};
      head.forEach((h, idx) => { o[h] = r[idx] ?? ''; });
      return { rowNumber: i + 2, obj: o };
    });
  }

  function todayIso() { return new Date().toISOString().slice(0, 10); }

  function fmtDateShort(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function fmtDateRange(s, e) {
    if (!s) return '—';
    if (!e || e === s) return fmtDateShort(s);
    return `${fmtDateShort(s)} – ${fmtDateShort(e)}`;
  }

  function statusTag(status) {
    const s = status || 'Ordered';
    const cls = s === 'Delivered' ? 't-ok' : s === 'Cancelled' ? 't-crit' : 't-chill';
    return `<span class="tag ${cls}">${escapeHtml(s)}</span>`;
  }

  function productOf(code) {
    return products.find(p => p['Product code'] === code);
  }

  function productName(code) {
    const p = productOf(code);
    return p ? p['Product name'] : code;
  }

  // Landed cost (£) is tracked per the product's own unit (kg or piece,
  // matching Pricing basis) — same basis QTY ORDERED/qty is already in, so
  // no unit conversion is needed to get a line total.
  function landedCostFor(code) {
    const p = products.find(pr => pr['Product code'] === code);
    const n = p ? parseFloat(p['Landed cost £']) : NaN;
    return isNaN(n) ? 0 : n;
  }

  function currency(n) {
    return `£${n.toFixed(2)}`;
  }

  // Everything a supplier sells (its Default-supplier products plus any
  // linked on SupplierProducts) — but only as whole items: anything cut from
  // another product (Products' "Cut from (code)" field) is made in-house
  // from stock, never bought in directly.
  function orderableSupplierProducts(supplier) {
    return productsForSupplier(products, supplierLinks, supplier)
      .map(e => e.product)
      .filter(p => !(p['Cut from (code)'] || '').trim());
  }

  // Case-ordered products (Ordering unit = Case) can only be ordered in
  // whole cases — the +/- stepper below moves qty by one case at a time,
  // converted into the product's own tracked unit (kg or pc).
  function productOrderMeta(p) {
    const unit = p['Pricing basis'] === 'Per kg' ? 'kg' : 'pc';
    const perCase = parseFloat(p['Units per case']) || 0;
    const isCase = p['Ordering unit'] === 'Case' && perCase > 0;
    const nominalWeight = parseFloat(p['Nominal weight (kg)']) || 1;
    const step = isCase ? (unit === 'kg' ? perCase * nominalWeight : perCase) : 1;
    return { unit, isCase, perCase, step };
  }

  function roundQty(n) {
    return Math.round(n * 1000) / 1000;
  }

  // ---- load + list ----

  async function loadAll() {
    if (!requireAuth()) return;
    const cfg = getStoredConfig();
    setStatus('Loading...');
    try {
      const groupsP = loadProductGroups(cfg.spreadsheetId); // in parallel with the reads below
      const [supplierRows, productRows, poRows, polRows, deliveryRows, allocationRows, orderRows, lineRows, spLinks] = await Promise.all([
        sheetsGet(cfg.spreadsheetId, 'Suppliers!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Products!A:AZ', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Deliveries!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Allocations!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'Orders!A:Z', token),
        sheetsGet(cfg.spreadsheetId, 'OrderLines!A:Z', token),
        loadSupplierProducts(cfg.spreadsheetId)
      ]);
      supplierLinks = spLinks;
      suppliers = toRowObjects(supplierRows).map(r => r.obj);
      products = toRowObjects(productRows).map(r => r.obj);
      registerProducts(products);
      registerProductGroups(await groupsP);
      poRowsData = toRowObjects(poRows);
      polRowsData = toRowObjects(polRows);
      deliveriesData = toRowObjects(deliveryRows).map(r => r.obj);
      allocationsData = toRowObjects(allocationRows).map(r => r.obj);
      ordersData = toRowObjects(orderRows).map(r => r.obj);
      orderLinesData = toRowObjects(lineRows).map(r => r.obj);
      renderTable();
      setStatus(`Loaded ${poRowsData.length} purchase order(s).`, 'ok');
      checkDeepLink();
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  function sortPOs(list) {
    const rank = r => (r.obj.STATUS === 'Ordered' || !r.obj.STATUS) ? 0 : 1;
    return [...list].sort((a, b) => {
      const r = rank(a) - rank(b);
      if (r !== 0) return r;
      if (rank(a) === 0) return (a.obj['EXPECTED START DATE'] || '9999').localeCompare(b.obj['EXPECTED START DATE'] || '9999');
      return (b.obj['ORDER DATE'] || '').localeCompare(a.obj['ORDER DATE'] || '');
    });
  }

  function renderTable() {
    const tbody = document.querySelector('#poTable tbody');
    if (!poRowsData.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty" style="padding:18px;">No purchase orders yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = sortPOs(poRowsData).map(r => {
      const o = r.obj;
      const itemCount = polRowsData.filter(l => l.obj['PO ID'] === o.ID).length;
      return `<tr data-id="${escapeHtml(o.ID)}" style="cursor:pointer;">
        <td class="code">${escapeHtml(o.ID)}</td>
        <td>${escapeHtml(o.SUPPLIER)}</td>
        <td>${escapeHtml(fmtDateShort(o['ORDER DATE']))}</td>
        <td>${escapeHtml(fmtDateRange(o['EXPECTED START DATE'], o['EXPECTED END DATE']))}</td>
        <td>${statusTag(o.STATUS)}</td>
        <td class="num">${itemCount}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('poTable').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openViewDialog(tr.dataset.id);
  });

  // Deep link (?open=PO001) — used when a PO is opened in place from
  // another page (see openInPlace in js/shell.js). The param is stripped
  // the first time, so later reloads find nothing to do.
  function checkDeepLink() {
    const id = new URLSearchParams(location.search).get('open');
    if (!id) return;
    history.replaceState(null, '', location.pathname);
    if (poRowsData.some(r => r.obj.ID === id)) openViewDialog(id);
    else window.embedNothingToShow?.();
  }

  attachOrderHoverCard(document.getElementById('poTable'), 'tr[data-id]', tr => {
    const po = poRowsData.find(r => r.obj.ID === tr.dataset.id);
    if (!po) return null;
    const o = po.obj;
    return {
      title: o.SUPPLIER, id: o.ID, status: o.STATUS || 'Ordered',
      meta: [
        `Ordered ${fmtDateShort(o['ORDER DATE'])}`,
        `Expected ${fmtDateRange(o['EXPECTED START DATE'], o['EXPECTED END DATE'])}`,
        o.NOTES ? `Note: ${o.NOTES}` : ''
      ],
      lines: polRowsData.filter(l => l.obj['PO ID'] === o.ID).map(l => ({
        product: productOf(l.obj['PRODUCT CODE']),
        name: productName(l.obj['PRODUCT CODE']),
        qty: qtyUnit(l.obj['QTY ORDERED'], l.obj.UNIT)
      }))
    };
  });

  // ---- create PO ----

  function renderCreateForm() {
    draftLines = [];
    form.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">New Purchase Order</div>
        </div>
        <button type="button" class="dlg-close" data-cancel aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-b">
        <div class="row">
          <div class="col field">
            <label>Supplier *</label>
            <select id="po_supplier"><option value="">Select a supplier…</option>${suppliers.map(s => `<option value="${escapeHtml(s['Supplier name'])}">${escapeHtml(s['Supplier name'])}</option>`).join('')}</select>
          </div>
          <div class="col field">
            <label>Order date</label>
            <input type="date" id="po_orderDate" value="${todayIso()}">
          </div>
        </div>
        <div class="field">
          <label>Expected delivery *</label>
          <div id="po_dateRange" class="daterange"></div>
        </div>

        <div class="field">
          <label>Products</label>
          <input type="search" id="po_productSearch" placeholder="Search products by name or code..." style="margin-bottom:10px;">
          <div id="po_productPicker"></div>
          <div id="po_orderSummary" class="mono" style="margin-top:10px; font-size:13px; color:var(--steel); text-align:right;"></div>
        </div>

        <div class="field" style="margin-top:12px;">
          <label>Notes</label>
          <textarea id="po_notes" placeholder="Optional"></textarea>
        </div>
        <div id="poDlgStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn" id="poSubmitBtn">Create PO</button>
      </div>
    `;
    dateRangePicker = createDateRangePicker({ mount: '#po_dateRange' });

    const supplierSel = form.querySelector('#po_supplier');
    const searchInput = form.querySelector('#po_productSearch');
    enhanceSelect(supplierSel);
    renderProductPicker(supplierSel.value);

    dirtyCheck = () => !!supplierSel.value || draftLines.length > 0
      || !!form.querySelector('#po_notes').value.trim()
      || !!dateRangePicker.getRange().start;

    form.onchange = (e) => {
      if (e.target !== supplierSel) return;
      draftLines = []; // staged lines belonged to the old supplier's catalog
      searchInput.value = '';
      renderProductPicker(supplierSel.value);
    };

    searchInput.addEventListener('input', () => renderProductPicker(supplierSel.value));

    form.onclick = (e) => {
      if (e.target.closest('[data-cancel]')) { guard.guardedClose(); return; }
      const stepBtn = e.target.closest('[data-step]');
      if (stepBtn) { adjustDraftQty(stepBtn.dataset.code, parseInt(stepBtn.dataset.step, 10)); return; }
    };

    form.oninput = (e) => {
      const qtyInput = e.target.closest('.stepper-qty-input');
      if (qtyInput) handleQtyInput(qtyInput.dataset.code);
    };
    // Selects the field's existing value on focus so typing a new qty (e.g.
    // 100) doesn't require clearing the old one first.
    form.addEventListener('focus', (e) => {
      if (e.target.classList && e.target.classList.contains('stepper-qty-input')) e.target.select();
    }, true);

    form.onsubmit = handleCreateSubmit;
  }

  function renderProductPicker(supplier) {
    const mount = form.querySelector('#po_productPicker');
    if (!supplier) {
      mount.innerHTML = `<div class="empty" style="padding:12px 0;">Pick a supplier first.</div>`;
      renderOrderSummary();
      return;
    }
    stockPos = computeStockPosition({
      deliveries: deliveriesData, allocations: allocationsData,
      orders: ordersData, orderLines: orderLinesData,
      purchaseOrders: poRowsData.map(r => r.obj), poLines: polRowsData.map(r => r.obj)
    });
    let supplierProducts = orderableSupplierProducts(supplier);
    if (!supplierProducts.length) {
      mount.innerHTML = `<div class="empty" style="padding:12px 0;">No orderable products set up for this supplier — anything cut from another product doesn't show here.</div>`;
      renderOrderSummary();
      return;
    }
    const term = searchNorm((form.querySelector('#po_productSearch').value || '').trim());
    if (term) {
      supplierProducts = supplierProducts.filter(p =>
        searchMatch(p['Product name'], term) || searchMatch(p['Product code'], term));
    }
    if (!supplierProducts.length) {
      mount.innerHTML = `<div class="empty" style="padding:12px 0;">No products match "${escapeHtml(term)}".</div>`;
      renderOrderSummary();
      return;
    }
    const byCategory = new Map();
    supplierProducts
      .slice()
      .sort((a, b) => a['Product name'].localeCompare(b['Product name']))
      .forEach(p => {
        const cat = p['Category'] || 'Uncategorised';
        if (!byCategory.has(cat)) byCategory.set(cat, []);
        byCategory.get(cat).push(p);
      });
    mount.innerHTML = [...byCategory.keys()].sort().map(cat => `
      <div class="cat-group">
        <div class="cat-group-head"><span class="g-name">${escapeHtml(cat)}</span><span class="g-count">${byCategory.get(cat).length}</span></div>
        ${byCategory.get(cat).map(productPickerRowHtml).join('')}
      </div>
    `).join('');
    renderOrderSummary();
  }

  function renderOrderSummary() {
    const el = form.querySelector('#po_orderSummary');
    if (!el) return;
    if (!draftLines.length) { el.textContent = ''; return; }
    const total = draftLines.reduce((sum, l) => sum + l.qty * landedCostFor(l.code), 0);
    const itemCount = draftLines.length;
    el.textContent = `Estimated landed cost: ${currency(total)} across ${itemCount} item${itemCount === 1 ? '' : 's'}`;
  }

  function productPickerRowHtml(p) {
    const code = p['Product code'];
    const meta = productOrderMeta(p);
    const line = draftLines.find(l => l.code === code);
    const qty = line ? line.qty : 0;
    const photoUrl = productPhoto(p);
    const photoHtml = photoUrl
      ? `<img class="cr-photo" src="${escapeHtml(photoUrl)}" alt="" loading="lazy">`
      : `<span class="cr-photo"></span>`;
    const subText = [p['Producer'], meta.isCase ? `${meta.perCase} × ${meta.unit === 'kg' ? (parseFloat(p['Nominal weight (kg)']) || '?') + 'kg' : '1 piece'} per case` : `Ordered per ${meta.unit === 'kg' ? 'kg' : 'piece'}`].filter(Boolean).join(' · ');
    return `
      <div class="cat-row picker-row" data-code="${escapeHtml(code)}">
        ${photoHtml}
        <div class="cr-info">
          <div class="cr-name-line"><span class="cr-name">${escapeHtml(p['Product name'])}</span></div>
          <div class="cr-sub">${escapeHtml(subText)}</div>
          ${stockPositionHtml(stockPos[code], meta.unit)}
        </div>
        <div class="cr-stepper">
          <button type="button" class="stepper-btn" data-step="-1" data-code="${escapeHtml(code)}" ${qty <= 0 ? 'disabled' : ''} aria-label="Remove one">−</button>
          <div class="stepper-qty">${stepperQtyInputHtml(qty, meta, code)}</div>
          <button type="button" class="stepper-btn" data-step="1" data-code="${escapeHtml(code)}" aria-label="Add one">+</button>
        </div>
      </div>`;
  }

  // The qty cell is a real <input> (not just +/- buttons) so a large or
  // fractional quantity (100 cases, 1.6kg) can be typed directly instead of
  // clicked one step at a time. Case items show/edit the case count, with
  // the equivalent kg or piece total underneath; non-case items edit that
  // tracked unit directly, decimals allowed for kg.
  function stepperQtyInputHtml(qty, meta, code) {
    const displayQty = qty > 0 ? (meta.isCase ? roundQty(qty / meta.step) : qty) : '';
    const step = meta.isCase ? '1' : (meta.unit === 'kg' ? '0.01' : '1');
    const suffix = meta.isCase ? `case${roundQty(qty / meta.step) === 1 ? '' : 's'}` : unitLabel(meta.unit);
    const sub = meta.isCase ? `<span class="stepper-sub">${qty > 0 ? qtyUnit(qty, meta.unit) : ''}</span>` : '';
    return `
      <input type="number" class="stepper-qty-input" data-code="${escapeHtml(code)}" value="${displayQty}" placeholder="0" min="0" step="${step}">
      <span class="stepper-unit-suffix">${escapeHtml(suffix)}</span>
      ${sub}
    `;
  }

  // Both the +/- buttons and typing into the qty <input> land here — the
  // buttons pass a code+direction, direct input passes the code and reads
  // its own field. `skipInputValue` avoids re-writing the input mid-keystroke.
  function setDraftQty(code, qty, meta, p) {
    const line = draftLines.find(l => l.code === code);
    if (qty <= 0) {
      draftLines = draftLines.filter(l => l.code !== code);
    } else if (line) {
      line.qty = qty;
    } else {
      draftLines.push({ code, name: p['Product name'], qty, unit: meta.unit });
    }
  }

  function updateStepperRow(code, qty, meta, opts = {}) {
    const row = form.querySelector(`.picker-row[data-code="${CSS.escape(code)}"]`);
    if (!row) return;
    if (!opts.skipInputValue) {
      row.querySelector('.stepper-qty-input').value = qty > 0 ? (meta.isCase ? roundQty(qty / meta.step) : qty) : '';
    }
    const suffix = row.querySelector('.stepper-unit-suffix');
    if (suffix && meta.isCase) suffix.textContent = `case${roundQty(qty / meta.step) === 1 ? '' : 's'}`;
    const sub = row.querySelector('.stepper-sub');
    if (sub) sub.textContent = qty > 0 ? qtyUnit(qty, meta.unit) : '';
    row.querySelector('[data-step="-1"]').disabled = qty <= 0;
  }

  function adjustDraftQty(code, dir) {
    const p = products.find(pr => pr['Product code'] === code);
    if (!p) return;
    const meta = productOrderMeta(p);
    const line = draftLines.find(l => l.code === code);
    const qty = Math.max(0, roundQty((line ? line.qty : 0) + dir * meta.step));
    setDraftQty(code, qty, meta, p);
    updateStepperRow(code, qty, meta);
    renderOrderSummary();
  }

  // Typing directly into a picker row's qty <input> — for a case item the
  // typed number is a case count (converted to the tracked unit); otherwise
  // it's the tracked unit itself (kg allows decimals, e.g. 1.6).
  function handleQtyInput(code) {
    const p = products.find(pr => pr['Product code'] === code);
    if (!p) return;
    const meta = productOrderMeta(p);
    const row = form.querySelector(`.picker-row[data-code="${CSS.escape(code)}"]`);
    if (!row) return;
    const entered = parseFloat(row.querySelector('.stepper-qty-input').value);
    const clean = isNaN(entered) || entered < 0 ? 0 : entered;
    const qty = roundQty(meta.isCase ? clean * meta.step : clean);
    setDraftQty(code, qty, meta, p);
    updateStepperRow(code, qty, meta, { skipInputValue: true });
    renderOrderSummary();
  }

  async function handleCreateSubmit(e) {
    e.preventDefault();
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;

    const supplier = form.querySelector('#po_supplier').value;
    const orderDate = form.querySelector('#po_orderDate').value;
    const { start, end } = dateRangePicker.getRange();
    if (!supplier) { setDlgStatus('Pick a supplier.', 'error'); return; }
    if (!start) { setDlgStatus('Pick an expected delivery date.', 'error'); return; }
    if (!draftLines.length) { setDlgStatus('Add at least one item.', 'error'); return; }

    setDlgStatus('Creating PO...');
    try {
      const notes = form.querySelector('#po_notes').value.trim();
      const existingPO = await sheetsGet(cfg.spreadsheetId, 'PurchaseOrders!A:A', token);
      const poId = nextId(existingPO.length ? existingPO : [['ID']], 'PO');
      await sheetsAppend(cfg.spreadsheetId, 'PurchaseOrders!A:G', [poId, supplier, orderDate, start, end || start, 'Ordered', notes], token);

      const existingLines = await sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:A', token);
      let base = existingLines.length ? existingLines : [['ID']];
      const lineRows = draftLines.map(l => {
        const lineId = nextId(base, 'POL');
        base = base.concat([[lineId]]);
        return [lineId, poId, l.code, l.qty, l.unit, '', '', '', 'Ordered'];
      });
      await sheetsAppendRows(cfg.spreadsheetId, 'PurchaseOrderLines!A:I', lineRows, token);

      dialogEl.close();
      setStatus(`Purchase order ${poId} created.`, 'ok');
      loadAll();
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- view / copy / cancel ----

  function openViewDialog(poId) {
    const po = poRowsData.find(r => r.obj.ID === poId);
    if (!po) return;
    const lines = polRowsData.filter(l => l.obj['PO ID'] === poId);
    renderViewForm(po, lines);
    dialogEl.showModal();
    guard.arm();
  }

  function renderViewForm(po, lines) {
    dirtyCheck = null; // read-only — nothing here can be lost
    const isOrdered = po.obj.STATUS === 'Ordered' || !po.obj.STATUS;
    const itemsHtml = lines.map(l => `
      <tr>
        <td>${productCell(productOf(l.obj['PRODUCT CODE']), escapeHtml(productName(l.obj['PRODUCT CODE'])))}</td>
        <td class="num">${escapeHtml(l.obj['QTY ORDERED'])}</td>
        <td>${unitLabel(l.obj.UNIT)}</td>
        ${!isOrdered ? `<td class="num">${escapeHtml(l.obj['QTY RECEIVED'])}</td><td>${escapeHtml(l.obj['LOT NUMBER'])}</td><td>${escapeHtml(l.obj['BEST BEFORE DATE'])}</td>` : ''}
      </tr>
    `).join('');

    form.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">${escapeHtml(po.obj.ID)} — ${escapeHtml(po.obj.SUPPLIER)} ${statusTag(po.obj.STATUS)}</div>
          <div class="subtitle">Placed ${escapeHtml(fmtDateShort(po.obj['ORDER DATE']))} · expected ${escapeHtml(fmtDateRange(po.obj['EXPECTED START DATE'], po.obj['EXPECTED END DATE']))}.</div>
        </div>
        <button type="button" class="dlg-close" data-cancel aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-b">
        <table class="form">
          <thead><tr><th>Product</th><th class="num">Ordered</th><th>Unit</th>${!isOrdered ? '<th class="num">Received</th><th>Lot</th><th>Best before</th>' : ''}</tr></thead>
          <tbody>${itemsHtml || `<tr><td colspan="${isOrdered ? 3 : 6}" class="empty" style="padding:12px;">No items.</td></tr>`}</tbody>
        </table>
        ${lines.length ? `<div class="mono" style="margin-top:8px; font-size:13px; color:var(--steel); text-align:right;">Estimated landed cost: ${currency(lines.reduce((sum, l) => sum + (parseFloat(l.obj['QTY ORDERED']) || 0) * landedCostFor(l.obj['PRODUCT CODE']), 0))}</div>` : ''}
        ${po.obj.NOTES ? `<div class="field" style="margin-top:12px;"><label>Notes</label><div>${escapeHtml(po.obj.NOTES)}</div></div>` : ''}
        <div id="poDlgStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-cancel>Close</button>
        <button type="button" class="btn ghost" id="poCopyBtn">Copy to clipboard</button>
        ${isOrdered ? `<button type="button" class="btn danger" id="poCancelBtn">Cancel PO</button><button type="button" class="btn" id="poReceiveBtn">Mark as delivered</button>` : ''}
      </div>
    `;

    form.onsubmit = (e) => e.preventDefault();
    form.onchange = null;
    form.onclick = (e) => {
      if (e.target.closest('[data-cancel]')) { guard.guardedClose(); return; }
      if (e.target.closest('#poCopyBtn')) { copyPoToClipboard(lines); return; }
      if (e.target.closest('#poCancelBtn')) { handleCancelPo(po); return; }
      if (e.target.closest('#poReceiveBtn')) { renderReceiveForm(po, lines); guard.arm(); }
    };
  }

  async function copyPoToClipboard(lines) {
    const text = lines.map(l => `${productName(l.obj['PRODUCT CODE'])} — ${l.obj['QTY ORDERED']} ${unitLabel(l.obj.UNIT)}`).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      setDlgStatus('Copied to clipboard.', 'ok');
    } catch (err) {
      setDlgStatus('Could not copy: ' + err.message, 'error');
    }
  }

  async function handleCancelPo(po) {
    if (!confirm(`Cancel purchase order ${po.obj.ID}? This can't be undone.`)) return;
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;
    try {
      await sheetsUpdateRange(cfg.spreadsheetId, `PurchaseOrders!F${po.rowNumber}:F${po.rowNumber}`, [['Cancelled']], token, 'USER_ENTERED');
      dialogEl.close();
      setStatus(`${po.obj.ID} cancelled.`, 'ok');
      loadAll();
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- mark as delivered ----

  function renderReceiveForm(po, lines) {
    receiveLines = lines.map(l => ({
      lineId: l.obj.ID, rowNumber: l.rowNumber, code: l.obj['PRODUCT CODE'], name: productName(l.obj['PRODUCT CODE']),
      unit: l.obj.UNIT || 'kg', isNew: false, lots: [{ qty: l.obj['QTY ORDERED'], lot: '', bbe: '' }]
    }));
    const initialSnapshot = JSON.stringify(receiveLines);
    dirtyCheck = () => JSON.stringify(receiveLines) !== initialSnapshot;

    const supplierProducts = productsForSupplier(products, supplierLinks, po.obj.SUPPLIER)
      .map(e => e.product)
      .filter(p => !receiveLines.some(l => l.code === p['Product code']));

    form.innerHTML = `
      <div class="dlg-h">
        <div>
          <div class="ttl">Mark ${escapeHtml(po.obj.ID)} as delivered</div>
        </div>
        <button type="button" class="dlg-close" data-cancel aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-b">
        <p class="sub" style="margin-bottom:12px;">A lot number and best-before date is required for anything you're receiving.</p>
        <table class="form" id="po_receiveTable">
          <thead><tr><th>Product</th><th class="num">Qty</th><th>Unit</th><th>Lot number</th><th>Best before</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="field" style="margin-top:10px;">
          <label>Add item not on the original order</label>
          <div class="inline">
            <div class="field" style="flex:2; margin-bottom:0;">
              <select id="po_recvAddProduct">
                <option value="">${supplierProducts.length ? 'Select a product…' : 'No other products for this supplier'}</option>
                ${supplierProducts.map(p => `<option value="${escapeHtml(p['Product code'])}">${escapeHtml(p['Product name'])}</option>`).join('')}
              </select>
            </div>
            <button type="button" class="btn ghost sm" id="po_recvAddBtn">+ Add</button>
          </div>
        </div>
        <div id="poDlgStatus" class="mono" style="margin-top:10px; font-size:12.5px; color:var(--steel);"></div>
      </div>
      <div class="dlg-f">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn" id="poSubmitBtn">Confirm delivery</button>
      </div>
    `;
    renderReceiveRows();
    enhanceSelect(form.querySelector('#po_recvAddProduct'));

    form.onclick = (e) => {
      if (e.target.closest('[data-cancel]')) { guard.guardedClose(); return; }
      const addLotBtn = e.target.closest('[data-recv-addlot]');
      if (addLotBtn) {
        const li = parseInt(addLotBtn.dataset.recvAddlot, 10);
        receiveLines[li].lots.push({ qty: '', lot: '', bbe: '' });
        renderReceiveRows();
        return;
      }
      const rmBtn = e.target.closest('[data-recv-remove]');
      if (rmBtn) {
        const [li, lj] = rmBtn.dataset.recvRemove.split(':').map(n => parseInt(n, 10));
        const line = receiveLines[li];
        if (line.lots.length > 1) line.lots.splice(lj, 1);
        else if (line.isNew) receiveLines.splice(li, 1);
        else line.lots[0] = { qty: '0', lot: '', bbe: '' };
        renderReceiveRows();
        return;
      }
      if (e.target.closest('#po_recvAddBtn')) {
        const sel = form.querySelector('#po_recvAddProduct');
        const code = sel.value;
        if (!code) { setDlgStatus('Pick a product first.', 'error'); return; }
        receiveLines.push({ lineId: null, rowNumber: null, code, name: productName(code), unit: 'kg', isNew: true, lots: [{ qty: '', lot: '', bbe: '' }] });
        sel.value = '';
        sel.querySelector(`option[value="${CSS.escape(code)}"]`)?.remove();
        setDlgStatus('');
        renderReceiveRows();
      }
    };
    const syncField = (e) => {
      const tr = e.target.closest('tr[data-li]');
      const f = e.target.dataset.f;
      if (!tr || !f) return;
      const li = parseInt(tr.dataset.li, 10);
      if (f === 'unit') { receiveLines[li].unit = e.target.value; return; }
      receiveLines[li].lots[parseInt(tr.dataset.lj, 10)][f] = e.target.value;
    };
    form.oninput = syncField;
    form.onchange = syncField;
    form.onsubmit = (e) => handleReceiveSubmit(e, po);
  }

  function renderReceiveRows() {
    const tbody = form.querySelector('#po_receiveTable tbody');
    if (!receiveLines.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty" style="padding:12px;">Nothing left to receive.</td></tr>`;
      return;
    }
    tbody.innerHTML = receiveLines.map((l, li) => l.lots.map((lot, lj) => {
      const first = lj === 0;
      const last = lj === l.lots.length - 1;
      return `
      <tr data-li="${li}" data-lj="${lj}">
        ${first ? `<td rowspan="${l.lots.length}">${productCell(productOf(l.code), `${escapeHtml(l.name)}${l.isNew ? ' <span class="tag t-chill">Extra</span>' : ''}`)}</td>` : ''}
        <td class="num"><input type="number" step="any" data-f="qty" value="${escapeHtml(lot.qty)}" style="width:70px;"></td>
        ${first ? `<td rowspan="${l.lots.length}"><select data-f="unit" style="width:70px;"><option value="kg"${l.unit === 'kg' ? ' selected' : ''}>kg</option><option value="pc"${l.unit === 'pc' ? ' selected' : ''}>Pieces</option></select></td>` : ''}
        <td><input type="text" data-f="lot" value="${escapeHtml(lot.lot)}" placeholder="e.g. H-2831" style="width:110px;"></td>
        <td><input type="date" data-f="bbe" value="${escapeHtml(lot.bbe)}"></td>
        <td style="white-space:nowrap;">${last ? `<button type="button" class="btn ghost sm" data-recv-addlot="${li}">+ Lot</button> ` : ''}<button type="button" class="btn ghost sm" data-recv-remove="${li}:${lj}">Remove</button></td>
      </tr>
    `;
    }).join('')).join('');
  }

  async function handleReceiveSubmit(e, po) {
    e.preventDefault();
    const cfg = await ensureAuth(setDlgStatus);
    if (!cfg) return;

    const toReceive = [];
    for (const l of receiveLines) {
      for (const lot of l.lots) {
        if (parseFloat(lot.qty) > 0) toReceive.push({ code: l.code, name: l.name, unit: l.unit, qty: lot.qty, lot: lot.lot, bbe: lot.bbe });
      }
    }
    for (const l of toReceive) {
      if (!l.lot || !l.lot.trim()) { setDlgStatus(`Enter a lot number for ${l.name}.`, 'error'); return; }
      if (!l.bbe) { setDlgStatus(`Enter a best-before date for ${l.name}.`, 'error'); return; }
    }

    setDlgStatus('Recording delivery...');
    try {
      if (toReceive.length) {
        const existingDel = await sheetsGet(cfg.spreadsheetId, 'Deliveries!A:A', token);
        let delBase = existingDel.length ? existingDel : [['ID']];
        const deliveryRows = toReceive.map(l => {
          const id = nextId(delBase, 'DEL');
          delBase = delBase.concat([[id]]);
          return [id, todayIso(), po.obj.SUPPLIER, l.code, l.lot.trim(), l.bbe, parseFloat(l.qty), l.unit, '', po.obj.ID];
        });
        await sheetsAppendRows(cfg.spreadsheetId, 'Deliveries!A:J', deliveryRows, token);
      }

      const existingLines = await sheetsGet(cfg.spreadsheetId, 'PurchaseOrderLines!A:A', token);
      let polBase = existingLines.length ? existingLines : [['ID']];
      const newLineRows = [];
      for (const l of receiveLines) {
        const receivedLots = l.lots.filter(lot => parseFloat(lot.qty) > 0);
        const totalQty = receivedLots.reduce((sum, lot) => sum + parseFloat(lot.qty), 0);
        const delivered = totalQty > 0;
        const status = delivered ? 'Delivered' : 'Not delivered';
        const lotNumbers = receivedLots.map(lot => lot.lot.trim()).join(', ');
        const bbeDates = receivedLots.map(lot => lot.bbe).join(', ');
        if (l.isNew) {
          const id = nextId(polBase, 'POL');
          polBase = polBase.concat([[id]]);
          newLineRows.push([id, po.obj.ID, l.code, '', l.unit, delivered ? totalQty : '', delivered ? lotNumbers : '', delivered ? bbeDates : '', status]);
        } else {
          await sheetsUpdateRange(cfg.spreadsheetId, `PurchaseOrderLines!F${l.rowNumber}:I${l.rowNumber}`, [[delivered ? totalQty : '', delivered ? lotNumbers : '', delivered ? bbeDates : '', status]], token, 'USER_ENTERED');
        }
      }
      if (newLineRows.length) await sheetsAppendRows(cfg.spreadsheetId, 'PurchaseOrderLines!A:I', newLineRows, token);

      await sheetsUpdateRange(cfg.spreadsheetId, `PurchaseOrders!F${po.rowNumber}:F${po.rowNumber}`, [['Delivered']], token, 'USER_ENTERED');

      dialogEl.close();
      setStatus(`${po.obj.ID} marked as delivered.`, 'ok');
      loadAll();
    } catch (err) {
      setDlgStatus('Error: ' + err.message, 'error');
    }
  }

  // ---- wiring ----

  document.getElementById('newPoBtn').addEventListener('click', () => {
    renderCreateForm();
    dialogEl.showModal();
    guard.arm();
  });
  document.getElementById('reloadBtn').addEventListener('click', loadAll);

  window.addEventListener('load', loadAll);
</script>
</body>
</html>
